name: Secret Scan

# Scans the commits a pull request adds for committed credentials with gitleaks,
# using the rules in .gitleaks.toml (gitleaks' defaults plus repo-specific ones).
#
# Only the PR's own commits are scanned (base..head), not the full history, so a
# finding points at something this PR introduced. Findings are printed with the
# secret value redacted: this repository and its CI logs are public. No report
# file is uploaded.
#
# A finding fails the job. Fix it by removing the value from the branch history
# (amend or rebase, then force-push the PR branch) and rotating the credential:
# once pushed, treat it as disclosed. For a false positive, use an obvious
# placeholder, extend the allowlist in .gitleaks.toml, or add a `gitleaks:allow`
# comment to the line.
#
# gitleaks is downloaded from its GitHub release and verified against a pinned
# SHA-256. To upgrade, bump GITLEAKS_VERSION and GITLEAKS_SHA256 together (the
# hash is the linux_x64 line of the release's checksums.txt).

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks (new commits)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version

      - name: Scan new commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          range="${BASE_SHA}..${HEAD_SHA}"
          echo "Scanning $(git rev-list --count --no-merges "$range") commit(s) in $range"

          rc=0
          "$RUNNER_TEMP/gitleaks" git . \
            --config .gitleaks.toml \
            --log-opts="$range" \
            --redact \
            --no-banner \
            --report-format json \
            --report-path "$RUNNER_TEMP/gitleaks.json" || rc=$?

          if [ "$rc" -ne 0 ] && [ "$rc" -ne 1 ]; then
            echo "::error::gitleaks failed to run (exit $rc)"
            exit "$rc"
          fi

          count=$(jq 'length' "$RUNNER_TEMP/gitleaks.json")
          if [ "$rc" -eq 1 ] || [ "$count" -gt 0 ]; then
            # Rule id, file, line and commit only; the secret value is never printed.
            jq -r '.[] | "::error file=\(.File),line=\(.StartLine),title=Possible secret (\(.RuleID))::\(.Description) in commit \(.Commit[0:12]). Remove it from the branch history and rotate it, or allowlist it in .gitleaks.toml if it is not a real credential."' \
              "$RUNNER_TEMP/gitleaks.json"
            echo "gitleaks found $count possible secret(s)."
            exit 1
          fi
          echo "No secrets found."
