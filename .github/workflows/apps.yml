name: App suites

# The `apps/*` unit suites and the `apps/*` typecheck, in one job. They lived in lint.yml (the
# `App unit tests` job and the `Typecheck apps` step of `Package unit tests`) and ran on every
# PR. Moved here so a `paths:` filter can keep them off PRs that cannot change their verdict.
#
# Why: the plan's org-wide concurrent-job limit is saturated by Lint, so every job a PR run
# starts queues someone else's. Replayed over the last 80 PRs merged to `main` (2026-10-29), the
# filter below matches 30; the other 50 could not change these suites' verdict and start no run.
# Each of them used to pay a whole job (~8m test step) plus a ~2.5m typecheck step.
#
# ── THE PATHS FILTER, AND WHERE EACH NON-OBVIOUS ENTRY COMES FROM ────────────────────────────
#
# Native `paths`, so a non-matching PR starts no run at all (not a skipped job: no check-run).
# The apps do not import the root app's `src/`; their `../src/` imports are each app's own.
# What they DO read outside `apps/` and `packages/` was found by scanning every file under
# `apps/` for `../../`-style paths, and `scripts/ci/assert-apps-paths-filter.mjs` re-derives
# that list on every run of this job and fails when an entry is missing or matches nothing.
# So when it fails, add the path it names here; do not weaken the scan.
#
#   vitest.config.mts + scripts/test-cache/{core,sequencer,load-core}.mjs +
#   scripts/ci/component-quarantine.mjs
#       `vitest --project 'app:*'` loads the ROOT config (which imports these) before any app
#       config, and its root-level sequencer applies to the whole run.
#   scripts/queued-check*.mjs, scripts/ci/assert-workspace-suites-ran.mjs,
#   scripts/ci/typecheck-apps.mjs, scripts/ci/assert-apps-paths-filter.mjs
#       what the steps below run (`test:apps:run` is `node scripts/queued-check.mjs apps`).
#   scripts/generate-slim-schema.js, scripts/prisma-*-generator.mjs
#       the root `postinstall` (`db:generate`) runs them during `pnpm install`, and they write
#       the generated `@civitai/db-schema` sources most apps import.
#   src/components/Account/creator-score-copy.ts
#       read by apps/creator-studio's creator-score-tips test (the one root `src/` file any app
#       touches; it pins the app's copy against the main app's).
#   containers/notification-db/docker-init/**
#       the DDL apps/notifications' behavioural test builds its database from.
#   package.json
#       also read directly by apps/assistant-runner's SDK version tests.
#
# Not listed: `event-engine-common` and `.gitmodules`. Nothing under `apps/` imports the
# submodule and the job's checkout does not fetch it, so a pin change cannot affect this job.
#
# Not listed on purpose: `scripts/test-unit-run.mjs`. queued-check only imports it when it
# queues a run, and it never queues when `CI` is set.
#
# Nothing hangs when this skips: `main` and `release` have no required_status_checks (verified
# 2026-10-29 via the branch-protection and rulesets APIs). If this check ever becomes required,
# a PR that skips it would wait forever, so the filter would have to go.
#
# ── DRAFTS ───────────────────────────────────────────────────────────────────────────────────
#
# Same rule as lint.yml: a draft PR runs ESLint only, so this job skips on a draft and starts
# when the PR is marked ready (`ready_for_review`, which the default `types` list omits). Want
# a verdict on a draft? `gh workflow run apps.yml -R civitai/civitai --ref <branch>`, or add the
# `full-ci` label.
#
# ── THE `full-ci` LABEL ──────────────────────────────────────────────────────────────────────
#
# Same label as lint.yml (read its header): on a PR carrying `full-ci` the draft gate is lifted.
# `types` deliberately omits `labeled`; full-ci.yml dispatches this workflow when the label is
# added. That first, dispatched run is NOT path-filtered (`paths:` applies to pull_request
# events only); later pushes are: a PR that touches nothing these suites read starts no PR run
# here even with the label.
#
# ── PUSH TO `main` IS UNFILTERED ─────────────────────────────────────────────────────────────
#
# Every commit on `main` gets a verdict whatever it touched. That is the backstop for a filter
# entry that is missing: the break shows red on `main` right after the merge, instead of never.
on:
  pull_request:
    branches: [main, release]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.npmrc'
      - '.nvmrc'
      - 'patches/**'
      - 'tsconfig.json'
      - '.github/workflows/apps.yml'
      - 'vitest.config.mts'
      - 'scripts/test-cache/core.mjs'
      - 'scripts/test-cache/sequencer.mjs'
      - 'scripts/test-cache/load-core.mjs'
      - 'scripts/ci/component-quarantine.mjs'
      - 'scripts/queued-check.mjs'
      - 'scripts/queued-check-rules.mjs'
      - 'scripts/ci/assert-workspace-suites-ran.mjs'
      - 'scripts/ci/typecheck-apps.mjs'
      - 'scripts/ci/assert-apps-paths-filter.mjs'
      - 'scripts/generate-slim-schema.js'
      - 'scripts/prisma-enum-generator.mjs'
      - 'scripts/prisma-updated-at-generator.mjs'
      - 'src/components/Account/creator-score-copy.ts'
      - 'containers/notification-db/docker-init/**'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One group per ref, as in lint.yml: a new push to a PR cancels its in-flight run, and a newer
# commit on `main` cancels the older one's run (the newest run checks a tree containing every
# older commit, so `main` keeps a verdict). A `ready_for_review` run shares the PR's group, so
# it cancels a still-running draft run, which is what we want. Dispatches get their own
# `dispatch-` groups so one on `main` cannot cancel the push run.
concurrency:
  group: apps-${{ github.event_name == 'workflow_dispatch' && format('dispatch-{0}', github.ref) || github.ref }}
  cancel-in-progress: true

jobs:
  apps:
    # The name earlier comments across the repo cite. Renaming is safe: neither `main` nor
    # `release` has any required_status_checks (re-verified 2026-10-29), so no merge gate keys
    # on it.
    name: App unit tests + typecheck
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft || contains(github.event.pull_request.labels.*.name, 'full-ci')
    # The `apps/*` suites had never once run in CI before this job existed (369 tests across
    # five apps then): the root config registered `packages/*/vitest.config.*` as projects and
    # nothing for `apps/*`. And the root `pnpm run typecheck` is bounded by the root tsconfig
    # `include`, which has no `apps/*` entry, so the typecheck step below is the only one the
    # apps get.
    #
    # Not `continue-on-error`: no browser and no Next module graph. A red here does not block a
    # merge (`main` has no required_status_checks); it is a signal someone has to look at.
    #
    # 🔴 THE TIMEOUT IS SHARED BY BOTH SUITES, AND THAT IS WHAT ONCE CANCELLED THE TYPECHECK. It
    # left this job when the tests grew into a 15m limit and took a short typecheck down with
    # them; 16 of 162 runs were cancelled at 15m (2026-10-19/20). Measured over the last 40 green
    # Lint runs (2026-10-29): test step p50 8.3m / max 8.7m (n=36), typecheck p50 2.6m / max 2.7m
    # (n=22), install ~40s. So ~12m against 30m. The typecheck runs FIRST so a hung or slow test
    # step cannot take its verdict with it. Nearly all of the test time is the moderator app's
    # pglite suites: speed those up or shard this job before raising the limit.
    timeout-minutes: 30
    # A real Postgres for apps/assistant-runner, whose runs are DBOS workflows. Its *.pg.test.ts
    # files fail in CI without the URL (they skip only outside CI). The suites create and drop their
    # own databases on this throwaway server.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 2s --health-retries 15
    env:
      ASSISTANT_RUNNER_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      # No `submodules: true`: nothing under `apps/` imports event-engine-common (the
      # out-of-tree scan in scripts/ci/assert-apps-paths-filter.mjs would list it if one did),
      # and it is not a pnpm workspace member, so neither the install nor the suites read it.
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        id: install
        run: pnpm install --frozen-lockfile

      # Deliberately ONE step driving a script, not one `pnpm --filter` step per app. Per-app
      # steps abort at the first red app, so a shared type change that breaks several of them
      # reports one; and `pnpm --filter <name>` EXITS 0 WHEN THE NAME MATCHES NOTHING (measured,
      # pnpm 10.28.1 — it prints "No projects matched the filters" and succeeds), so a hardcoded
      # list of package names is one chance per app for a rename to turn this gate into a green
      # no-op. The script derives the app set from disk, proves each filter selected a real
      # package, and collects every failure. See its header.
      - name: Typecheck apps
        run: node scripts/ci/typecheck-apps.mjs

      # `!cancelled()` so a red typecheck does not hide this verdict; gated on the install
      # rather than on the step above, because tests without `node_modules` would only restate
      # the install failure.
      - name: App unit tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm run test:apps:run --reporter=default --reporter=json --outputFile=apps-report.json

      # A green vitest run is a claim, not evidence, and this positive control earns its keep
      # harder here than for packages: the projects are named by hand (`app:auth`, ...), so an
      # app that loses its `test.name` stops being selected while the others keep the run green
      # and exit 0. Measured, not assumed — see the script header. `always()` so it runs after
      # a red suite, which is the case it exists for.
      - name: Assert every app suite actually ran
        if: always()
        run: node scripts/ci/assert-workspace-suites-ran.mjs apps-report.json apps

      # Re-derives what the `paths:` filter above must contain and fails on a missing or stale
      # entry. See the header and the script.
      - name: Paths filter covers what the app suites read
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node scripts/ci/assert-apps-paths-filter.mjs
