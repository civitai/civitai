name: App suites

# The `apps/*` unit suites and the `apps/*` typecheck, in two parallel jobs. They lived in lint.yml (the
# `App unit tests` job and the `Typecheck apps` step of `Package unit tests`) and ran on every
# PR. Moved here so a `paths:` filter can keep them off PRs that cannot change their verdict.
#
# Why: the plan's org-wide concurrent-job limit is saturated by Lint, so every job a PR run
# starts queues someone else's. Replayed over the last 80 PRs merged to `main` (2026-10-29), the
# filter below matches 30; the other 50 could not change these suites' verdict and start no run.
# Each of them used to pay a whole job (~8m test step) plus a ~2.5m typecheck step.
#
# ── THE PATHS FILTER, AND WHERE EACH NON-OBVIOUS ENTRY COMES FROM ────────────────────────────
#
# Native `paths`, so a non-matching PR starts no run at all (not a skipped job: no check-run).
# The apps do not import the root app's `src/`; their `../src/` imports are each app's own.
# What they DO read outside `apps/` and `packages/` was found by scanning every file under
# `apps/` for `../../`-style paths, and `scripts/ci/assert-apps-paths-filter.mjs` re-derives
# that list on every run of this job and fails when an entry is missing or matches nothing.
# So when it fails, add the path it names here; do not weaken the scan.
#
#   vitest.config.mts + scripts/test-cache/{core,sequencer,load-core}.mjs
#       `vitest --project 'app:*'` loads the ROOT config (which imports these) before any app
#       config, and its root-level sequencer applies to the whole run.
#   scripts/ci/assert-workspace-suites-ran.mjs, scripts/ci/typecheck-apps.mjs,
#   scripts/ci/assert-apps-paths-filter.mjs, scripts/ci/app-suite-scope.mjs
#       what the steps below run. (The test step calls vitest itself rather than
#       `test:apps:run`/queued-check; see it.)
#   scripts/generate-slim-schema.js, scripts/prisma-*-generator.mjs
#       the root `postinstall` (`db:generate`) runs them during `pnpm install`, and they write
#       the generated `@civitai/db-schema` sources most apps import.
#   src/components/Account/creator-score-copy.ts
#       read by apps/creator-studio's creator-score-tips test (it pins the app's copy against the
#       main app's).
#   src/server/utils/__tests__/redis-lua-harness.ts
#       the real-Lua redis harness apps/auth's device tests run their scripts through.
#   src/server/services/block-token.service.ts, src/server/services/block-token-subject.ts,
#   src/server/middleware/block-scope.middleware.ts, src/server/common/enums.ts,
#   src/shared/constants/browsingLevel.constants.ts, src/server/services/apps/data-read-grant.ts
#       read by apps/auth's block-exchange test, which pins the hub's copies of the site's block-token
#       constants (issuer, audience, subject pattern, kid, age cap, clock tolerance, the mature
#       browsing-level bits) and its one-approved-block rule to them.
#   containers/notification-db/docker-init/**
#       the DDL apps/notifications' behavioural test builds its database from.
#   package.json
#       also read directly by apps/assistant-runner's SDK version tests.
#
# Not listed: `event-engine-common` and `.gitmodules`. Nothing under `apps/` imports the
# submodule and the job's checkout does not fetch it, so a pin change cannot affect this job.
#
# Nothing hangs when this skips: `main` and `release` have no required_status_checks (verified
# 2026-10-29 via the branch-protection and rulesets APIs). If this check ever becomes required,
# a PR that skips it would wait forever, so the filter would have to go.
#
# ── DRAFTS ───────────────────────────────────────────────────────────────────────────────────
#
# Same rule as lint.yml: a draft PR runs ESLint only, so this job skips on a draft and starts
# when the PR is marked ready (`ready_for_review`, which the default `types` list omits). Want
# a verdict on a draft? `gh workflow run apps.yml -R civitai/civitai --ref <branch>`, or add the
# `full-ci` label.
#
# ── THE `full-ci` LABEL ──────────────────────────────────────────────────────────────────────
#
# Same label as lint.yml (read its header): on a PR carrying `full-ci` the draft gate is lifted.
# `types` deliberately omits `labeled`; full-ci.yml dispatches this workflow when the label is
# added to a draft PR (on a ready PR, the PR's own run here is not draft-gated, so nothing is
# dispatched). That first, dispatched run is NOT path-filtered (`paths:` applies to pull_request
# events only); later pushes are: a PR that touches nothing these suites read starts no PR run
# here, label or not.
#
# ── PUSH TO `main` USES THE SAME FILTER ────────────────────────────────────────────────────────
#
# `push:` reads the same list as `pull_request:` (the `app-inputs` YAML anchor), so a push to
# `main` that touches nothing these suites read starts no run. Push used to be unfiltered, as the
# backstop for a filter entry that is missing. That backstop still holds, later: a push run is
# never scoped (every app suite runs, see below), so the next push that touches anything in the
# list goes red on such a break, and scripts/ci/assert-apps-paths-filter.mjs names the missing
# entry when its scan can see it. What is lost is attribution: the red lands on that later
# commit, not on the one that caused it.
#
# Why: once push runs queued instead of cancelling (#8877), every push run that started reached
# its end (a pending one is still replaced by a newer push) and this job's push cost doubled. docs/testing/reading-ci-results.md has the measurement.
#
# ── ON A PR, THE MODERATOR SUITE RUNS ONLY WHEN SOMETHING IT READS CHANGED ───────────────────
#
# It is most of this job's test time (937 s of ~1,110 s summed per-file time, 2026-10-31). The
# `Scope app suites` step leaves it out of a pull_request run when every changed file sits in an
# app or package it does not read, derived from the code each run (scripts/ci/app-suite-scope.mjs:
# workspace dependencies and `@scope/name` imports, transitively). Every other app
# always runs; any file outside `apps/` and `packages/` runs everything; push and dispatch runs
# are never scoped. The suites ledger excuses a left-out suite only after listing the changed
# files from git itself and re-deriving the skip, and fails if the suite ran anyway.
on:
  pull_request:
    branches: [main, release]
    types: [opened, synchronize, reopened, ready_for_review]
    # `push:` below reuses this list (see the header).
    paths: &app-inputs
      - 'apps/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.npmrc'
      - '.nvmrc'
      - 'patches/**'
      - 'tsconfig.json'
      - '.github/workflows/apps.yml'
      - 'vitest.config.mts'
      - 'scripts/test-cache/core.mjs'
      - 'scripts/test-cache/sequencer.mjs'
      - 'scripts/test-cache/load-core.mjs'
      - 'scripts/ci/assert-workspace-suites-ran.mjs'
      - 'scripts/ci/typecheck-apps.mjs'
      - 'scripts/ci/assert-apps-paths-filter.mjs'
      - 'scripts/ci/app-suite-scope.mjs'
      - 'scripts/generate-slim-schema.js'
      - 'scripts/prisma-enum-generator.mjs'
      - 'scripts/prisma-updated-at-generator.mjs'
      - 'src/components/Account/creator-score-copy.ts'
      - 'src/server/services/crucible-bradley-terry.ts'
      - 'src/server/utils/__tests__/redis-lua-harness.ts'
      - 'src/server/services/block-token.service.ts'
      - 'src/server/services/block-token-subject.ts'
      - 'src/server/middleware/block-scope.middleware.ts'
      - 'src/server/common/enums.ts'
      - 'src/shared/constants/browsingLevel.constants.ts'
      - 'src/server/services/apps/data-read-grant.ts'
      - 'src/server/services/knights/**'
      - 'containers/notification-db/docker-init/**'
  push:
    branches: [main]
    paths: *app-inputs
  workflow_dispatch:

permissions:
  contents: read

# One group per ref, as in lint.yml: a new push to a PR cancels its in-flight run. On `main` the
# group queues instead, for the reason in lint.yml's `concurrency` comment: the running push run
# finishes and only the newest waiting push runs after it. A `ready_for_review` run shares the PR's group, so
# it cancels a still-running draft run, which is what we want. Dispatches get their own
# `dispatch-` groups so one on `main` cannot cancel the push run.
concurrency:
  group: apps-${{ github.event_name == 'workflow_dispatch' && format('dispatch-{0}', github.ref) || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  # The app typecheck, in its own job so it runs BESIDE the suites instead of before them. In one
  # job it sat on this workflow's critical path: over 6 green PR runs (2026-11-18) the `Typecheck
  # apps` step took 169-286 s ahead of a 253-936 s test step, and App suites (p50 ~18m over 3 days)
  # ran longer than Lint. The cost is one more checkout + install (~1.5 min of runner time, one
  # more slot of the org's concurrent-job limit) per run. It also ends the shared timeout the
  # `apps` job's comment describes: a slow test step can no longer cancel the typecheck.
  apps-typecheck:
    name: App typecheck
    runs-on: ${{ github.repository == 'civitai/civitai' && vars.CIVITAI_DC_OFF != 'true' && !endsWith(github.actor, '[bot]') && !endsWith(github.event.pull_request.user.login || '', '[bot]') && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && (github.event.pull_request.author_association == 'OWNER' || github.event.pull_request.author_association == 'MEMBER'))) && 'civitai-dc' || 'ubuntu-latest' }}
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft || contains(github.event.pull_request.labels.*.name, 'full-ci')
    # Measured 2026-11-18: step 169-286 s, install ~40 s.
    timeout-minutes: 20
    steps:
      # No submodules, depth 1: the typecheck reads the working tree only (see `apps` below).
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Deliberately ONE step driving a script, not one `pnpm --filter` step per app. Per-app
      # steps abort at the first red app, so a shared type change that breaks several of them
      # reports one; and `pnpm --filter <name>` EXITS 0 WHEN THE NAME MATCHES NOTHING (measured,
      # pnpm 10.28.1 — it prints "No projects matched the filters" and succeeds), so a hardcoded
      # list of package names is one chance per app for a rename to turn this gate into a green
      # no-op. The script derives the app set from disk, proves each filter selected a real
      # package, and collects every failure. See its header.
      - name: Typecheck apps
        run: node scripts/ci/typecheck-apps.mjs

  apps:
    # Renaming is safe: neither `main` nor `release` has any required_status_checks (re-verified
    # 2026-10-29), so no merge gate keys on it. It was `App unit tests + typecheck` until the
    # typecheck moved to `apps-typecheck`.
    name: App unit tests
    # Hosted, not civitai-dc: the pglite suites here (knights apprenticeship, event-engine
    # collection-item-adder) hit their 5s test timeout under civitai-dc load while hosted stays green.
    # App typecheck stays on civitai-dc.
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft || contains(github.event.pull_request.labels.*.name, 'full-ci')
    # The `apps/*` suites had never once run in CI before this job existed (369 tests across
    # five apps then): the root config registered `packages/*/vitest.config.*` as projects and
    # nothing for `apps/*`. And the root `pnpm run typecheck` is bounded by the root tsconfig
    # `include`, which has no `apps/*` entry, so the `apps-typecheck` job above is the only
    # typecheck the apps get.
    #
    # Not `continue-on-error`: no browser and no Next module graph. A red here does not block a
    # merge (`main` has no required_status_checks); it is a signal someone has to look at.
    #
    # The typecheck used to share this job's timeout, and a test step that grew into a 15m limit
    # took it down with it: 16 of 162 runs were cancelled at 15m (2026-10-19/20). It now runs in
    # `apps-typecheck`, so this limit bounds the tests alone (test step 253-936 s over 6 green PR
    # runs, 2026-11-18). Nearly all of the test time is the moderator app's pglite suites: speed
    # those up or shard this job before raising the limit.
    timeout-minutes: 30
    # A real Postgres for apps/assistant-runner, whose runs are DBOS workflows. Its *.pg.test.ts
    # files fail in CI without the URL (they skip only outside CI). The suites create and drop their
    # own databases on this throwaway server.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 2s --health-retries 15
    env:
      ASSISTANT_RUNNER_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      # No `submodules: true`: nothing under `apps/` imports event-engine-common (the
      # out-of-tree scan in scripts/ci/assert-apps-paths-filter.mjs would list it if one did),
      # and it is not a pnpm workspace member, so neither the install nor the suites read it.
      # Depth 2: on a pull_request the checkout is the PR's merge commit, and the scope step
      # diffs it against its first parent (the base it merges into).
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        id: install
        run: pnpm install --frozen-lockfile

      # Which app suites this run selects. On a pull_request it may leave moderator out; on push
      # and dispatch it always selects `app:*`. See the header and the script.
      - name: Scope app suites
        id: scope
        run: node scripts/ci/app-suite-scope.mjs --out app-suite-scope.json

      # `!cancelled()` so a red earlier step does not hide this verdict; gated on the install,
      # because tests without `node_modules` would only restate the install failure.
      #
      # `pnpm exec vitest run` rather than `pnpm run test:apps:run` (queued-check), which in CI is
      # the same command with `--project app:*` fixed in front: vitest keeps a project when ANY
      # `--project` pattern matches it, so that fixed pattern would make leaving one out
      # impossible. The scope step's output is `--project=app:*` when nothing is left out. If the
      # scope step fails, this does not run and the ledger below fails on the missing report.
      # `set -f`: the arguments carry a `*` that must reach vitest, not the shell's globbing.
      - name: App unit tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.scope.outcome == 'success' }}
        env:
          VITEST_PROJECT_ARGS: ${{ steps.scope.outputs.vitest_args }}
        run: |
          set -f
          pnpm exec vitest run $VITEST_PROJECT_ARGS --reporter=default --reporter=json --outputFile=apps-report.json

      # A green vitest run is a claim, not evidence, and this positive control earns its keep
      # harder here than for packages: the projects are named by hand (`app:auth`, ...), so an
      # app that loses its `test.name` stops being selected while the others keep the run green
      # and exit 0. Measured, not assumed — see the script header. `always()` so it runs after
      # a red suite, which is the case it exists for.
      - name: Assert every app suite actually ran
        if: always()
        run: node scripts/ci/assert-workspace-suites-ran.mjs apps-report.json apps --scope app-suite-scope.json

      # PER-TEST TIMINGS, read a few times a day by an external ci-speed job that ranks slow
      # and flaky tests across runs. The SAME report this job's suite step wrote (no extra test run), under its
      # own `test-times-` name so no artifact download can match it — lint.yml's `unit-verify`
      # globs `unit-report-*` and once counted every .json it found. `ignore` when absent: a
      # missing report is already failed, by name, by this suite's own ledger step.
      - name: Upload test timings
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.scope.outcome == 'success' }}
        # Telemetry: never turns a PR red. On a push to main a failed upload fails the job,
        # so a broken uploader shows rather than reading green (main-branch-ci-coverage.test.ts).
        continue-on-error: ${{ github.event_name != 'push' }}
        uses: actions/upload-artifact@v7
        with:
          name: test-times-apps-a${{ github.run_attempt }}
          path: apps-report.json
          if-no-files-found: ignore
          retention-days: 8
          # One artifact per attempt (`-a<run_attempt>`, never overwritten): a failed attempt
          # and its passing re-run on the same commit is exactly the flake the reader counts.

      # Re-derives what the `paths:` filter above must contain and fails on a missing or stale
      # entry. See the header and the script.
      - name: Paths filter covers what the app suites read
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node scripts/ci/assert-apps-paths-filter.mjs
