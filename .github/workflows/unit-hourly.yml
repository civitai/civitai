name: Unit tests (hourly)

# Batched verification of the unit suite on `main`. A push to `main` does not run lint.yml's
# `Unit tests` job; this does, once an hour, and only when `main` moved: it dispatches lint.yml
# with `only: unit` on `main` unless `main`'s head is the commit the last hourly run already
# verified. lint.yml's `unit-verify` job then posts the verdict as a `Unit tests (hourly)` commit
# status, bisecting a red to the first bad merge commit. See lint.yml's header ("THE UNIT SUITE IS
# THE EXCEPTION") and scripts/ci/unit-hourly.mjs.
#
# :41, off the top of the hour, where scheduled jobs pile up. A run that is dispatched waits only
# for runners; the dispatched unit run holds four job slots for about 15-20 minutes.
on:
  schedule:
    - cron: '41 * * * *'
  # For a manual "verify main now"; it skips, like the hourly run, when main has not moved.
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: unit-hourly-gate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    name: Dispatch the unit suite if main moved
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            scripts/ci/unit-hourly.mjs
            .nvmrc
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Gate and dispatch
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/unit-hourly.mjs gate "$GITHUB_REF_NAME"
