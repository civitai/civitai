name: Lint

# Regression guard for code quality.
#
# Typecheck is full-repo, and as of talos-infra #855 it is now a NARROW job: it
# runs only where the in-cluster Tekton `pr-check` pipeline does not reach. For
# an internal PR targeting `main` — every PR merged here in living memory — the
# authoritative typecheck is the `tekton / typecheck` commit status, and this job
# skips. See the `typecheck` job comment for the two cases it still covers and
# how each was measured.
#
# 🔴 Read this before treating the fork case as covered. The job carries no
# secret and is not gated by us on the PR's origin — but GitHub gates it for us,
# and the practical outcome is that FORK PRs GET NO TYPECHECK AT ALL TODAY.
# Measured 2026-08-07 over all 16 fork-originated PRs among the ~500 most recent
# PRs: 11 have a retained `Lint` run and ALL ELEVEN sit at
# `conclusion=action_required` (awaiting maintainer approval, zero repository
# code executed); the other 5 are closed PRs whose runs have aged out. `gh pr
# checks` on the open ones reports "no checks reported". Not one fork PR has ever
# produced a Typecheck result.
#
# Two earlier revisions of this comment got this wrong in opposite directions —
# first "typecheck is skipped on fork PRs", then (correcting that) "it runs on
# fork PRs TOO". Both were reasoning from the workflow's CONFIGURATION, which
# says nothing about whether the job RUNS. The configuration genuinely does not
# gate on origin; the approval policy does. Keep the job — it is where fork
# coverage will land the moment a maintainer approves a run, and the sandbox is
# GitHub's rather than ours — but do not cite it as active fork protection.
#
# ESLint and Prettier are split by how the PR touched the file:
#
#   ADDED files      -> BLOCKING. A new file has no pre-existing findings by
#                       definition, so this is free, and it stops the backlog
#                       from growing while the full flip waits.
#   MODIFIED/RENAMED -> report-only (`continue-on-error`). For a formatter,
#                       "changed file" means the WHOLE file, not the changed
#                       lines: 789 of 4,116 src files fail `prettier --check`
#                       today. Across the 98 src files touched by the last 30
#                       commits, 39 fail Prettier and 10 carry a pre-existing
#                       ESLint error - 44 (45%) would red the job for reasons
#                       unrelated to the PR, turning a 3-line bugfix into a
#                       200-line reformat. The job would be off within a week.
#   EVERY FILE       -> report-only, and only when the PR changes lint config,
#                       package.json or pnpm-lock.yaml (list in
#                       scripts/ci/lint-targets.mjs). Those can change the
#                       verdict for files the PR never touched, so checking only
#                       the changed files would hide what the change does. Every
#                       file is linted at HEAD and at the merge base, and only
#                       the findings HEAD adds are reported, so the change's
#                       effect is not buried under the pre-existing backlog.
#
# Findings surface as file annotations on the PR diff: ESLint via the problem
# matcher in .github/problem-matchers/, Prettier via ::warning / ::error commands.
# Report-only steps still show a failed-but-ignored marker in the checks list.
#
# The modified-file steps flip to blocking once the backlog is cleared, planned to
# ride along with the Prettier 2->3 upgrade (which forces a reformat anyway).
#
# ── ALSO RUNS ON PUSH TO `main`, and that is not decoration ──────────────────
#
# Between 2026-06-14 and 2026-08-21 NO CI of any kind produced a verdict for a
# commit on `main`. Two unrelated mechanisms happened to stop on the same day,
# which is why the gap read as one thing and stayed unexplained for two months:
#
#   1. `.github/workflows/pr-check.yml` was deleted by #2547 ("runs in Tekton,
#      removes GH Actions pr-check"). It carried the only live push-to-`main`
#      trigger. Enumerated rather than assumed — every revision of every one of
#      the 12 files that has ever existed under `.github/workflows/` was parsed,
#      and exactly TWO have ever fired on a branch push to `main`:
#      `docker-deploy.yml` (removed 2023-11) and `pr-check.yml`. Two near
#      misses are worth naming so they are not re-counted: `auth-app.yml` has a
#      `push:` block but filters on `tags:` only, which never fires on a branch
#      push, and the last `docker-deploy.yml` had `main` commented out under
#      `branches:`. Everything built after the deletion — this file (#3362,
#      2026-07-24), submodule-pin-guard, schema-drift (#3643), windows-dev-env
#      (#4162) — is `pull_request`-only, so the trigger was never rebuilt.
#      Nobody decided that; it was lost in a move.
#   2. CodeQL, whose runs carried the "Push on main" title in the run list,
#      stopped the same afternoon (code-scanning default setup now reads
#      `not-configured`). Unrelated cause, same date, no test coverage either
#      way — it is named here only so the next reader does not "confirm" the
#      workflow deletion by pointing at a CodeQL run and vice versa.
#
# And Tekton does NOT close it. The in-cluster `pr-check` pipeline is driven by
# a resource that watches OPEN PULL REQUESTS targeting `main`; the only
# main-branch trigger is a container image build for the staging deployment,
# which runs no test suite and posts no commit status. So "Tekton covers main"
# is false, and was the assumption that let the gap persist.
#
# What that cost, concretely: a3e790ff2e was pushed straight to `main` with no
# PR, broke `model-file-scan.service.test.ts`, and sat undetected for ~7 hours.
# It surfaced only when unrelated PRs inherited the failure through their merge
# commits — every open PR going red at once, which reads as a CI outage rather
# than as one bad commit.
#
# The push path deliberately does NOT run every job here. `eslint` is diff-vs-
# base by construction and is skipped; so are the sibling workflows schema-drift
# and submodule-pin-guard, which are base-relative gates with nothing to compare
# against on a push. (`windows-dev-env` was in that list and did not belong in
# it — it is not base-relative, it just never had a push trigger. It gained one
# on 2026-08-25 to fix an Actions-cache leak; see its header.) The consequence
# is worth stating rather than leaving implied: the added-file ESLint/Prettier
# gate and the stray-migrations guard remain reachable only through a PR, so a
# direct push to `main` still bypasses them. Closing that is a separate change,
# and requires deciding what "the base" means for a push.
#
# A red run on `main` blocks nothing — the merge has already happened, and
# `main` carries no required_status_checks in any case. Its whole value is that
# it renders RED, on the commit that caused it, within minutes instead of
# whenever the next PR happens to inherit it.

# ── DOCS-ONLY CHANGES SKIP THIS WORKFLOW, EXCEPT DOCS A TEST READS ──────────
#
# `paths` rather than `paths-ignore` because only `paths` documents the
# re-include rule: patterns are evaluated in order, so a positive pattern after
# a negative one includes that path again. A change touching ANY file outside
# the excluded trees still runs everything.
#
# Kept (re-included) because a unit test reads it, so editing it alone can turn
# the suite red: docs/dev/convention-guards.md (no-lint-rules-script-drift
# checks its "Convention guards run as tests" section against package.json).
# Found by grepping every test file for paths under docs/ that it opens; that
# was the only one. Markdown OUTSIDE these trees is deliberately not excluded:
# tests read CLAUDE.md files, .claude/rules/*.md, app READMEs and the ToS
# markdown under src/. If you add a test that reads a file under docs/ or
# claudedocs/, add that path below the negations.
#
# Known gap: source-nul-bytes scans every .md in the repo, so a docs-only change
# that adds a NUL byte is no longer caught by CI. Accepted for the runner time.
#
# Nothing breaks when this skips: `main` and `release` have no
# required_status_checks, so no PR waits on a check that never starts. If one
# of these jobs ever becomes a required check, a docs-only PR would hang on it
# and this filter must go (or the check must be made path-aware).
#
# ── DRAFT PRs RUN ESLINT ONLY ────────────────────────────────────────────────
#
# Every job but `eslint` carries `github.event_name != 'pull_request' ||
# !github.event.pull_request.draft || <the PR has the full-ci label>` in its `if`
# (`unit` has a stricter gate that implies it), so on a draft they skip and start
# when the PR is marked ready, or when it gets the `full-ci` label (below). Measured over 24h (2026-10): 92 of 308 PR
# Lint runs (30%), about 31% of PR job-minutes, ran while the PR was a draft,
# mostly agents iterating, on the same concurrent-job limit as everything else.
# Push and dispatch runs are unaffected.
#
# `types` must list `ready_for_review`: the default list (opened, synchronize,
# reopened) omits it, so without it marking a PR ready would start nothing and
# the heavy jobs would wait for the next push.
#
# WANT A VERDICT ON A DRAFT? Dispatch the job on your branch:
#   gh workflow run lint.yml -R civitai/civitai --ref <branch> -f only=<job>
# (`only` choices below; `all` runs everything but ESLint). The app suites live
# in apps.yml: `gh workflow run apps.yml -R civitai/civitai --ref <branch>`.
#
# ── THE `full-ci` LABEL RUNS THE FULL SUITE ON A PR ─────────────────────────
#
# Adding the `full-ci` label to a PR (draft or not) runs every job here, the four
# `Unit tests` shards included, and lifts the draft ESLint-only gate. It stays on:
# `github.event.pull_request.labels` is the PR's CURRENT label set on every event,
# so each later push runs the full suite too until the label is removed. apps.yml
# honours the same label, behind its own `paths:` filter. To get it on every PR:
#   gh pr create ... --label full-ci     or     gh pr edit <n> --add-label full-ci
#
# `types` lists `labeled` for this, and that has two costs every job and the
# concurrency group below must pay for. Adding ANY label fires `labeled`:
#   1. Every job's `if` ends in
#        (github.event.action != 'labeled' || github.event.label.name == 'full-ci')
#      so another label starts no work. (On push and dispatch `action` is null,
#      so the clause is true there.)
#   2. Every job skipping is not enough on its own: the run would still join the
#      PR's concurrency group and CANCEL the real run in flight. So a labeled event
#      for any other label gets a group of its own (keyed on `github.run_id`).
#      `full-ci` itself stays in the PR's group and replaces the in-flight run,
#      which it supersedes.
# scripts/__tests__/full-ci-label.test.ts pins both.
on:
  pull_request:
    branches: [main, release]
    types: [opened, synchronize, reopened, ready_for_review, labeled]
    paths:
      - '**'
      - '!docs/**'
      - '!claudedocs/**'
      - 'docs/dev/convention-guards.md'
  push:
    branches: [main]
    paths:
      - '**'
      - '!docs/**'
      - '!claudedocs/**'
      - 'docs/dev/convention-guards.md'
  # `only` runs one suite (or one unit shard) instead of the whole fan-out, for
  # dispatches that care about a single suite. Every job's `if` reads it, and so
  # does every suite step in a job that hosts several (`component` hosts geometry
  # and the quarantine run). On pull_request and push `inputs.only` is empty, so
  # it narrows nothing: what runs there is decided by each job's or step's own
  # event gate (`unit` skips pull requests without the `full-ci` label and the
  # quarantine step skips all of them; ESLint is PR-only; typecheck runs where
  # Tekton does not; drafts run ESLint only unless labeled `full-ci`).
  # The ESLint job is PR-only and never runs on a dispatch, so it is not listed.
  # The app suites moved to apps.yml, which has its own dispatch.
  workflow_dispatch:
    inputs:
      only:
        description: >-
          Run only this suite. all = every suite (default). typecheck, unit (all 4
          shards), unit-1 .. unit-4 (one shard), packages, geometry, component
          (includes the quarantine run). App suites: dispatch apps.yml.
        type: choice
        default: all
        options:
          - all
          - typecheck
          - unit
          - unit-1
          - unit-2
          - unit-3
          - unit-4
          - packages
          - geometry
          - component

permissions:
  contents: read

# One group per ref, for pull requests AND pushes. On a PR `github.ref` is
# `refs/pull/N/merge`, so a new push to the branch cancels the in-flight run.
# On a push to `main` it is `refs/heads/main`, so a newer commit on `main`
# cancels the run for the older one that is still going.
#
# That last part is a deliberate trade, not an oversight. Until 2026-10 a push
# grouped by `github.sha`, so every commit on `main` kept its own full run (10+
# jobs) alive. On a busy day that queued dozens of `main` runs behind the PR
# runs on a plan with a fixed concurrent-job limit. The newest commit's run
# checks a tree that contains every older commit, so `main` still gets a
# verdict; what is given up is a per-commit verdict for intermediate commits,
# which show as `cancelled`. To pin a break to one of them, push a branch at
# that commit and dispatch this workflow on it (`only` narrows it to one suite).
#
# A `ready_for_review` run shares the PR's `refs/pull/N/merge` group, so it
# cancels a still-running draft ESLint run. That is fine: the ready run runs
# ESLint again along with everything else.
#
# A workflow_dispatch run groups by ref AND by the `only` input, so a new
# dispatch of the same suite on the same branch cancels the stale one, while
# dispatches of DIFFERENT suites on one branch still run side by side. The
# `dispatch-` prefix keeps these groups disjoint from the PR and push ones.
#
# A `labeled` event for any label but `full-ci` gets a `noise-<run_id>` group of
# its own, so its all-skipped run cannot cancel the PR's real run (see the header).
# A `full-ci` labeled event keeps the PR's group and replaces the in-flight run.
concurrency:
  group: lint-${{ github.event_name == 'workflow_dispatch' && format('dispatch-{0}-{1}', github.ref, inputs.only) || github.event.action == 'labeled' && github.event.label.name != 'full-ci' && format('noise-{0}', github.run_id) || github.ref }}
  cancel-in-progress: true

jobs:
  eslint:
    name: ESLint + Prettier (changed files)
    runs-on: ubuntu-latest
    # PULL REQUESTS ONLY, and not as a matter of taste. Every step in this job
    # is defined against `FETCH_HEAD...HEAD` where FETCH_HEAD is
    # `origin/$BASE_REF`, and `github.base_ref` is EMPTY on a push event — so on
    # `main` the first step would run `git fetch -q origin ""` and the job would
    # fail for a reason that has nothing to do with the code. "Changed files" is
    # a PR concept here; a push has no base to diff against.
    #
    # `scripts/__tests__/main-branch-ci-coverage.test.ts` pins this as a
    # RELATIONSHIP rather than as this one job's setting: any job in this file
    # that reads `github.base_ref` or `github.event.pull_request` must be gated
    # to pull_request events. That is the guard that catches the NEXT
    # base-relative job someone adds, which would otherwise be red on every
    # commit to `main` from the day it lands.
    #
    # The second clause skips it on a labeled event for any label but `full-ci` (see the
    # header). A `full-ci` labeled event re-runs it, harmlessly.
    if: github.event_name == 'pull_request' && (github.event.action != 'labeled' || github.event.label.name == 'full-ci')
    # Sized for the full run (see the header), which lints every tracked file
    # twice, at HEAD and at the merge base, and may reinstall dependencies for
    # the base. A normal PR finishes far inside it. Keep a full run, including a
    # lockfile reinstall, well clear of the limit: if full runs approach it, raise
    # it rather than letting a config PR time out with no verdict.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # pnpm/action-setup installs the version `packageManager` in package.json pins.
      - uses: pnpm/action-setup@v6

      # `cache: pnpm` (the pnpm store, keyed on the lockfile) is the ONLY dependency cache in
      # every workflow here. setup-node's automatic caching (`package-manager-cache`, v5+)
      # applies only when `packageManager` names npm, and pnpm/action-setup's own `cache` input
      # defaults to false, so neither adds a second one.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Writes the file lists the steps below read; see the script's header.
      - name: Collect changed files
        id: changed
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git fetch -q origin "$BASE_REF"
          node scripts/ci/lint-targets.mjs FETCH_HEAD

      # BLOCKING. Migrations live next to the schema in packages/civitai-db-schema.
      # The root prisma/migrations directory predates the monorepo and has no
      # migration_lock.toml, so Prisma never reads it — 68 migrations were written
      # there by hand and silently ignored. `pnpm db:migrate:empty` now targets the
      # right path; this catches the hand-authored case it can't.
      - name: Migrations are in the schema package
        run: |
          set -euo pipefail
          STRAYS=$(git diff --name-only --diff-filter=A FETCH_HEAD...HEAD -- 'prisma/migrations/**' || true)
          if [ -n "$STRAYS" ]; then
            while IFS= read -r f; do
              [ -n "$f" ] || continue
              echo "::error file=$f::Migrations belong in packages/civitai-db-schema/prisma/migrations/. Prisma does not read prisma/migrations/ at the repo root. Use: pnpm run db:migrate:empty \"description\""
            done <<< "$STRAYS"
            exit 1
          fi
          echo "no migrations added outside the schema package"

      - name: Register ESLint problem matcher
        run: echo "::add-matcher::.github/problem-matchers/eslint-unix.json"

      # BLOCKING. New files start clean, so holding them to the rules costs nothing.
      # Errors only (no --max-warnings): the repo has 3,470 warnings and 1,762 uses of
      # `any`, so failing new files on warnings would hold them to a stricter bar than
      # anything already merged. Warnings still annotate.
      - name: ESLint (added files)
        run: |
          set -euo pipefail
          if [ ! -s added-lint.txt ]; then echo "no new lintable files"; exit 0; fi
          xargs -a added-lint.txt pnpm exec eslint --format unix \
            | sed "s|^$GITHUB_WORKSPACE/||"

      - name: Prettier (added files)
        run: |
          set -euo pipefail
          if [ ! -s added.txt ]; then echo "no new files"; exit 0; fi
          xargs -a added.txt pnpm exec prettier --list-different > unformatted-added.txt || true
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            echo "::error file=$f::Not formatted. Run: pnpm exec prettier --write $f"
          done < unformatted-added.txt
          if [ -s unformatted-added.txt ]; then
            echo "$(wc -l < unformatted-added.txt) new file(s) are not formatted."
            exit 1
          fi
          echo "all new files formatted"

      # Report-only: 10% of recently-touched files carry a pre-existing
      # error-severity finding. See the header comment.
      - name: ESLint (modified files, report-only)
        if: steps.changed.outputs.full != 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          if [ ! -s report-lint.txt ]; then echo "no lintable files to report on"; exit 0; fi
          xargs -a report-lint.txt pnpm exec eslint --format unix \
            | sed "s|^$GITHUB_WORKSPACE/||"

      # Report-only: 19% of src files are unformatted today and a formatter has no
      # changed-line granularity. See the header comment.
      - name: Prettier (modified files, report-only)
        if: steps.changed.outputs.full != 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          if [ ! -s report.txt ]; then echo "no files to report on"; exit 0; fi
          xargs -a report.txt pnpm exec prettier --list-different > unformatted.txt || true
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            echo "::warning file=$f::Not formatted (pre-existing, not blocking). Run: pnpm exec prettier --write $f"
          done < unformatted.txt
          if [ -s unformatted.txt ]; then
            echo "$(wc -l < unformatted.txt) file(s) are not formatted (report-only)."
            exit 1
          fi
          echo "all checked files formatted"

      # FULL RUN (lint config or dependencies changed): lint every file at HEAD, then
      # the same files at the merge base, and report only what HEAD adds. The base
      # is checked out in this workspace so the HEAD install is reused; it is
      # reinstalled only when the lockfile differs, since linting the base with
      # HEAD's dependencies would hide every finding a version bump introduces.
      # The script is copied out first because the base may not have it.
      - name: Lint all files at HEAD (full run)
        if: steps.changed.outputs.full == 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/lint"
          cp scripts/ci/lint-new-findings.mjs "$RUNNER_TEMP/lint/"
          node "$RUNNER_TEMP/lint/lint-new-findings.mjs" collect head report-lint.txt report.txt "$RUNNER_TEMP/lint"

      - name: Lint the same files at the merge base (full run)
        if: steps.changed.outputs.full == 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          head_sha=$(git rev-parse HEAD)
          base_sha=$(git merge-base FETCH_HEAD HEAD)
          # -f: postinstall can rewrite tracked generated files, and no later step reads
          # the working tree.
          trap 'git checkout -q -f --detach "$head_sha"' EXIT
          git checkout -q -f --detach "$base_sha"
          if ! git diff --quiet "$base_sha" "$head_sha" -- pnpm-lock.yaml; then
            echo "pnpm-lock.yaml differs from the merge base: installing the base's dependencies"
            pnpm install --frozen-lockfile --prefer-offline
          fi
          node "$RUNNER_TEMP/lint/lint-new-findings.mjs" collect base report-lint.txt report.txt "$RUNNER_TEMP/lint" --existing-only

      # Fails (and annotates) only on findings the PR adds; the backlog both trees
      # share is counted in the step summary but never fails it. continue-on-error
      # keeps the job green either way, like the other report-only steps.
      - name: New lint findings vs merge base (full run, report-only)
        if: steps.changed.outputs.full == 'true'
        continue-on-error: true
        run: node "$RUNNER_TEMP/lint/lint-new-findings.mjs" compare "$RUNNER_TEMP/lint"

  typecheck:
    name: Typecheck (main pushes / fork PRs / non-main base)
    runs-on: ubuntu-latest
    # 🔴 NARROWED, not retired (talos-infra #855, stage 1). The in-cluster Tekton
    # `pr-check` pipeline runs `tsc --noEmit` on every PR and posts the result as
    # the `tekton / typecheck` commit status. Running this job as well typechecks
    # the same tree a second time on every internal PR. Tekton is the one that
    # kept reporting through the 2026-08-06 Actions `major_outage` — it POLLS the
    # PR API on a 1m interval rather than taking a webhook, and the incident
    # degraded webhook delivery.
    #
    # This `if:` is the complement of what Tekton covers. Both disjuncts were
    # measured on 2026-08-07, not assumed:
    #
    #   fork PR  — the Tekton side gates fork-authored PRs away by author
    #     association, deliberately: it executes PR code on our own
    #     infrastructure, and GitHub's untrusted-code sandbox is doing work we
    #     would otherwise have to build. So this job is the only typecheck a fork
    #     PR can get. ⚠️ In practice this arm is DORMANT — see the header.
    #
    #   base != main — the Tekton side only watches PRs targeting `main`, so a
    #     PR targeting `release` gets no check from it at all. Rare but real: 4
    #     PRs have ever targeted `release` (0 of the last 200 merged) — most
    #     recent #2582, closed 2026-06-16; last merged #2248, 2026-05-09. Rare is
    #     what makes this cheap, not a reason to drop it.
    #
    #   push to main — the THIRD disjunct, added 2026-08-21. Read this before
    #     trimming it as redundant with the first: the Tekton `pr-check`
    #     pipeline is driven by a resource that watches OPEN PULL REQUESTS
    #     targeting `main`, so a COMMIT on `main` is outside its trigger
    #     entirely. The only Tekton trigger on the main branch builds a
    #     container image for the staging deployment; it runs no `tsc` and posts
    #     no status. So on this path there is no second typecheck to be a
    #     duplicate of — this job is the only one, exactly as in the fork case.
    #
    # Deleting any disjunct silently removes the only typecheck on that path.
    # The honest way to retire this job entirely is to widen Tekton's coverage
    # first and prove it on a real PR of each shape.
    #
    # ⚠️ `github.event.pull_request` is null on a push event, so BOTH PR
    # disjuncts evaluate to `null != <string>` — which is TRUE. The push arm is
    # therefore already implied and the explicit `github.event_name == 'push'`
    # below is redundant *today*. It is written anyway because the redundancy is
    # an accident of null-comparison semantics rather than a decision, and the
    # next person to tighten these disjuncts (e.g. by pinning
    # `github.event_name == 'pull_request' && ...`) would silently drop main
    # coverage with no test naming it. The guard test asserts the push arm.
    #
    # The name changed with the gate so the checks list explains its own absence.
    # Safe: neither `main` nor `release` has any required_status_checks (verified
    # 2026-08-07 via the branch-protection API, re-verified 2026-08-21), so no
    # merge gate keys on the old name.
    #
    # The `only` clause is the workflow_dispatch selector (see `on:`); it is true
    # on every other event, so the three disjuncts above are unchanged. The next
    # clause skips draft PRs unless they carry the `full-ci` label (see the header);
    # it is true on push and dispatch. The last skips a labeled event for any other
    # label. Neither widens the three disjuncts: `full-ci` does not make an internal
    # PR into `main` run this job.
    if: >-
      (github.event_name == 'push'
      || github.event.pull_request.head.repo.full_name != github.repository
      || github.event.pull_request.base.ref != 'main')
      && (!inputs.only || inputs.only == 'all' || inputs.only == 'typecheck')
      && (github.event_name != 'pull_request' || !github.event.pull_request.draft || contains(github.event.pull_request.labels.*.name, 'full-ci'))
      && (github.event.action != 'labeled' || github.event.label.name == 'full-ci')
    # event-engine-common is public and fetched over HTTPS, so this needs no
    # secret — which is why the ssh-agent step is gone rather than merely unused.
    # Leaving it in would have kept the fork case broken AND masked the HTTPS
    # path: webfactory/ssh-agent rewrites
    # url."git@key-<sha>.github.com:<owner>/<repo>".insteadOf "https://github.com/<owner>/<repo>"
    # for any loaded key whose comment names a github.com repo, silently sending
    # the new HTTPS URL back over SSH.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Must stay `pnpm run typecheck`, not a bare `tsc --noEmit`. The script is
      # a wrapper (scripts/typecheck.mjs) that sets the V8 heap cap AND
      # classifies the outcome: a `tsc` that dies of heap exhaustion emits zero
      # diagnostics, so a raw invocation produces an empty log that reads as a
      # clean pass to anyone scanning it. The wrapper says CRASHED instead.
      - name: Typecheck
        run: pnpm run typecheck

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    # ~8,000 tests that until now only ran on whoever remembered to run them.
    # Node env, no browser — component tests (`*.browser.test.tsx`) are not here
    # on purpose: they need Chromium, which this job does not install. That is
    # the whole reason. They run in the `component` job below.
    #
    # This comment used to add "and carry the cold-optimizeDeps
    # flake documented at vitest.config.mts:98-124", which was wrong: those lines
    # document the FIX for that flake, not an open one. vitest.config.mts:109-127
    # dedupes React and pre-bundles `vitest-browser-react` + the JSX runtimes so
    # the optimize pass happens BEFORE the run instead of reloading mid-run, and
    # calls itself the canonical fix; 98-102 is a separate hookTimeout fix.
    # Don't cite a cold-cache flake as a reason to keep this job Chromium-free.
    #
    # ── NOT RUN ON PULL REQUESTS UNLESS ASKED; REAL VERDICT ON `main` AND ON DISPATCH ──
    #
    # The `if` below skips this job on `pull_request` unless the PR carries the
    # `full-ci` label (draft or not; every push while the label is on runs it — see
    # the header). It runs on every push to `main` (blocking in the sense every other
    # job is: it renders red; `main` has no required checks) and on
    # `workflow_dispatch`, where `only` still selects it.
    #
    # Why, measured over 24h (448 Lint runs, 2026-10): these four shards were 59% of
    # all Lint job-minutes, ~12,400 of ~21,000, ~10,000 of it on PRs. The plan's
    # org-wide concurrent-job limit was saturated around the clock and jobs queued
    # 10-40+ minutes. On a PR that spend bought no verdict: the job was report-only
    # (`continue-on-error` on `pull_request`) from its first day, so it never blocked
    # anything, and it passed 760 of 793 shard runs (96%).
    #
    # THE TRADE, stated plainly: a unit regression is now found on `main` after
    # merge instead of on the PR. The push run still renders red on the commit that
    # caused it within minutes (`concurrency` above may fold a burst of commits into
    # the newest one's run). The `test:lint-rules` convention guards
    # (`src/server/services/__tests__/no-*.test.ts`) run inside this suite, so they
    # move to `main` with it.
    #
    # WANT A VERDICT BEFORE MERGING? Add the `full-ci` label to the PR
    # (`gh pr edit <n> --add-label full-ci`), or dispatch this workflow on your
    # branch with `only: unit` (all four shards) or `only: unit-<n>` (one):
    #   gh workflow run lint.yml --ref <branch> -f only=unit
    # Or run `pnpm run test:unit:run` locally, which the root CLAUDE.md already asks for.
    #
    # REJECTED ALTERNATIVE, so nobody rebuilds it blind: run only the tests related
    # to the PR's changed files (#7199, closed). Built and measured on 20 sampled
    # PRs: 7 still selected the full suite (a change to a widely imported module
    # reaches most of it), the rest a median 557 of ~3,930 files, for a modelled
    # ~38% saving at the price of two new scripts. Not running on PRs saves all of
    # the PR share with no new code, and a PR verdict was never enforced anyway.
    #
    # NO `continue-on-error`, deliberately. It used to be
    # `${{ github.event_name == 'pull_request' }}` — report-only on PRs, the real
    # verdict on push, because report-only on `main` would make a run read
    # `success` while the suite underneath failed (a green that has to be
    # disbelieved; scripts/__tests__/main-branch-ci-coverage.test.ts forbids an
    # unconditionally report-only job on the push path). With no PR runs that
    # expression is always false, and a dead PR clause only suggests PRs are still
    # covered. The `full-ci` label brought PR runs back on request, and they are
    # NOT report-only either: someone asked for a verdict, so a red suite renders
    # red on the PR (it still blocks no merge; no required checks).
    #
    # Reading a run: with no `continue-on-error`, the job and run conclusions now
    # carry the suite's verdict. Before 2026-10 a PR run read `success` while the
    # `Unit tests` step underneath was `failure`, so for those old runs read
    # `steps[].conclusion` from the jobs endpoint, not the run.
    #
    # `only: unit` runs all four shards; `only: unit-<n>` runs that shard alone
    # (the matrix below narrows to it). The job-level `if` cannot read `matrix`,
    # which is why the shard pick lives in the matrix expression instead.
    #
    # The first clause is the PR gate (no draft clause: a labeled PR runs it as a
    # draft too); the last skips a labeled event for any label but `full-ci`.
    if: ${{ (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')) && (!inputs.only || inputs.only == 'all' || inputs.only == 'unit' || startsWith(inputs.only, 'unit-')) && (github.event.action != 'labeled' || github.event.label.name == 'full-ci') }}
    # ── SHARDED ACROSS 4 RUNNERS ────────────────────────────────────────────
    #
    # Measured before the change, n=12 runs of this job, from the Actions API:
    #
    #   Unit tests step   555.5s   <- variable, scales with 1/shards
    #   Install            30.0s   |
    #   checkout           21.0s   |  fixed overhead, paid by EVERY shard
    #   setup-node         13.0s   |
    #   set up job + pnpm   2.5s   |  = 66.5s
    #   -------------------------
    #   total             622.0s   = the 10.4m job median
    #
    # So T(N) = 66.5 + 555.5/N:  1 -> 10.4m, 2 -> 5.7m, 3 -> 4.2m, 4 -> 3.4m,
    # 6 -> 2.7m, 8 -> 2.3m. Runner-minutes go 10.4 -> 13.7 at N=4 (+32%).
    #
    # 🔴 WHY 4 AND NOT MORE. The curve is already flat at 4: the fifth shard saves
    # ~0.5m of wall clock (3.4m -> 3.0m) and the sixth ~0.3m, while EVERY shard adds
    # the 66.5s fixed overhead to runner-minutes (13.7m at N=4, 14.8m at N=5) and
    # takes one more slot of the plan's org-wide concurrent-job limit, which this
    # workflow already saturates — so each extra shard queues someone else's job
    # for longer than it saves this one. Shrink the fixed overhead or the suite
    # before raising this number.
    #
    # BALANCE: ASSUMED BEFOREHAND, NOW MEASURED. `--shard` is not cost-aware and
    # this suite's cost is bimodal (p50 66 modules per file, p75 1088 — see
    # claudedocs/test-perf-measurement-envelope-2026-08-15.md and
    # scripts/test-perf/README.md), so uneven shards were the live risk. Measured
    # on the first green sharded run, 2026-08-25:
    #
    #   shard   1        2        3        4
    #   files   355      354      354      354     <- vitest splits by FILE COUNT
    #   tests   5794     5142     5774     5447
    #   wall    3.3m     3.6m     3.8m     3.4m    <- 1.14x spread
    #
    # The file split is near-exact; the 14% spread is the cost distribution
    # showing through it. Adequate at N=4 — but the margin narrows as N rises and
    # per-shard file counts fall, so READ THE FOUR DURATIONS after any change to
    # this matrix. If one dominates, assign files by measured per-file cost
    # (scripts/test-perf/reporter.mjs emits it) rather than raising N.
    #
    # ⚠️ Suite size moves fast: 1,065 files / 16,784 tests on 2026-08-15 became
    # 1,417 files / 22,157 executed ten days later, +33%. Any figure here is a
    # snapshot — re-derive before quoting one.
    #
    # `fail-fast: false` is load-bearing: the default cancels the sibling shards
    # the moment one goes red, which throws away three quarters of the signal
    # from a job whose entire purpose is to report.
    strategy:
      fail-fast: false
      matrix:
        # [1, 2, 3, 4] unless a dispatch named one shard (`only: unit-<n>`). The
        # `--shard=<n>/4` denominator below stays 4 either way, so a single
        # shard runs exactly the files it would in a full run.
        shard: ${{ fromJSON('{"unit-1":[1],"unit-2":[2],"unit-3":[3],"unit-4":[4]}')[inputs.only || 'all'] || fromJSON('[1, 2, 3, 4]') }}
    # Per-shard, not the whole suite. The ~3.4m estimate above is from the
    # 2026-08-25 measurement; on 2026-10-23, under heavy runner load, shards took
    # 7 to 12.5 minutes, close enough to the old 15m limit to be cancelled by it.
    # 20m leaves headroom over that. It is NOT 30/4: the fixed overhead does not
    # shard.
    timeout-minutes: 20
    # A real Redis for the tests that must see what Redis itself does: Lua scripts, sorted-set
    # order of equal scores, increment exactness (roster.real-redis.test.ts). Such a test skips
    # itself without its URL, so a shard that does not hold it pays only the container start.
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 2s --health-retries 15
      # A real Postgres for the App Blocks document store's concurrency tests (quota under racing
      # writers, concurrent marks/counters, lock timeout — doc-store.pg.test.ts). Same pattern as
      # Redis above: the file skips itself without its URL, so other shards pay only the container
      # start. The suite creates and drops its own databases on this throwaway server.
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 2s --health-retries 15
    env:
      ROSTER_REDIS_URL: redis://localhost:6379/15
      APPDATA_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      # The same throwaway server for the kysely-hot-reads-2 Prisma-vs-Kysely parity suite, which
      # drops and recreates its own `hot_reads_2_parity` schema there. That suite fails in CI if this
      # is missing rather than skipping itself.
      KYSELY_HOT_READS_2_PARITY_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      # Likewise for the kysely-hot-reads-3 suite (its own `hot_reads_3_parity` schema).
      KYSELY_HOT_READS_3_PARITY_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      # Likewise for the kysely-hot-reads-4 suite (its own `hot_reads_4_parity` schema).
      KYSELY_HOT_READS_4_PARITY_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      # Likewise for the kysely-hot-reads-5 suite (its own `hot_reads_5_parity` schema).
      KYSELY_HOT_READS_5_PARITY_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      # Likewise for the kysely-hot-reads-6 suite (its own `hot_reads_6_parity` schema).
      KYSELY_HOT_READS_6_PARITY_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # ── VITE PRE-BUNDLE CACHE ───────────────────────────────────────────
      #
      # A DIFFERENT cache from the one `setup-node` keeps. `cache: pnpm` above
      # caches the pnpm STORE — the downloaded packages. This caches what Vite's
      # dependency optimizer BUILDS out of them.
      #
      # What is in there, measured 2026-08-25 on a warm local checkout rather
      # than assumed: `node_modules/.vite` is 302 MB, all of it under
      # `.vite/vitest/<project-config-hash>/{deps,deps_ssr}` — esbuild pre-bundles
      # — plus a few hundred KB of `results.json`. It is NOT per-test-file output,
      # which is why the key below does not mention the shard's file list: the
      # content is a function of the dependency set and the Vitest config, so
      # `pnpm-lock.yaml` is the right thing to key on.
      #
      # Without it every shard rebuilds this from cold on every run, and nothing
      # else in the repo caches it. (Do not reach for the `optimizeDeps`
      # pre-bundle list in vitest.config.mts as prior art here: that block belongs
      # to the `component` project, which this job does not run. It moves WHEN the
      # optimize pass happens within a run; it does not carry anything between
      # runs.)
      #
      # 🔴 RESTORE ALWAYS, SAVE ONLY ON A PUSH TO `main`. This job runs on a pull
      # request only when it carries the `full-ci` label (see the job comment), so
      # the readers are the next push to `main`, a `workflow_dispatch` on any
      # branch and a labeled PR, all of which can read the default branch's scope.
      # A dispatch or a PR must not save: an entry saved on a
      # feature branch is scoped to that ref, readable by nothing else, and counts
      # against the same 10 GB repo budget as everything useful — the leak a
      # sibling change once cleaned up (20 orphans, 9.65 GB, 95.3% of the budget).
      # Saving only on `main` keeps this at FOUR entries total.
      #
      # Budget: 4 x 302 MB = 1.21 GB worst case, and that is an over-estimate
      # twice over — the 302 MB is the full local project set (this job runs
      # `--project unit*`, a subset) and Actions compresses on upload.
      #
      # A run whose `pnpm-lock.yaml` differs from `main`'s last saved one misses the
      # exact key and falls back to the prefix, restoring the previous lockfile's
      # bundles; Vite validates its own optimizer metadata and re-optimizes what
      # actually moved. A dispatch then saves nothing and pays cold-ish cost; the
      # first push to `main` with that lockfile saves the new key.
      - name: Restore Vite pre-bundle cache
        id: vite-cache
        uses: actions/cache/restore@v6
        with:
          path: node_modules/.vite
          key: vite-unit-${{ runner.os }}-${{ runner.arch }}-${{ matrix.shard }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            vite-unit-${{ runner.os }}-${{ runner.arch }}-${{ matrix.shard }}-

      # `scripts/test-unit-run.mjs` forwards process.argv.slice(2) straight into
      # `vitest run --project unit* ...args`, and its queueDecision() returns
      # early on CI, so the dev-server queue never sees this.
      #
      # 🔴 NO `--` SEPARATOR, and that is not a style choice. pnpm forwards `--`
      # through LITERALLY rather than consuming it (measured on pnpm 10.28.1,
      # the version `packageManager` pins and `pnpm/action-setup` installs; also
      # reproduced on 9.0.0):
      #
      #   pnpm run x -- --shard=1/4   ->  ["--", "--shard=1/4"]
      #   pnpm run x    --shard=1/4   ->  ["--shard=1/4"]
      #
      # vitest then DISCARDS every argument after the bare `--` — it does not
      # treat them as filename filters, which an earlier revision of this comment
      # claimed. Measured both ways:
      #
      #   vitest list --filesOnly --project 'unit*' -- assert-shard-ran  -> 1416 files
      #   vitest list --filesOnly --project 'unit*'    assert-shard-ran  ->    1 file
      #
      # The distinction matters when you are debugging: as FILTERS the shard
      # would run almost nothing, but what actually happens is the INVERSE — no
      # `--shard`, no `--outputFile`, so every runner executes the WHOLE suite and
      # writes no report, while the step still exits 0. On the run that shipped
      # this bug the four `Unit tests` steps took 7m30s-9m54s each, which is the
      # tell. The assert step below is what caught it, on its first live run.
      #
      # The `packages` job (and the app suites in apps.yml) have always used this separator-less
      # form; copy them, not the shell habit.
      - name: Unit tests
        run: pnpm run test:unit:run --shard=${{ matrix.shard }}/4 --reporter=default --reporter=json --outputFile=unit-report.json

      # 🔴 POSITIVE CONTROL. A `--shard` expression that matches no files exits 0
      # and reports a green check — the same silent-zero class this repo has been
      # bitten by before (a suite that fails to IMPORT reports "no tests", not a
      # failure). A per-shard test count is the cheapest thing that can tell
      # "this shard passed" apart from "this shard ran nothing", and it must run
      # even when the suite above went red, or a red shard hides a zero shard.
      - name: Assert this shard actually ran tests
        # `!cancelled()` rather than `always()`: the guard must still run after a RED
        # suite (that is the case it exists for — a red shard must not hide a zero
        # shard), but a CANCELLED run has no report to read and would render a
        # confusing red assert step on top of the cancellation. Observed on shard 3
        # of the run that shipped the `--` bug.
        if: ${{ !cancelled() }}
        run: node scripts/ci/assert-shard-ran.mjs unit-report.json ${{ matrix.shard }} 4

      # See the restore step for why this is push-only. Three further details:
      #
      #   `!cancelled()` rather than the default — a RED suite still produced a
      #     valid set of pre-bundles, and refusing to save them would mean a
      #     single red commit on `main` leaves every subsequent run cold.
      #   `cache-hit != 'true'` — an exact-key hit means this content is already
      #     stored under this key, so re-uploading ~300 MB would buy nothing. A
      #     PREFIX hit leaves this false, which is right: that content belongs to
      #     a different lockfile and does want re-saving under the new key.
      #   `continue-on-error` — a cache save is best-effort infrastructure. Two
      #     shards can race the same key, and the loser reports "another job may
      #     be creating this cache". That must not red a commit on `main`, where
      #     a red on this job has to mean the code.
      - name: Save Vite pre-bundle cache
        if: ${{ !cancelled() && github.event_name == 'push' && steps.vite-cache.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: node_modules/.vite
          key: vite-unit-${{ runner.os }}-${{ runner.arch }}-${{ matrix.shard }}-${{ hashFiles('pnpm-lock.yaml') }}

  packages:
    name: Package unit tests
    runs-on: ubuntu-latest
    # Skips draft PRs unless they carry the `full-ci` label, and labeled events for any other
    # label (see the header). The app typecheck that rode here moved to apps.yml with
    # the app suites, so this job is the package suites plus the install-time asserts below.
    if: ${{ (!inputs.only || inputs.only == 'all' || inputs.only == 'packages') && (github.event_name != 'pull_request' || !github.event.pull_request.draft || contains(github.event.pull_request.labels.*.name, 'full-ci')) }}
    # The `packages/*` suites — 616 tests when this job was added, which until then NO CI job ran.
    # The `unit` job above runs `vitest run --project unit`, whose `include` is root-relative
    # (`src/**`, `scripts/**`), so nothing in this repo ever invoked a workspace package's
    # suite. That is not a small gap: the schema-drift detector shipped 81 tests into it,
    # and two of them had been RED on `main` since #3592 corrected the schema out from under
    # their assertions, with nothing to say so.
    #
    # NOT `continue-on-error`, and it runs on pull requests. Be precise about what that does
    # and does not buy: `main` has branch protection but NO required_status_checks, so a red
    # check here does not prevent a merge. What it buys is that a red renders RED on the PR —
    # a signal someone has to look at and dismiss, not one the UI hides. Making it an actual
    # interlock means adding "Package unit tests" to the required checks, which is a
    # repo-settings change, not a workflow one.
    #
    # Why this one runs on PRs when `unit` does not: `unit` is ~12,000+ tests whose cost is a
    # ~33s import/transform phase per file, four shards and most of this workflow's
    # job-minutes (see its comment). This is 616 tests with no browser, no database and no
    # Next module graph — ~15s locally.
    #
    # DB-backed tiers self-skip: `@civitai/db-queries` sources DATABASE_URL from the root
    # `.env`, which does not exist on a runner, so its DB-backed tests (the `*.explain.test.ts`
    # files) report as skipped. They are visible as skips in the summary rather than as a silent
    # absence.
    # Those EXPLAIN checks therefore have NEVER run in CI — they are laptop-only evidence.
    # The same is true of the two Kysely/Prisma parity suites in the app's `unit` project
    # (kysely-prisma-parity and image-generation-data.kysely-parity), which self-skip without
    # KYSELY_PARITY_DATABASE_URL.
    #
    # 20m is several times the runtime (package suites ~30s, install ~40s, 2026-10-29). If it
    # ever approaches that, re-read the step durations rather than raising it blind.
    timeout-minutes: 20
    steps:
      # No `submodules: true`: nothing this job runs reads event-engine-common. No file
      # under `packages/` imports it, the submodule is not a pnpm workspace member, and the
      # import closure of the tag-index decode worker the step below bundles does not reach
      # it. The `typecheck`, `unit` and `component` jobs do read it and keep the checkout.
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        id: install
        run: pnpm install --frozen-lockfile

      # Not a package suite, and deliberately parked in this job anyway: it needs a completed
      # `pnpm install` and a job that FAILS the build, and this is the cheapest one that is
      # both. Adding a fourth job would buy a tidier name for the price of a fourth full
      # install; the step name is what GitHub shows on a failure, so blame stays readable.
      #
      # What it guards: `/api/og` returned 500 on every request for two days because Next
      # 16.3.0 leaves the libvips SVG loader blocked and `next/og` rasterizes through it. We
      # carry the upstream one-line fix as a pnpm patch. The behavioural regression test for
      # that outage lives in the `unit` job above — which does not run on pull requests, so it
      # cannot stop the same breakage reaching production a second time. This runs the structural
      # half of it, against the INSTALLED node_modules rather than the patch file, so a patch
      # that exists but did not apply is caught. ~50ms, no test runner.
      - name: Next SVG loader patch applied
        run: node scripts/ci/assert-next-svg-patch-applied.mjs

      # Parked here for the same reasons as the step above. Guards the @prisma/client patch that
      # memoises the per-model field map (see the script header); reads the INSTALLED runtime.
      - name: Prisma field-map patch applied
        run: node scripts/ci/assert-prisma-field-map-patch-applied.mjs

      # Parked here for the same two reasons as the step above: it needs a completed
      # `pnpm install` and a job that FAILS the build, and this is the cheapest one that is
      # both. `postinstall` has already run `db:generate`, so the re-run inside the script is
      # idempotent and costs ~1s.
      #
      # What it guards: `packages/civitai-db-schema/src/*` is GENERATED but TRACKED, so a
      # commit whose author's editor reformatted it lands a file that disagrees with its own
      # generator, and every developer then gets a spurious dirty tree after `pnpm install`.
      # `db:check-generated` has existed for exactly this and was wired to NOTHING — measured
      # 2026-08-21, it appeared in no workflow. `enums.ts` flipped between the wrapped and
      # unwrapped forms FOUR times in four days (470f0fd993 0, 4214ecb10b 30, 15c1408d3d 31,
      # a5ed2dc83e 0, d0327f55ef 31), and TWICE AFTER `15c1408d3d` made the generator emit
      # Prettier-formatted bytes specifically to end it. That fix is correct; it was a
      # convention with nothing enforcing it, which is why it did not hold.
      #
      # 🔴 The `test -f` is not decoration. `git diff --exit-code -- <path>` exits 0 when the
      # path exists on NEITHER side, so if these files are ever moved, renamed or untracked
      # this gate goes silently and permanently GREEN instead of failing. Verified: an
      # `--exit-code` diff against a nonexistent sibling path exits 0 here today.
      #
      # 🔴 Note for anyone re-testing this: a working-tree edit CANNOT exercise it. The script
      # regenerates before it diffs, so it overwrites your mutation and passes. The regression
      # being caught is a COMMITTED file that disagrees with the generator, so the mutant has
      # to be committed too. Measured both ways: uncommitted edit -> exit 0 (proves nothing),
      # same edit committed -> exit 1 with 62 changed alias lines (= 2 x 31 aliases).
      - name: Generated DB schema files match their generator
        run: |
          test -f packages/civitai-db-schema/src/enums.ts
          pnpm run db:check-generated

      # Same reasons as the step above: a TRACKED generated file must match its generator, and
      # the unit test that also checks this runs in `unit`, which does not run on PRs. The
      # tag-index decode worker runs from this bundle, so a stale one is the decoder that ships.
      # `--check` regenerates in memory and compares, so it writes nothing, and a missing file
      # counts as out of date (exit 1), not as a pass. Like every check here it shows red but does
      # not block a merge (`main` has no required_status_checks).
      - name: Generated tag-index decode worker matches its generator
        run: node scripts/build-tag-index-decode-worker.mjs --check

      - name: Package unit tests
        run: pnpm run test:packages:run --reporter=default --reporter=json --outputFile=packages-report.json

      # A green vitest run is a claim, not evidence: `--project` matching nothing exits 0,
      # and so does a config whose globs stopped resolving. This asserts the LEDGER — every
      # workspace package with a vitest config and a test file on disk must appear in the
      # results — so the job fails when the executed set shrinks, which is the regression the
      # totals cannot see.
      - name: Assert every package suite actually ran
        if: always()
        run: node scripts/ci/assert-workspace-suites-ran.mjs packages-report.json packages

  component:
    name: Component + geometry tests
    runs-on: ubuntu-latest
    # The second clause skips draft PRs unless they carry the `full-ci` label; the third skips
    # labeled events for any other label (see the header).
    if: ${{ (!inputs.only || inputs.only == 'all' || inputs.only == 'component' || inputs.only == 'geometry') && (github.event_name != 'pull_request' || !github.event.pull_request.draft || contains(github.event.pull_request.labels.*.name, 'full-ci')) && (github.event.action != 'labeled' || github.event.label.name == 'full-ci') }}
    # The three browser-mode suites, in one job so ONE checkout, install and Chromium install
    # serves all of them: `component` (blocking), `geometry` (report-only on PRs) and the
    # `component-quarantine` run (push to `main` and dispatch only). Each was its own job until
    # the plan's org-wide concurrent-job limit became the bottleneck: this workflow saturates
    # it, and every job a run starts queues someone else's. Every suite step carries its own
    # selector (`only: component` runs component + quarantine, `only: geometry` runs geometry),
    # and every suite after the first is `!cancelled()`, so one red suite never hides the others.
    #
    # 🔴 THE ONLY JOB IN THIS WORKFLOW THAT INSTALLS A BROWSER, AND THAT IS ALIGNED WITH THE
    # `unit` JOB'S COMMENT RATHER THAN AN OVERRIDE OF IT. That comment gives exactly one reason
    # for keeping browser tests out:
    #
    #   "Node env, no browser — component tests (`*.browser.test.tsx`) are not
    #    here on purpose: they need Chromium, which this job does not install.
    #    That is the whole reason."
    #
    # It is a statement about what THAT job provides, not a ban on providing it. The same
    # comment retracts the only other objection on the record ("Don't cite a cold-cache flake as
    # a reason to keep this job Chromium-free") and points at vitest.config.mts's dedupe +
    # optimizeDeps pre-bundling as the canonical fix for it.
    #
    # Blocking on PRs for `component` itself: `main` was green when it was added, so a red here
    # is the PR's. (`main` has no required checks; this cannot block a merge, only
    # show red on it.) There is no job-level `continue-on-error`: report-only is per step.
    #
    # 35, not the 25 `component` alone had: geometry and the quarantine run each add a few
    # minutes behind it on a push, and this keeps about the headroom over the combined runtime
    # that 25 gave `component` alone. Re-read the step durations before raising it; if
    # `component` alone is near the limit, shard it (see its step) rather than raising this.
    timeout-minutes: 35
    # Per-suite selectors, evaluated once so each step's `if` reads a name rather than
    # repeating the `only` expression. They render as the strings 'true' / 'false'.
    env:
      SUITE_COMPONENT: ${{ !inputs.only || inputs.only == 'all' || inputs.only == 'component' }}
      SUITE_GEOMETRY: ${{ !inputs.only || inputs.only == 'all' || inputs.only == 'geometry' }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # 🔴 THE WORKSPACE-LOCAL PLAYWRIGHT, NOT A PINNED VERSION WRITTEN HERE.
      # `pnpm exec` resolves this repo's own `playwright` (^1.57.0), which knows
      # the exact Chromium revision it wants and fetches THAT. A version named in
      # this file would be a second pin to keep in step, and desynchronising the
      # two is the documented failure: CLAUDE.md records a bump attempt where 59
      # preview specs died with "Executable doesn't exist at
      # .../chromium_headless_shell-<rev>/..." and not one spec ran.
      #
      # `--with-deps` installs the shared libraries Chromium needs on a bare
      # ubuntu-latest image; `chromium` alone, because the browser config in
      # vitest.config.mts declares `instances: [{ browser: 'chromium' }]` and
      # firefox/webkit would be several hundred MB of download for nothing.
      #
      # NOTE FOR ANYONE DEBUGGING THIS FROM A NIXOS LAPTOP: a local
      # revision mismatch (a nixpkgs `playwright-driver.browsers` bundle carrying
      # chromium-1228 against this repo's 1200) is a property of THAT HOST, not of
      # this repo. The escape hatch is `PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH`,
      # honoured by vitest.config.mts. Do NOT move the repo's playwright pin to
      # match a laptop — see docs/dev/worktrees.md, "Browser/component tests on NixOS".
      #
      # ── BROWSER CACHE: RESTORE ALWAYS, SAVE ONLY ON A PUSH TO `main` ──────
      #
      # `~/.cache/ms-playwright` is cached so a run does not download Chromium
      # again. The key is the version of the INSTALLED `playwright` package, read
      # from node_modules: that is exactly the package `pnpm exec playwright`
      # runs, and its version fixes the Chromium revision it wants. Not the
      # lockfile hash, which changes on every dependency bump and would miss for
      # reasons unrelated to the browser.
      #
      # Save is main-push only, for the reason the `unit` job's Vite cache gives:
      # an entry saved on a PR or a dispatch is scoped to that ref, readable by
      # nothing else, and spends the repo's 10 GB cache budget. One entry per
      # Playwright version, refreshed when the version moves. So a PR or a
      # dispatch restores `main`'s entry, and MISSES until a push to `main` with
      # that Playwright version has saved one.
      #
      # The cache holds browser files only, not the system libraries. On a hit,
      # `install-deps` puts those back, and `install chromium` then finds the
      # cached revision complete and downloads nothing (it fetches whatever is
      # missing, so a partial entry still ends with a usable browser). On a miss
      # the command is the one this step always ran. Either way the step id stays
      # `chromium`, and `steps.chromium.outcome == 'success'` still means
      # "Chromium and its system libraries are installed" to the steps that gate on it.
      - name: Resolve Playwright version
        id: playwright
        # An assignment, not `echo "version=$(...)"`: a failing command substitution inside
        # an echo argument does not fail the step, and an empty version would key every run
        # to the same wrong entry.
        run: |
          set -euo pipefail
          version=$(node -p "require('playwright/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Restore Playwright browsers
        id: playwright-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}

      - name: Install Chromium for Playwright
        id: chromium
        env:
          CACHE_HIT: ${{ steps.playwright-cache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          if [ "$CACHE_HIT" = true ]; then
            echo "browser cache hit: installing system dependencies only"
            pnpm exec playwright install-deps chromium
            pnpm exec playwright install chromium
          else
            pnpm exec playwright install --with-deps chromium
          fi

      # Right after the install, so a red suite later still leaves the entry saved.
      # `continue-on-error`: best-effort infrastructure, like the Vite cache save.
      - name: Save Playwright browsers
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.playwright-cache.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}

      # Not sharded, and `pnpm run test:component` takes NO arguments, on purpose:
      # its wrapper hands the JSON report to scripts/ci/assert-component-suite-ran.mjs,
      # which fails a run that executed nothing, fell under the test floor, or left
      # any `*.browser.test.tsx` on disk out of the report. Any argument (`--shard`,
      # `--max-workers`) marks the run narrowed and switches the floor and the file
      # ledger off. Shard only together with a per-shard ledger.
      - name: Component tests
        if: env.SUITE_COMPONENT == 'true'
        run: pnpm run test:component

      # ── GEOMETRY: REPORT-ONLY ON PULL REQUESTS, REAL VERDICT ON `main` ──────────────────
      #
      # The browser-mode `geometry` project — real Chromium, the real app cascade, an explicit
      # phone viewport. See `test/geometry-setup.tsx` for what it loads and why it is a separate
      # project from `component`.
      #
      # `continue-on-error` is `${{ github.event_name == 'pull_request' }}`, and NOT a
      # literal `true`. Both halves matter:
      #
      #   PR side: blocking on a brand-new tier from day one would red unrelated PRs and the
      #   step would be switched off within a week. `main` has NO required_status_checks, so
      #   nothing here blocks a merge either way.
      #
      #   PUSH side: on a push the merge has already happened, so there is no unrelated work to
      #   red. What `continue-on-error: true` WOULD buy there is a run reporting `success` while
      #   the step underneath failed — a green that has to be disbelieved, which is worse than no
      #   run at all.
      #
      # 🔴 NOT A LITERAL `true`: `scripts/__tests__/main-branch-ci-coverage.test.ts` rejects an
      # unconditionally report-only job or step on the push path, because a conditional can
      # differ between a PR and a push while a literal cannot.
      #
      # 🔴 ON A PR A RED GEOMETRY STEP READS `success` EVERYWHERE THE API LOOKS. A step-level
      # `continue-on-error` reports `conclusion: success` for the step in the jobs endpoint and
      # leaves the job green — unlike the job-level one this tier had as its own job, which at
      # least rendered the check red-but-ignored. The `outcome` is visible only inside the run,
      # so `Report-only results` below turns it into a titled annotation. To count clean runs
      # for the flip below, read that annotation (or its absence) from the check run, never the
      # step's conclusion.
      #
      # FLIP TO BLOCKING once a couple of weeks of runs show a clean pass rate, and remove
      # `continue-on-error` from both geometry steps, the annotation step and this paragraph
      # together. What would make that safe, concretely: no run red for a reason other than a
      # real geometry regression — in particular no Chromium launch failures and no timeouts on
      # a 2-core runner. This tier has no import/transform phase to blame, unlike `unit`, so a
      # red is either the code or the browser — both worth someone's attention.
      #
      # Gated on the Chromium install rather than on `component`: it must run after a red
      # component suite, and must not run, and fail a second time, when setup never finished.
      - name: Geometry tests
        id: geometry
        if: ${{ !cancelled() && steps.chromium.outcome == 'success' && env.SUITE_GEOMETRY == 'true' }}
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        run: pnpm exec vitest run --project geometry --reporter=default --reporter=json --outputFile=geometry-report.json

      # 🔴 A GREEN VITEST RUN IS A CLAIM, NOT EVIDENCE — the same hazard the
      # `packages` job's ledger exists for, one project over. `--project` matching
      # NOTHING exits 0, and so does a config whose globs stopped resolving: this
      # tier's glob (`src/**/*.geometry.test.tsx`) is deliberately disjoint from
      # every other project's, which is exactly the kind of narrow pattern that
      # can quietly stop matching. A job that silently runs zero tests is worse
      # than no job, because it reports success.
      #
      # Both numbers are FLOORS, not equalities, so adding a geometry test never
      # breaks this. Which floor to raise when you add to the tier is stated at the floors
      # themselves, below.
      #
      # 🔴 THE FILE COUNT COMES FROM `testResults.length`, NOT FROM
      # `numTotalTestSuites`. Measured against a real report when the tier was 2
      # files, `numTotalTestSuites` read 4, because that field counts `describe`s
      # rather than files. A floor written against it would have been off by a
      # factor that changes whenever someone adds a `describe`.
      #
      # `if: always()` so this runs when the tests FAIL too — an aborted runner
      # writes no report at all, which is precisely the case this must catch, and
      # it is indistinguishable from a healthy run if you only read the step's
      # own status. Report-only on PRs exactly like the tests above, since it is half
      # of their verdict. Gated on the Chromium install like the tests: when setup
      # failed, that step is already the red, and a missing report here would only
      # restate it.
      #
      # All three arms were exercised before this was committed: a real report
      # exits 0; a report with `testResults: []` / `numTotalTests: 0` exits 1; a
      # missing report exits 1 with its own message.
      - name: Assert the geometry tier actually collected something
        id: geometry-ledger
        if: always() && steps.chromium.outcome == 'success' && env.SUITE_GEOMETRY == 'true'
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        run: |
          node - <<'JS'
          // Minimum ledger for the `geometry` tier. Both numbers are FLOORS (see the `<`
          // comparison below). ⚠️ NO CURRENT-COUNT FIGURE IS QUOTED HERE: three consecutive
          // commits restated one and each went stale in the commit that changed the tier,
          // including one that added a test and left the number it had just invalidated.
          // Derive it — `--reporter=json`, `testResults.length` and `numTotalTests`. What is
          // durable: MIN_TESTS carries real headroom by design, MIN_FILES is MEANT to sit at
          // exactly the collected count, so adding a file does not red but losing one does.
          //
          // 🔴 "MEANT TO" IS DOING REAL WORK IN THAT SENTENCE — THE FILE FLOOR HAS NOW DRIFTED
          // TWICE AND IS THE ONE THING IN THIS BLOCK NOBODY MAINTAINS. It sat at 6 against 7
          // on one base branch, and at 8 against 11 collected on the next, so by then THREE
          // files could have stopped being collected with no red; the test floor sat at 10
          // against 101, so ninety could have. An earlier draft claimed FILES "ratchets at
          // exactly current" — that contract is NOT implemented, and a floor that has gone
          // stale on every second change is evidence the instruction below is not enough. If
          // you want a drop of one to be caught reliably, the honest fix is an equality
          // against a count derived from the glob, not a hand-maintained floor. Until someone
          // writes that: raise MIN_FILES when you add a file — it has no headroom, which is
          // the whole point of it — and leave MIN_TESTS alone, which is what "a fraction of
          // current" below means. (An earlier pairing of these comments told you to raise
          // both, which contradicted that.)
          const MIN_FILES = 14;
          // It was 10 — which had ZERO headroom when it was written (the tier was 10 tests
          // then, the same configuration this comment praises the FILE floor for), and became
          // unfailable as the tier grew past it. The GATE was not that weak — it is
          // `files < MIN_FILES || tests < MIN_TESTS`, so the FILE term still caught a dropped
          // file — the hole was in this clause. Deliberately a
          // fraction of current rather than a ratchet, so merging cases in a refactor does
          // not force a floor bump — but a floor that cannot fail is not conservative.
          const MIN_TESTS = 80;
          const REPORT = 'geometry-report.json';

          const fs = require('fs');
          if (!fs.existsSync(REPORT)) {
            console.error(
              `geometry ledger: ${REPORT} was never written. The runner did not finish — a ` +
                'browser that failed to launch, or a config error. That is NOT "the suite is ' +
                'fine"; fail loudly.'
            );
            process.exit(1);
          }
          const r = JSON.parse(fs.readFileSync(REPORT, 'utf8'));
          const files = Array.isArray(r.testResults) ? r.testResults.length : 0;
          const tests = Number(r.numTotalTests ?? 0);
          console.error(`geometry ledger: ${files} file(s), ${tests} test(s) collected`);
          if (files < MIN_FILES || tests < MIN_TESTS) {
            console.error(
              `geometry ledger FAILED: expected at least ${MIN_FILES} file(s) and ${MIN_TESTS} ` +
                `test(s), got ${files} and ${tests}. A vitest run whose --project matches ` +
                'nothing exits 0, so a green verdict here would otherwise be a claim about the ' +
                'selector, not about the code.'
            );
            process.exit(1);
          }
          JS

      # ── QUARANTINE: PUSH TO `main` AND DISPATCH ONLY ─────────────────────────────────────
      #
      # Why: AppAssistantWorkspace.browser.test.tsx stalls on Playwright clicks at random on CI
      # runners, and red-ed PRs that do not touch it (civitai/civitai#7101). It is held out of the
      # blocking `Component tests` step and runs here instead, with the groups skipped there
      # un-skipped. List and exit conditions: scripts/ci/component-quarantine.mjs.
      #
      # Push to `main` and dispatch only; exit criteria in scripts/ci/component-quarantine.mjs,
      # read from runs on `main`. Count the green
      # streak from this STEP's conclusion in push runs on `main` (jobs endpoint): here it is a
      # real verdict, so a red quarantine run turns the `main` run red, attributed by step name.
      # No `continue-on-error`: it was `${{ github.event_name == 'pull_request' }}`, which is
      # always false on a step that never runs on a PR. If PR runs come back, decide then
      # whether they block (a literal `true` is rejected by main-branch-ci-coverage.test.ts,
      # since it would also apply on push).
      #
      # A `--project` that matches nothing exits 0, so the run's JSON report goes through the
      # same gate as the blocking suite (`--narrowed`: a floor and file ledger make no sense for
      # one file). The gate only ever adds a failure; it never turns vitest's red into green.
      - name: Quarantined component tests
        if: ${{ !cancelled() && steps.chromium.outcome == 'success' && github.event_name != 'pull_request' && env.SUITE_COMPONENT == 'true' }}
        run: |
          rc=0
          pnpm exec vitest run --project component-quarantine \
            --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/quarantine-report.json" || rc=$?
          node scripts/ci/assert-component-suite-ran.mjs "$RUNNER_TEMP/quarantine-report.json" --narrowed || exit 1
          exit $rc

      # The only place a report-only red stays visible on a PR: see the geometry paragraph above.
      # Reads each report-only step's `outcome` (what it did) rather than its `conclusion` (what
      # `continue-on-error` turned it into) and writes a titled annotation plus a summary line.
      # It never fails the job.
      - name: Report-only results
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          GEOMETRY: ${{ steps.geometry.outcome }}
          GEOMETRY_LEDGER: ${{ steps.geometry-ledger.outcome }}
        run: |
          for pair in "Geometry tests=$GEOMETRY" "Geometry ledger=$GEOMETRY_LEDGER"; do
            name=${pair%%=*}; outcome=${pair#*=}
            echo "$name: ${outcome:-not run}" >> "$GITHUB_STEP_SUMMARY"
            if [ "$outcome" = failure ]; then
              echo "::error title=$name failed (report-only on pull requests)::$name failed. It does not fail this job on a PR, and its step reads success in the API. Open the step log for the cause."
            fi
          done
