name: Lint

# Regression guard for code quality.
#
# Typecheck is full-repo, and as of talos-infra #855 it is now a NARROW job: it
# runs only where the in-cluster Tekton `pr-check` pipeline does not reach. For
# an internal PR targeting `main` — every PR merged here in living memory — the
# authoritative typecheck is the `tekton / typecheck` commit status, and this job
# skips. See the `typecheck` job comment for the two cases it still covers and
# how each was measured.
#
# 🔴 Read this before treating the fork case as covered. The job carries no
# secret and is not gated by us on the PR's origin — but GitHub gates it for us,
# and the practical outcome is that FORK PRs GET NO TYPECHECK AT ALL TODAY.
# Measured 2026-08-07 over all 16 fork-originated PRs among the ~500 most recent
# PRs: 11 have a retained `Lint` run and ALL ELEVEN sit at
# `conclusion=action_required` (awaiting maintainer approval, zero repository
# code executed); the other 5 are closed PRs whose runs have aged out. `gh pr
# checks` on the open ones reports "no checks reported". Not one fork PR has ever
# produced a Typecheck result.
#
# Two earlier revisions of this comment got this wrong in opposite directions —
# first "typecheck is skipped on fork PRs", then (correcting that) "it runs on
# fork PRs TOO". Both were reasoning from the workflow's CONFIGURATION, which
# says nothing about whether the job RUNS. The configuration genuinely does not
# gate on origin; the approval policy does. Keep the job — it is where fork
# coverage will land the moment a maintainer approves a run, and the sandbox is
# GitHub's rather than ours — but do not cite it as active fork protection.
#
# ESLint and Prettier are split by how the PR touched the file:
#
#   ADDED files      -> BLOCKING. A new file has no pre-existing findings by
#                       definition, so this is free, and it stops the backlog
#                       from growing while the full flip waits.
#   MODIFIED/RENAMED -> report-only (`continue-on-error`). For a formatter,
#                       "changed file" means the WHOLE file, not the changed
#                       lines: 789 of 4,116 src files fail `prettier --check`
#                       today. Across the 98 src files touched by the last 30
#                       commits, 39 fail Prettier and 10 carry a pre-existing
#                       ESLint error - 44 (45%) would red the job for reasons
#                       unrelated to the PR, turning a 3-line bugfix into a
#                       200-line reformat. The job would be off within a week.
#   EVERY FILE       -> report-only, and only when the PR changes lint config,
#                       package.json or pnpm-lock.yaml (list in
#                       scripts/ci/lint-targets.mjs). Those can change the
#                       verdict for files the PR never touched, so checking only
#                       the changed files would hide what the change does. Every
#                       file is linted at HEAD and at the merge base, and only
#                       the findings HEAD adds are reported, so the change's
#                       effect is not buried under the pre-existing backlog.
#
# Findings surface as file annotations on the PR diff: ESLint via the problem
# matcher in .github/problem-matchers/, Prettier via ::warning / ::error commands.
# Report-only steps still show a failed-but-ignored marker in the checks list.
#
# The modified-file steps flip to blocking once the backlog is cleared, planned to
# ride along with the Prettier 2->3 upgrade (which forces a reformat anyway).
#
# ── ALSO RUNS ON PUSH TO `main`, and that is not decoration ──────────────────
#
# Between 2026-06-14 and 2026-08-21 NO CI of any kind produced a verdict for a
# commit on `main`. Two unrelated mechanisms happened to stop on the same day,
# which is why the gap read as one thing and stayed unexplained for two months:
#
#   1. `.github/workflows/pr-check.yml` was deleted by #2547 ("runs in Tekton,
#      removes GH Actions pr-check"). It carried the only live push-to-`main`
#      trigger. Enumerated rather than assumed — every revision of every one of
#      the 12 files that has ever existed under `.github/workflows/` was parsed,
#      and exactly TWO have ever fired on a branch push to `main`:
#      `docker-deploy.yml` (removed 2023-11) and `pr-check.yml`. Two near
#      misses are worth naming so they are not re-counted: `auth-app.yml` has a
#      `push:` block but filters on `tags:` only, which never fires on a branch
#      push, and the last `docker-deploy.yml` had `main` commented out under
#      `branches:`. Everything built after the deletion — this file (#3362,
#      2026-07-24), submodule-pin-guard, schema-drift (#3643), windows-dev-env
#      (#4162) — is `pull_request`-only, so the trigger was never rebuilt.
#      Nobody decided that; it was lost in a move.
#   2. CodeQL, whose runs carried the "Push on main" title in the run list,
#      stopped the same afternoon (code-scanning default setup now reads
#      `not-configured`). Unrelated cause, same date, no test coverage either
#      way — it is named here only so the next reader does not "confirm" the
#      workflow deletion by pointing at a CodeQL run and vice versa.
#
# And Tekton does NOT close it. The in-cluster `pr-check` pipeline is driven by
# a resource that watches OPEN PULL REQUESTS targeting `main`; the only
# main-branch trigger is a container image build for the staging deployment,
# which runs no test suite and posts no commit status. So "Tekton covers main"
# is false, and was the assumption that let the gap persist.
#
# What that cost, concretely: a3e790ff2e was pushed straight to `main` with no
# PR, broke `model-file-scan.service.test.ts`, and sat undetected for ~7 hours.
# It surfaced only when unrelated PRs inherited the failure through their merge
# commits — every open PR going red at once, which reads as a CI outage rather
# than as one bad commit.
#
# 🔴 THE UNIT SUITE IS THE EXCEPTION: it is verified in BATCHES, not per push. A push
# to `main` runs typecheck, typecheck-tests, packages and component; `unit` is skipped there.
# unit-batched.yml dispatches this workflow (`only: unit`) on `main` on a schedule (the cron in
# unit-batched.yml is the one place that sets the cadence) when `main`'s head has moved
# since the last batch run, and on red the `unit-verify` job re-runs the failed
# files, bisects to the first bad merge commit and posts a failing `Unit tests (main batch)` commit
# status ON THAT COMMIT. So a unit regression still renders red on the commit that caused it,
# within about one cadence interval plus the run, instead of within minutes; that is the trade.
# scripts/__tests__/main-branch-ci-coverage.test.ts pins this path instead of a push-reachable one.
#
# The same batch dispatch also runs the `batch-suites` job, which dispatches the suites that left
# pull requests and pushes (Go fuzz / govulncheck / go.mod tidy / benchmarks, moderator boot, ports
# manifest, both image builds, Windows dev-env) on `main` when their paths changed, and posts their
# verdict as the `Batch suites (main batch)` commit status. See that job.
#
# 🔴 THE COMPONENT AND GEOMETRY SUITES ARE BATCHED THE SAME WAY, IN THE SAME RUN: a push runs
# neither. On the bot's `only: unit` batch dispatch the `component` shards and `component-ledger`
# run beside the unit shards, and `component-verify` posts a `Component tests (main batch)` commit
# status by the unit rules (re-run, bisect, first bad commit). The app suites (apps.yml) are
# batched as `App tests (main batch)`; see the contract below.
#
# ── THE `(main batch)` STATUS CONTRACT (what a CI-watch reader can rely on) ──────────────────
#
# One batch = one lint.yml run: event workflow_dispatch, actor github-actions[bot], branch `main`,
# `only: unit`. Every verdict of that batch is a commit status on THAT RUN'S head_sha whose
# target_url is THAT RUN (`<server>/<repo>/actions/runs/<run id>`), so one rule reads all of them:
#   Unit tests (main batch)       poster: `unit-verify`, this run.
#   Component tests (main batch)  poster: `component-verify`, this run.
#   Batch suites (main batch)     poster: `batch-suites`, this run.
#   App tests (main batch)        poster: apps.yml's `apps-verify`, in the apps.yml run the
#                                 `batch-suites` job dispatched at the same commit (target_url that
#                                 apps.yml run), then RE-POSTED by `batch-suites` with the same state
#                                 and description and target_url this run. Read the re-post. It is
#                                 absent when apps.yml's paths did not change since the last green
#                                 batch (not dispatched), which is "no verdict here", not green.
# States: success = green (a description starting `Passed on re-run; flaky:` is a flake, still
# green); failure = red; error = no verdict (crash, unfinished, re-verified next batch). A bisected
# red (unit, component, apps) is ALSO posted on the first bad commit, and its HEAD description
# starts `Failing since first bad commit <10 hex>:`. All posts happen before this run completes:
# `batch-suites` waits for the apps status, and the verify jobs are jobs of this run.
#
# The push path deliberately does NOT run every job here. `eslint` is diff-vs-
# base by construction and is skipped; so are the sibling workflows schema-drift
# and submodule-pin-guard, which are base-relative gates with nothing to compare
# against on a push. (`windows-dev-env` was in that list and did not belong in
# it — it is not base-relative, it just never had a push trigger. It gained one
# on 2026-08-25 to fix an Actions-cache leak; see its header.) The consequence
# is worth stating rather than leaving implied: the added-file ESLint/Prettier
# gate and the stray-migrations guard remain reachable only through a PR, so a
# direct push to `main` still bypasses them. Closing that is a separate change,
# and requires deciding what "the base" means for a push.
#
# A red run on `main` blocks nothing — the merge has already happened, and
# `main` carries no required_status_checks in any case. Its whole value is that
# it renders RED, on the commit that caused it, within minutes instead of
# whenever the next PR happens to inherit it.

# ── DOCS-ONLY CHANGES SKIP THIS WORKFLOW, EXCEPT DOCS A TEST READS ──────────
#
# `paths` rather than `paths-ignore` because only `paths` documents the
# re-include rule: patterns are evaluated in order, so a positive pattern after
# a negative one includes that path again. A change touching ANY file outside
# the excluded trees still runs everything.
#
# No unit test opens a file under docs/ or claudedocs/ today, so nothing is
# re-included. Markdown OUTSIDE these trees is deliberately not excluded:
# tests read CLAUDE.md files, .claude/rules/*.md, app READMEs and the ToS
# markdown under src/. If you add a test that reads a file under docs/ or
# claudedocs/, add that path below the negations.
#
# Known gap: source-nul-bytes scans every .md in the repo, so a docs-only change
# that adds a NUL byte is no longer caught by CI. Accepted for the runner time.
#
# Nothing breaks when this skips: `main` and `release` have no
# required_status_checks, so no PR waits on a check that never starts. If one
# of these jobs ever becomes a required check, a docs-only PR would hang on it
# and this filter must go (or the check must be made path-aware).
#
# ── THE PER-PR TIER ─────────────────────────────────────────────────────────
#
# A ready (non-draft) PR runs: ESLint + Prettier with its blocking smoke steps (`eslint`),
# `Typecheck test files`, `Package unit tests` and `Related unit tests + smoke (PR)`
# (`related-tests`); the whole-repo typecheck is the `tekton / typecheck` status, and the app
# typecheck is apps.yml's. The unit, component and geometry suites (and apps.yml's app suites) do
# NOT run on a PR: they are verified in batches on `main` (above), and on a PR only with the
# `full-ci` label, which runs the batch on the branch (below). A unit, component or app regression
# the related selection misses is found by the next batch run, on `main`, and lands as a red
# status on the commit that caused it.
#
# ── DRAFT PRs RUN ESLINT ONLY ────────────────────────────────────────────────
#
# Every job but `eslint` carries `github.event_name != 'pull_request' ||
# !github.event.pull_request.draft || <the PR has the full-ci label>` in its `if`
# (`unit`, `component` and `component-ledger` have a stricter gate that implies it, and
# `related-tests` skips drafts outright), so on a draft they skip and start
# when the PR is marked ready, or when it gets the `full-ci` label (below). Measured over 24h (2026-10): 92 of 308 PR
# Lint runs (30%), about 31% of PR job-minutes, ran while the PR was a draft,
# mostly agents iterating, on the same concurrent-job limit as everything else.
# Push and dispatch runs are unaffected.
#
# `types` must list `ready_for_review`: the default list (opened, synchronize,
# reopened) omits it, so without it marking a PR ready would start nothing and
# the heavy jobs would wait for the next push.
#
# WANT A VERDICT ON A DRAFT? Dispatch the job on your branch:
#   gh workflow run lint.yml -R civitai/civitai --ref <branch> -f only=<job>
# (`only` choices below; `all` runs everything but ESLint and the whole-repo
# typecheck, which a dispatch runs only as `only=typecheck`). The app suites live
# in apps.yml: `gh workflow run apps.yml -R civitai/civitai --ref <branch>`.
#
# ── THE `full-ci` LABEL RUNS THE FULL SUITE ON A PR ─────────────────────────
#
# With the `full-ci` label on a PR (draft or not), a PR run here includes the
# six `Unit tests` shards and the component + geometry shards (the batch's suites, on the
# branch), and the draft ESLint-only gate is lifted: the `if`s read
# `github.event.pull_request.labels`, the label set in that run's event payload.
# apps.yml honours the same label, behind its own `paths:` filter. The label stays
# on until the full unit suite has passed once on the PR (on some commit, not
# necessarily the head): the `full-ci-done` job removes it after a run whose six
# shards all passed, so later pushes run without the shards; a cancelled or red unit run leaves it on. Re-add it to ask again. Add it
# only when the change touches code the unit or component suites cover and the PR is
# near merge-ready.
#   gh pr edit <n> --add-label full-ci
#
# ADDING the label does not fire this workflow: `types` deliberately omits
# `labeled`. full-ci.yml listens for it and DISPATCHES this workflow (`only: all`)
# on the PR branch, and apps.yml too on a draft PR, so the full suite starts at once (not when the PR's own run on
# that commit already started the shards, e.g. a PR opened with the label); read its header
# for why (a run started by any other label overlays the PR's real check results). That
# dispatch sets `skip_passed`, so it skips the suites the PR run on the same commit passed (the
# `passed` job).
# scripts/__tests__/full-ci-label.test.ts pins this shape.
on:
  pull_request:
    branches: [main, release]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '**'
      - '!docs/**'
      - '!claudedocs/**'
  push:
    branches: [main]
    paths:
      - '**'
      - '!docs/**'
      - '!claudedocs/**'
  # `only` runs one suite (or one unit shard) instead of the whole fan-out, for
  # dispatches that care about a single suite. Every job's `if` reads it, and so
  # does every suite step in a job that hosts several (`component` hosts geometry). On pull_request and push `inputs.only` is empty, so
  # it narrows nothing: what runs there is decided by each job's or step's own
  # event gate (`unit` skips pull requests without the `full-ci` label;
  # ESLint is PR-only; typecheck runs where
  # Tekton does not; drafts run ESLint only unless
  # labeled `full-ci`).
  # The ESLint job is PR-only and never runs on a dispatch, so it is not listed.
  # The app suites moved to apps.yml, which has its own dispatch.
  workflow_dispatch:
    inputs:
      only:
        description: >-
          Run only this suite. all = every suite but typecheck (default). typecheck,
          typecheck-tests (test files only), unit (all 6 shards), unit-1 .. unit-6
          (one shard), packages, geometry, component, related (the PR tier's
          related + smoke tests, for the branch head's last commit).
          App suites: dispatch apps.yml.
        type: choice
        default: all
        options:
          - all
          - typecheck
          - typecheck-tests
          - unit
          - unit-1
          - unit-2
          - unit-3
          - unit-4
          - unit-5
          - unit-6
          - packages
          - geometry
          - component
          - related
      # dc sends this run's civitai-dc jobs to civitai-dc even while the CIVITAI_DC_OFF kill
      # switch is on: one run to check the runners without turning them back on for everyone.
      # Only a dispatch can set it, and only someone with write access can dispatch.
      runner:
        description: >-
          auto = civitai-dc unless the CIVITAI_DC_OFF kill switch is on (default).
          dc = civitai-dc for this run even with the kill switch on.
        type: choice
        default: auto
        options:
          - auto
          - dc
      # Set by full-ci.yml. See the `passed` job.
      skip_passed:
        description: >-
          Skip the suites the pull_request Lint run on this commit already passed.
          Geometry still runs.
        type: boolean
        default: false
      # Set by full-ci.yml. See the `full-ci-done` job. Not part of the concurrency group.
      pr:
        description: >-
          PR number whose full-ci label to remove once every unit shard passes. Leave empty.
        type: string
        required: false
        default: ''

permissions:
  contents: read

# One group per ref, for pull requests AND pushes. On a PR `github.ref` is
# `refs/pull/N/merge`, so a new push to the branch cancels the in-flight run.
# On a push to `main` it is `refs/heads/main`, and there the group QUEUES rather
# than cancels: the running `main` run finishes, at most one newer push waits
# behind it, and a still-newer push replaces the waiting one (GitHub's rule for a
# pending run in a group).
#
# Why queue, not cancel, on `main`. Until 2026-10 a push grouped by `github.sha`,
# so every commit on `main` kept its own full run (10+ jobs) alive and dozens of
# `main` runs queued behind PRs on a plan with a fixed concurrent-job limit. That
# was fixed by cancelling instead, but `main` takes pushes faster than a run
# takes, so cancel-in-progress left most push runs `cancelled` with no verdict.
# Queueing costs about the same runner time and finishes far more of them (the
# replay behind this: docs/testing/reading-ci-results.md, "CI cost
# measurements"). The newest finished run checks a tree that contains every older
# commit; a commit whose run was replaced while waiting shows as `cancelled`. To pin a
# break to one of them, push a branch at that commit and dispatch this workflow
# on it (`only` narrows it to one suite).
#
# A `ready_for_review` run shares the PR's `refs/pull/N/merge` group, so it
# cancels a still-running draft ESLint run. That is fine: the ready run runs
# ESLint again along with everything else.
#
# A workflow_dispatch run groups by ref AND by the `only` input, so a new
# dispatch of the same suite on the same branch cancels the stale one, while
# dispatches of DIFFERENT suites on one branch still run side by side. The
# `dispatch-` prefix keeps these groups disjoint from the PR and push ones.
#
# The batch unit dispatch (unit-batched.yml, dispatched as github-actions[bot] with `only: unit`)
# has its own group, so a person's `only: unit` dispatch on the same ref neither cancels it nor is
# cancelled by it.
concurrency:
  group: lint-${{ github.event_name == 'workflow_dispatch' && github.actor == 'github-actions[bot]' && inputs.only == 'unit' && format('unit-batch-{0}', github.ref) || github.event_name == 'workflow_dispatch' && format('dispatch-{0}-{1}', github.ref, inputs.only) || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  # ── A full-ci DISPATCH SKIPS WHAT THE PR RUN ON THE SAME COMMIT ALREADY PASSED ──────────────
  #
  # full-ci.yml dispatches this workflow (`only: all`, `skip_passed: true`) when the label is
  # added to a PR whose own Lint run did not start the unit shards. That PR run usually runs
  # `Typecheck test files`, `Package unit tests` and the three component shards on the same head
  # commit. This job reads that run's jobs
  # (scripts/ci/lint-dispatch-passed.mjs) and sets an output per suite that PASSED there; those
  # jobs skip here. It waits up to 10 minutes for PR jobs still running, since the label is
  # usually added while they are. A failed, cancelled or unfinished PR job, a lookup error, or
  # this job failing all mean the suite runs here.
  #
  # Same SHA, not the same tree: a PR run tests the PR's merge commit (head plus base), while
  # this dispatch tests the branch head alone. So a skipped suite's verdict is the one on the
  # merge commit; to see the head alone, dispatch without `skip_passed`.
  #
  # Geometry still runs when the component suite is skipped: on a PR it is report-only, so a
  # green shard 1 there says nothing about it, and here it is a real verdict. The unit shards
  # and `typecheck` never wait on this job.
  #
  # A hand dispatch may set `skip_passed` too, with any `only`; it narrows the same way.
  #
  # Every job that `needs` this one has `!cancelled()` in its `if`: on a PR or a push this job
  # is skipped, and without a status function a job whose need was skipped is skipped too.
  passed:
    name: Suites the PR run passed (full-ci dispatch)
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_passed }}
    permissions:
      actions: read
      contents: read
    timeout-minutes: 15
    outputs:
      typecheck_tests: ${{ steps.find.outputs.typecheck_tests }}
      packages: ${{ steps.find.outputs.packages }}
      component: ${{ steps.find.outputs.component }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts/ci/lint-dispatch-passed.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false

      # `github.sha` is the commit this dispatch checks out, so it is the one to match.
      - name: Read the pull_request Lint run on this commit
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: node scripts/ci/lint-dispatch-passed.mjs

  eslint:
    name: ESLint + Prettier (changed files)
    runs-on: ${{ github.repository == 'civitai/civitai' && (vars.CIVITAI_DC_OFF != 'true' || (github.event_name == 'workflow_dispatch' && inputs.runner == 'dc')) && !endsWith(github.actor, '[bot]') && !endsWith(github.event.pull_request.user.login || '', '[bot]') && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && (github.event.pull_request.author_association == 'OWNER' || github.event.pull_request.author_association == 'MEMBER'))) && 'civitai-dc' || 'ubuntu-latest' }}
    # PULL REQUESTS ONLY, and not as a matter of taste. Every step in this job
    # is defined against `FETCH_HEAD...HEAD` where FETCH_HEAD is
    # `origin/$BASE_REF`, and `github.base_ref` is EMPTY on a push event — so on
    # `main` the first step would run `git fetch -q origin ""` and the job would
    # fail for a reason that has nothing to do with the code. "Changed files" is
    # a PR concept here; a push has no base to diff against.
    #
    # `scripts/__tests__/main-branch-ci-coverage.test.ts` pins this as a
    # RELATIONSHIP rather than as this one job's setting: any job in this file
    # that reads `github.base_ref` or `github.event.pull_request` must be gated
    # to pull_request events. That is the guard that catches the NEXT
    # base-relative job someone adds, which would otherwise be red on every
    # commit to `main` from the day it lands.
    if: github.event_name == 'pull_request'
    # Sized for the full run (see the header), which lints every tracked file
    # twice, at HEAD and at the merge base, and may reinstall dependencies for
    # the base. A normal PR finishes far inside it. Keep a full run, including a
    # lockfile reinstall, well clear of the limit: if full runs approach it, raise
    # it rather than letting a config PR time out with no verdict.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # pnpm/action-setup installs the version `packageManager` in package.json pins.
      - uses: pnpm/action-setup@v6

      # The pnpm store (keyed on the lockfile) is the ONLY dependency cache in every workflow
      # here: restored by ./.github/actions/pnpm-store-restore, saved only on `main` by
      # pnpm-store-save, never by setup-node's `cache:` (which saves on PRs too; see the restore
      # action's header). setup-node's automatic caching (`package-manager-cache`, v5+) applies
      # only when `packageManager` names npm, and pnpm/action-setup's own `cache` input defaults
      # to false, so neither adds a second one.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - uses: ./.github/actions/pnpm-store-restore

      - name: Install
        run: pnpm install --frozen-lockfile

      # Writes the file lists the steps below read; see the script's header.
      - name: Collect changed files
        id: changed
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git fetch -q origin "$BASE_REF"
          node scripts/ci/lint-targets.mjs FETCH_HEAD

      # BLOCKING. Migrations live next to the schema in packages/civitai-db-schema.
      # The root prisma/migrations directory predates the monorepo and has no
      # migration_lock.toml, so Prisma never reads it — 68 migrations were written
      # there by hand and silently ignored. `pnpm db:migrate:empty` now targets the
      # right path; this catches the hand-authored case it can't.
      - name: Migrations are in the schema package
        run: |
          set -euo pipefail
          STRAYS=$(git diff --name-only --diff-filter=A FETCH_HEAD...HEAD -- 'prisma/migrations/**' || true)
          if [ -n "$STRAYS" ]; then
            while IFS= read -r f; do
              [ -n "$f" ] || continue
              echo "::error file=$f::Migrations belong in packages/civitai-db-schema/prisma/migrations/. Prisma does not read prisma/migrations/ at the repo root. Use: pnpm run db:migrate:empty \"description\""
            done <<< "$STRAYS"
            exit 1
          fi
          echo "no migrations added outside the schema package"

      # BLOCKING, on every PR including drafts. The moderator app keeps its own copy of the hold
      # SQL; the unit suite that would catch drift does not run on PRs, and a PR touching only the
      # main-app side is not path-filtered into apps.yml.
      - name: Moderator hold SQL matches the main app
        run: pnpm exec vitest run --project 'unit*' src/server/services/__tests__/moderator-delete-hold-parity.test.ts

      # BLOCKING, on every PR including drafts. A route missing from the generated map is a 404.
      - name: API route maps are generated
        run: node scripts/generate-api-routes.mjs --check

      # BLOCKING, on every PR including drafts. The `*.schema-drift.test.ts` files pin the published
      # manifest schema (public/schemas/app-block/v1.json) against the code that enforces it (the
      # manifest validator, the scope and category constants), and the files the Go feed service
      # embeds against the Node modules they are generated from. They live in the unit suite, which
      # runs on a PR only with the `full-ci` label, so a schema or validator edit could otherwise
      # merge without them. Unfiltered on purpose: they read the schema with readFileSync, so no
      # import graph sees it, and a hand-kept list of the files they pin would go stale silently.
      #
      # The file list is a glob, so a new drift test joins by its name. The JSON report is counted
      # because vitest given files it does not match runs the rest and still exits 0.
      #
      # `--reporter=github-actions`: vitest adds that reporter on its own only when NO reporter is
      # named, so listing `default` and `json` drops it and a failing test annotates nothing but
      # the exit code. It prints one `::error` command per failing test it can place in a file
      # (GitHub keeps 10 error annotations per step, 50 per job; the rest stay in the log), appends a
      # pass/fail/flaky summary to GITHUB_STEP_SUMMARY on every run, and ignores `--outputFile`,
      # so the json report each count/ledger step reads is unchanged. Every vitest step that names
      # its reporters carries it: here `Manifest schema drift tests`, `Unit tests`, `Package unit
      # tests`, `Component tests` and `Geometry tests`; the related tier in
      # scripts/ci/related-tests.mjs (node API, same reporter); apps.yml `App unit tests`; ports.yml
      # `Generator tests`. `Moderator hold SQL matches the main app` names none, so it already has it.
      - name: Manifest schema drift tests
        run: |
          set -euo pipefail
          mapfile -t files < <(git ls-files '*.schema-drift.test.ts')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::No *.schema-drift.test.ts files found; this step would have checked nothing."
            exit 1
          fi
          printf '%s\n' "${files[@]}"
          pnpm exec vitest run --project 'unit*' --reporter=default --reporter=json \
            --reporter=github-actions --outputFile=schema-drift-report.json "${files[@]}"
          ran=$(node -e 'console.log(require("./schema-drift-report.json").testResults.length)')
          if [ "$ran" -ne "${#files[@]}" ]; then
            echo "::error::vitest ran $ran of ${#files[@]} schema drift test files; each one must run."
            exit 1
          fi

      - name: Register ESLint problem matcher
        run: echo "::add-matcher::.github/problem-matchers/eslint-unix.json"

      # BLOCKING. New files start clean, so holding them to the rules costs nothing.
      # Errors only (no --max-warnings): the repo has 3,470 warnings and 1,762 uses of
      # `any`, so failing new files on warnings would hold them to a stricter bar than
      # anything already merged. Warnings still annotate.
      - name: ESLint (added files)
        run: |
          set -euo pipefail
          if [ ! -s added-lint.txt ]; then echo "no new lintable files"; exit 0; fi
          xargs -a added-lint.txt pnpm exec eslint --format unix \
            | sed "s|^$GITHUB_WORKSPACE/||"

      - name: Prettier (added files)
        run: |
          set -euo pipefail
          if [ ! -s added.txt ]; then echo "no new files"; exit 0; fi
          xargs -a added.txt pnpm exec prettier --list-different > unformatted-added.txt || true
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            echo "::error file=$f::Not formatted. Run: pnpm exec prettier --write $f"
          done < unformatted-added.txt
          if [ -s unformatted-added.txt ]; then
            echo "$(wc -l < unformatted-added.txt) new file(s) are not formatted."
            exit 1
          fi
          echo "all new files formatted"

      # Report-only: 10% of recently-touched files carry a pre-existing
      # error-severity finding. See the header comment.
      - name: ESLint (modified files, report-only)
        if: steps.changed.outputs.full != 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          if [ ! -s report-lint.txt ]; then echo "no lintable files to report on"; exit 0; fi
          xargs -a report-lint.txt pnpm exec eslint --format unix \
            | sed "s|^$GITHUB_WORKSPACE/||"

      # Report-only: 19% of src files are unformatted today and a formatter has no
      # changed-line granularity. See the header comment.
      - name: Prettier (modified files, report-only)
        if: steps.changed.outputs.full != 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          if [ ! -s report.txt ]; then echo "no files to report on"; exit 0; fi
          xargs -a report.txt pnpm exec prettier --list-different > unformatted.txt || true
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            echo "::warning file=$f::Not formatted (pre-existing, not blocking). Run: pnpm exec prettier --write $f"
          done < unformatted.txt
          if [ -s unformatted.txt ]; then
            echo "$(wc -l < unformatted.txt) file(s) are not formatted (report-only)."
            exit 1
          fi
          echo "all checked files formatted"

      # FULL RUN (lint config or dependencies changed): lint every file at HEAD, then
      # the same files at the merge base, and report only what HEAD adds. The base
      # is checked out in this workspace so the HEAD install is reused; it is
      # reinstalled only when the lockfile differs, since linting the base with
      # HEAD's dependencies would hide every finding a version bump introduces.
      # The script is copied out first because the base may not have it.
      - name: Lint all files at HEAD (full run)
        if: steps.changed.outputs.full == 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/lint"
          cp scripts/ci/lint-new-findings.mjs "$RUNNER_TEMP/lint/"
          node "$RUNNER_TEMP/lint/lint-new-findings.mjs" collect head report-lint.txt report.txt "$RUNNER_TEMP/lint"

      - name: Lint the same files at the merge base (full run)
        if: steps.changed.outputs.full == 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          head_sha=$(git rev-parse HEAD)
          base_sha=$(git merge-base FETCH_HEAD HEAD)
          # -f: postinstall can rewrite tracked generated files, and no later step reads
          # the working tree.
          trap 'git checkout -q -f --detach "$head_sha"' EXIT
          git checkout -q -f --detach "$base_sha"
          if ! git diff --quiet "$base_sha" "$head_sha" -- pnpm-lock.yaml; then
            echo "pnpm-lock.yaml differs from the merge base: installing the base's dependencies"
            pnpm install --frozen-lockfile --prefer-offline
          fi
          node "$RUNNER_TEMP/lint/lint-new-findings.mjs" collect base report-lint.txt report.txt "$RUNNER_TEMP/lint" --existing-only

      # Fails (and annotates) only on findings the PR adds; the backlog both trees
      # share is counted in the step summary but never fails it. continue-on-error
      # keeps the job green either way, like the other report-only steps.
      - name: New lint findings vs merge base (full run, report-only)
        if: steps.changed.outputs.full == 'true'
        continue-on-error: true
        run: node "$RUNNER_TEMP/lint/lint-new-findings.mjs" compare "$RUNNER_TEMP/lint"

  typecheck:
    name: Typecheck (main pushes / fork PRs / non-main base)
    runs-on: ${{ github.repository == 'civitai/civitai' && (vars.CIVITAI_DC_OFF != 'true' || (github.event_name == 'workflow_dispatch' && inputs.runner == 'dc')) && !endsWith(github.actor, '[bot]') && !endsWith(github.event.pull_request.user.login || '', '[bot]') && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && (github.event.pull_request.author_association == 'OWNER' || github.event.pull_request.author_association == 'MEMBER'))) && 'civitai-dc' || 'ubuntu-latest' }}
    # 🔴 NARROWED, not retired (talos-infra #855, stage 1). The in-cluster Tekton
    # `pr-check` pipeline runs `tsc --noEmit` on every PR and posts the result as
    # the `tekton / typecheck` commit status. Running this job as well typechecks
    # the same tree a second time on every internal PR. Tekton is the one that
    # kept reporting through the 2026-08-06 Actions `major_outage` — it POLLS the
    # PR API on a 1m interval rather than taking a webhook, and the incident
    # degraded webhook delivery.
    #
    # This `if:` is the complement of what Tekton covers. Both disjuncts were
    # measured on 2026-08-07, not assumed:
    #
    #   fork PR  — the Tekton side gates fork-authored PRs away by author
    #     association, deliberately: it executes PR code on our own
    #     infrastructure, and GitHub's untrusted-code sandbox is doing work we
    #     would otherwise have to build. So this job is the only typecheck a fork
    #     PR can get. ⚠️ In practice this arm is DORMANT — see the header.
    #
    #   base != main — the Tekton side only watches PRs targeting `main`, so a
    #     PR targeting `release` gets no check from it at all. Rare but real: 4
    #     PRs have ever targeted `release` (0 of the last 200 merged) — most
    #     recent #2582, closed 2026-06-16; last merged #2248, 2026-05-09. Rare is
    #     what makes this cheap, not a reason to drop it.
    #
    #   push to main — the THIRD disjunct, added 2026-08-21. Read this before
    #     trimming it as redundant with the first: the Tekton `pr-check`
    #     pipeline is driven by a resource that watches OPEN PULL REQUESTS
    #     targeting `main`, so a COMMIT on `main` is outside its trigger
    #     entirely. The only Tekton trigger on the main branch builds a
    #     container image for the staging deployment; it runs no `tsc` and posts
    #     no status. So on this path there is no second typecheck to be a
    #     duplicate of — this job is the only one, exactly as in the fork case.
    #
    # Deleting any disjunct silently removes the only typecheck on that path.
    # The honest way to retire this job entirely is to widen Tekton's coverage
    # first and prove it on a real PR of each shape.
    #
    # ⚠️ `github.event.pull_request` is null on a push event, so an UNPINNED PR
    # disjunct evaluates to `null != <string>`, which is TRUE. The PR disjuncts
    # below are now pinned away from dispatches (see the dispatch note), and the
    # explicit `github.event_name == 'push'` arm is what keeps this job on a push
    # to `main`. scripts/__tests__/lint-typecheck-gate.test.ts evaluates this `if`
    # for push, PR and dispatch events and asserts each arm.
    #
    # The name changed with the gate so the checks list explains its own absence.
    # Safe: neither `main` nor `release` has any required_status_checks (verified
    # 2026-08-07 via the branch-protection API, re-verified 2026-08-21), so no
    # merge gate keys on the old name.
    #
    # The last clause skips draft PRs unless they carry the `full-ci` label (see the
    # header); it is true on push and dispatch. It does not widen the three
    # disjuncts: `full-ci` does not make an internal PR into `main` run this job on
    # the PR run.
    #
    # ── ON A DISPATCH, ONLY WHEN ASKED FOR BY NAME (`only: typecheck`) ──
    #
    # Unpinned, the two PR disjuncts compared null with a string on a
    # workflow_dispatch too, which is TRUE (the note above), so every `only: all`
    # dispatch ran this job: every full-ci.yml dispatch and every hand dispatch, on
    # branches whose PR the Tekton `tekton / typecheck` status already covers. A
    # second full-repo typecheck of the same tree, and over 30 days of merged PRs it
    # caught nothing `tekton / typecheck` did not. So the PR disjuncts now apply to
    # every event but a dispatch, and a dispatch runs this job only with
    # `only: typecheck`, which is how to ask for one on a branch Tekton does not
    # watch. (Written `!= 'workflow_dispatch'` rather than `== 'pull_request'`:
    # main-branch-ci-coverage.test.ts reads an `if` containing
    # `github.event_name == 'pull_request'` as unreachable on a push, and this job
    # is the push path's typecheck. The events here are push, pull_request and
    # workflow_dispatch only, so the two spellings select the same runs.)
    if: >-
      (github.event_name == 'push'
      || (github.event_name != 'workflow_dispatch'
          && (github.event.pull_request.head.repo.full_name != github.repository
              || github.event.pull_request.base.ref != 'main'))
      || (github.event_name == 'workflow_dispatch' && inputs.only == 'typecheck'))
      && (github.event_name != 'pull_request' || !github.event.pull_request.draft || contains(github.event.pull_request.labels.*.name, 'full-ci'))
    # event-engine-common is public and fetched over HTTPS, so this needs no
    # secret — which is why the ssh-agent step is gone rather than merely unused.
    # Leaving it in would have kept the fork case broken AND masked the HTTPS
    # path: webfactory/ssh-agent rewrites
    # url."git@key-<sha>.github.com:<owner>/<repo>".insteadOf "https://github.com/<owner>/<repo>"
    # for any loaded key whose comment names a github.com repo, silently sending
    # the new HTTPS URL back over SSH.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - uses: ./.github/actions/pnpm-store-restore

      - name: Install
        run: pnpm install --frozen-lockfile

      - uses: ./.github/actions/pnpm-store-save

      # Must stay `pnpm run typecheck`, not a bare `tsc --noEmit`. The script is
      # a wrapper (scripts/typecheck.mjs) that sets the V8 heap cap AND
      # classifies the outcome: a `tsc` that dies of heap exhaustion emits zero
      # diagnostics, so a raw invocation produces an empty log that reads as a
      # clean pass to anyone scanning it. The wrapper says CRASHED instead.
      - name: Typecheck
        run: pnpm run typecheck

  typecheck-tests:
    name: Typecheck test files (ratchet)
    runs-on: ${{ github.repository == 'civitai/civitai' && (vars.CIVITAI_DC_OFF != 'true' || (github.event_name == 'workflow_dispatch' && inputs.runner == 'dc')) && !endsWith(github.actor, '[bot]') && !endsWith(github.event.pull_request.user.login || '', '[bot]') && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && (github.event.pull_request.author_association == 'OWNER' || github.event.pull_request.author_association == 'MEMBER'))) && 'civitai-dc' || 'ubuntu-latest' }}
    # The root tsconfig excludes every test file, so `pnpm run typecheck` (here and
    # in Tekton) never sees them. This job is their only typecheck: it fails when a
    # change adds a test file with type errors, or raises a baselined file's count
    # (scripts/ci/typecheck-tests-gate.mjs, baseline beside it).
    #
    # Non-draft PRs, dispatch, and push to `main`. The gate compares against the
    # committed baseline, not a PR base, so a push run means what a PR run means. Do
    # not skip push: drafts skip this job and `main` has no required checks, so
    # test-file type errors from draft or red-merged PRs otherwise reach `main`
    # unmeasured and every later PR inherits the red. On `main` it renders red and
    # blocks nothing. Push runs queue (see `concurrency`), so in a burst a commit whose
    # waiting run was replaced shows `cancelled`; the error shows on the next finished one.
    needs: passed
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || !github.event.pull_request.draft || contains(github.event.pull_request.labels.*.name, 'full-ci')) && (!inputs.only || inputs.only == 'all' || inputs.only == 'typecheck-tests') && needs.passed.outputs.typecheck_tests != 'true' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - uses: ./.github/actions/pnpm-store-restore

      - name: Install
        run: pnpm install --frozen-lockfile

      # The gate runs TypeScript 7 from tools/ts7, which a root install does not fetch.
      - name: Install TypeScript 7
        run: pnpm -C tools/ts7 install --ignore-workspace --frozen-lockfile

      # After both installs, so tools/ts7's packages are in the saved store too.
      - uses: ./.github/actions/pnpm-store-save

      - name: Typecheck test files
        run: pnpm run typecheck:tests

  unit:
    name: Unit tests
    runs-on: ${{ github.repository == 'civitai/civitai' && (vars.CIVITAI_DC_OFF != 'true' || (github.event_name == 'workflow_dispatch' && inputs.runner == 'dc')) && !endsWith(github.actor, '[bot]') && !endsWith(github.event.pull_request.user.login || '', '[bot]') && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && (github.event.pull_request.author_association == 'OWNER' || github.event.pull_request.author_association == 'MEMBER'))) && 'civitai-dc' || 'ubuntu-latest' }}
    # ~8,000 tests that until now only ran on whoever remembered to run them.
    # Node env, no browser — component tests (`*.browser.test.tsx`) are not here
    # on purpose: they need Chromium, which this job does not install. That is
    # the whole reason. They run in the `component` job below.
    #
    # This comment used to add "and carry the cold-optimizeDeps
    # flake documented at vitest.config.mts:98-124", which was wrong: those lines
    # document the FIX for that flake, not an open one. vitest.config.mts:109-127
    # dedupes React and pre-bundles `vitest-browser-react` + the JSX runtimes so
    # the optimize pass happens BEFORE the run instead of reloading mid-run, and
    # calls itself the canonical fix; 98-102 is a separate hookTimeout fix.
    # Don't cite a cold-cache flake as a reason to keep this job Chromium-free.
    #
    # ── NOT RUN ON PULL REQUESTS UNLESS ASKED, NOT RUN ON PUSH; VERIFIED IN BATCHES ON `main` ──
    #
    # The `if` below skips this job on `pull_request` unless the PR carries the
    # `full-ci` label (draft or not; the label comes off once all six shards have
    # passed for the PR — `full-ci-done`, see the header), and skips it on every push to `main`. It runs on `workflow_dispatch`,
    # where `only` still selects it — including the batch dispatch on `main` from
    # unit-batched.yml, after which `unit-verify` posts the verdict as a commit status
    # (on the first bad commit when red). See "THE UNIT SUITE IS THE EXCEPTION" in the header.
    #
    # Why, measured over 24h (448 Lint runs, 2026-10): these four shards were 59% of
    # all Lint job-minutes, ~12,400 of ~21,000, ~10,000 of it on PRs. The plan's
    # org-wide concurrent-job limit was saturated around the clock and jobs queued
    # 10-40+ minutes. On a PR that spend bought no verdict: the job was report-only
    # (`continue-on-error` on `pull_request`) from its first day, so it never blocked
    # anything, and it passed 760 of 793 shard runs (96%).
    #
    # THE TRADE, stated plainly: a unit regression is found on `main` after merge,
    # by the next batch run, instead of on the PR. It renders red on the commit that
    # caused it (the bisect), up to one cadence interval plus the run and the bisect later. The
    # `test:lint-rules` convention guards (`src/server/services/__tests__/no-*.test.ts`)
    # run inside this suite, so they move with it.
    #
    # WANT A VERDICT BEFORE MERGING? Add the `full-ci` label to the PR
    # (`gh pr edit <n> --add-label full-ci`), or dispatch this workflow on your
    # branch with `only: unit` (all six shards) or `only: unit-<n>` (one):
    #   gh workflow run lint.yml --ref <branch> -f only=unit
    # Or run `pnpm run test:unit:run` locally, which the root CLAUDE.md already asks for.
    #
    # RELATED TESTS ON A PR, AS A SIGNAL, NOT AS THIS JOB. Running only the tests related to
    # the PR's changed files INSTEAD of this job was built and rejected (#7199, closed):
    # on 20 sampled PRs, 7 still selected the full suite (a change to a widely imported
    # module reaches most of it), the rest a median 557 of ~3,930 files. What runs on a PR
    # now is the `related-tests` job: the same selection, but with a cap (past it, and on
    # any change the import graph cannot follow, it runs the smoke set alone and says
    # "Deferred to batch"), next to the smoke set (repo-scan names and the listed tree-scanning tests). It is a fast signal on the
    # PR; this job, in the batch, is still the verdict for every unit file.
    #
    # NO `continue-on-error`, deliberately. It used to be
    # `${{ github.event_name == 'pull_request' }}` — report-only on PRs, the real
    # verdict on push, because report-only on `main` would make a run read
    # `success` while the suite underneath failed (a green that has to be
    # disbelieved; scripts/__tests__/main-branch-ci-coverage.test.ts forbids an
    # unconditionally report-only job on the push path). With no PR runs that
    # expression is always false, and a dead PR clause only suggests PRs are still
    # covered. The `full-ci` label brought PR runs back on request, and they are
    # NOT report-only either: someone asked for a verdict, so a red suite renders
    # red on the PR (it still blocks no merge; no required checks).
    #
    # Reading a run: with no `continue-on-error`, the job and run conclusions now
    # carry the suite's verdict. Before 2026-10 a PR run read `success` while the
    # `Unit tests` step underneath was `failure`, so for those old runs read
    # `steps[].conclusion` from the jobs endpoint, not the run.
    #
    # `only: unit` runs all six shards; `only: unit-<n>` runs that shard alone
    # (the matrix below narrows to it). The job-level `if` cannot read `matrix`,
    # which is why the shard pick lives in the matrix expression instead.
    #
    # The first clause is the PR gate (no draft clause: a labeled PR runs it as a
    # draft too).
    if: ${{ github.event_name != 'push' && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')) && (!inputs.only || inputs.only == 'all' || inputs.only == 'unit' || startsWith(inputs.only, 'unit-')) }}
    # ── SHARDED ACROSS 6 RUNNERS ────────────────────────────────────────────
    #
    # Vitest's `--shard` cuts a path-hash-ordered list into equal file COUNTS. Fixed
    # cost per shard (setup, checkout, install) is ~100-120s and does not shard.
    #
    # WHY 6, measured 2026-11-17 (only=unit dispatches, two runs per config; the
    # job-minutes column is the sum of all shard jobs):
    #
    #   config               max shard job   job-minutes
    #   N=4                  1005-1076s      64-65
    #   N=6                  816-964s        69-70
    #   N=8 (cost split)     648-883s        69-79
    #
    # 4 -> 6 takes ~15% off the slowest shard (mean 1040s -> 890s over these runs) for a
    # few more job-minutes. N=8 cuts the
    # wall further but adds the fixed cost per extra shard (and one more slot of the
    # plan's org-wide concurrent-job limit, which this workflow already saturates —
    # each extra shard queues someone else's job), and exposes more runners to a slow
    # install (one N=8 shard spent 342s in setup-node + Install against a typical
    # ~65s). Shrink the fixed overhead or the suite before raising this number.
    #
    # A COST-BASED SPLIT WAS MEASURED AND DROPPED. Assigning files greedy longest-first
    # by recorded per-file time (N=4/6/8, two runs each) could not be told apart from
    # the count split at two runs per config: runner speed varies ~1.65x within one
    # run (the same files ran 0.77x on one shard's runner and 1.27x on another's), so
    # the slowest shard is mostly the slowest RUNNER. Modelled, it would take a few
    # percent off the slowest shard (~4% at N=6). Don't rebuild it without several
    # runs per config. Note for anyone measuring: the JSON reporter's per-file
    # startTime/endTime cover only the test bodies, not import, which dominates here.
    #
    # ⚠️ Suite size moves fast: 1,065 files / 16,784 tests on 2026-08-15 became
    # 1,417 files / 22,157 executed ten days later, +33%. Any figure here is a
    # snapshot — re-derive before quoting one.
    #
    # `fail-fast: false` is load-bearing: the default cancels the sibling shards
    # the moment one goes red, which throws away three quarters of the signal
    # from a job whose entire purpose is to report.
    strategy:
      fail-fast: false
      matrix:
        # [1, 2, 3, 4, 5, 6] unless a dispatch named one shard (`only: unit-<n>`). The
        # `--shard=<n>/6` denominator below stays 6 either way, so a single
        # shard runs exactly the files it would in a full run.
        shard: ${{ fromJSON('{"unit-1":[1],"unit-2":[2],"unit-3":[3],"unit-4":[4],"unit-5":[5],"unit-6":[6]}')[inputs.only || 'all'] || fromJSON('[1, 2, 3, 4, 5, 6]') }}
    # Per-shard, not the whole suite. On 2026-10-23, under heavy runner load, shards
    # took 7 to 12.5 minutes, close enough to the old 15m limit to be cancelled by it.
    # Raised 20 -> 25m on 2026-11-10: shard medians had reached 13-16m at N=4 and the
    # heaviest hash shard hit 20m on slow runners. Left at 25m when N went to 6 (shards
    # 8-15m at N=6 on 2026-11-17): the headroom is for slow runners, which do not shard.
    timeout-minutes: 25
    # A real Redis for the tests that must see what Redis itself does: Lua scripts, sorted-set
    # order of equal scores, increment exactness (roster.real-redis.test.ts). Such a test skips
    # itself without its URL, so a shard that does not hold it pays only the container start.
    # Anchored: `unit-verify` re-runs failed files and bisects with the same services and env.
    services: &unit-services
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 2s --health-retries 15
      # A real Postgres for the App Blocks document store's concurrency tests (quota under racing
      # writers, concurrent marks/counters, lock timeout — doc-store.pg.test.ts). Same pattern as
      # Redis above: the file skips itself without its URL, so other shards pay only the container
      # start. The suite creates and drops its own databases on this throwaway server.
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 2s --health-retries 15
    env: &unit-env
      ROSTER_REDIS_URL: redis://localhost:6379/15
      APPDATA_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      # The same throwaway server for the hot-reads-2, placement-reads, hot-reads-3, hot-reads-5 and
      # hot-reads-6 Kysely suites (pinned to the values the retired Prisma reads
      # returned), which drop and recreate their own `hot_reads_2_parity`, `placement_parity` and
      # `hot_reads_<n>_parity` schemas there. Each fails in CI if this is missing rather than
      # skipping itself.
      KYSELY_HOT_READS_2_PARITY_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      KYSELY_HOT_READS_3_PARITY_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      KYSELY_HOT_READS_5_PARITY_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      KYSELY_HOT_READS_6_PARITY_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      # Likewise for the kysely-hot-reads-7 suite (its own `hot_reads_7_parity` schema).
      KYSELY_HOT_READS_7_PARITY_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      # Likewise for the kysely-hot-reads-8 suite (its own `hot_reads_8_parity` schema).
      KYSELY_HOT_READS_8_PARITY_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      # Likewise for the kysely-hot-reads-9 suite (its own `hot_reads_9_parity` schema).
      KYSELY_HOT_READS_9_PARITY_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      # Likewise for the kysely-hot-reads-10 suite (its own `hot_reads_10_parity` schema).
      KYSELY_HOT_READS_10_PARITY_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      # Likewise for the kysely-hot-reads-11 suite (its own `hot_reads_11_parity` schema).
      KYSELY_HOT_READS_11_PARITY_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      # Likewise for the kysely-hot-reads-12 suite (its own `hot_reads_12_parity` schema).
      KYSELY_HOT_READS_12_PARITY_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      # The image_delivery_lookup(url) parity suite: creates and drops its own database and roles
      # on this server, so it needs the superuser URL.
      IMAGE_DELIVERY_LOOKUP_FN_PARITY_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - uses: ./.github/actions/pnpm-store-restore

      - name: Install
        run: pnpm install --frozen-lockfile

      - uses: ./.github/actions/pnpm-store-save

      # ── VITE PRE-BUNDLE CACHE ───────────────────────────────────────────
      #
      # A DIFFERENT cache from the pnpm store one. pnpm-store-restore above
      # restores the pnpm STORE — the downloaded packages. This caches what Vite's
      # dependency optimizer BUILDS out of them.
      #
      # What is in there, measured 2026-08-25 on a warm local checkout rather
      # than assumed: `node_modules/.vite` is 302 MB, all of it under
      # `.vite/vitest/<project-config-hash>/{deps,deps_ssr}` — esbuild pre-bundles
      # — plus a few hundred KB of `results.json`. It is NOT per-test-file output,
      # which is why the key below does not mention the shard's file list: the
      # content is a function of the dependency set and the Vitest config, so
      # `pnpm-lock.yaml` is the right thing to key on.
      #
      # Without it every shard rebuilds this from cold on every run, and nothing
      # else in the repo caches it. (Do not reach for the `optimizeDeps`
      # pre-bundle list in vitest.config.mts as prior art here: that block belongs
      # to the `component` project, which this job does not run. It moves WHEN the
      # optimize pass happens within a run; it does not carry anything between
      # runs.)
      #
      # 🔴 RESTORE ALWAYS, SAVE ONLY ON `main`. This job runs on a pull request only
      # when it carries the `full-ci` label and no longer runs on push, so on `main` it
      # runs as the batch dispatch (unit-batched.yml), which is what saves; the readers
      # are the next batch run, a `workflow_dispatch` on any branch (full-ci.yml
      # dispatches one) and a labeled PR, all of which can read the default branch's scope.
      # A dispatch on another branch or a PR must not save: an entry saved on a
      # feature branch is scoped to that ref, readable by nothing else, and counts
      # against the same 10 GB repo budget as everything useful — the leak a
      # sibling change once cleaned up (20 orphans, 9.65 GB, 95.3% of the budget).
      # Saving only on `main` keeps this at SIX entries total (one per shard).
      #
      # Budget: 6 x 302 MB = 1.81 GB worst case, and that is an over-estimate
      # twice over — the 302 MB is the full local project set (this job runs
      # `--project unit*`, a subset) and Actions compresses on upload.
      #
      # A run whose `pnpm-lock.yaml` differs from `main`'s last saved one misses the
      # exact key and falls back to the prefix, restoring the previous lockfile's
      # bundles; Vite validates its own optimizer metadata and re-optimizes what
      # actually moved. A branch dispatch then saves nothing and pays cold-ish cost; the
      # first run on `main` with that lockfile saves the new key.
      - name: Restore Vite pre-bundle cache
        id: vite-cache
        uses: actions/cache/restore@v6
        with:
          path: node_modules/.vite
          key: vite-unit-${{ runner.os }}-${{ runner.arch }}-${{ matrix.shard }}-${{ hashFiles('pnpm-lock.yaml') }}
          # The last line falls back to ANY shard's entry: the content does not depend on which
          # files a shard runs (see above), so a shard with no entry of its own — a new shard
          # number after the matrix grows — starts from a sibling's bundles instead of cold.
          restore-keys: |
            vite-unit-${{ runner.os }}-${{ runner.arch }}-${{ matrix.shard }}-
            vite-unit-${{ runner.os }}-${{ runner.arch }}-

      # MEMORY SAMPLER, diagnostic. Shard 4 was killed mid-run by the runner ("The runner has
      # received a shutdown signal") several times on 2026-11-18, in the first minutes, when its
      # heaviest PGlite files ran at once. Writes `free -m` every 5 s for the whole job, uploaded
      # below as `unit-memory-<shard>-a<attempt>` even when the runner is starved, so the next
      # kill shows its peak instead of a guess. Remove once the cap below is proven or replaced.
      - name: Start memory sampler
        run: |
          nohup bash -c 'while true; do echo "=== $(date -u +%H:%M:%S)"; free -m; sleep 5; done' > "$RUNNER_TEMP/unit-memory.log" 2>&1 &

      # `scripts/test-unit-run.mjs` forwards process.argv.slice(2) straight into
      # `vitest run --project unit* ...args`, and its queueDecision() returns
      # early on CI, so the dev-server queue never sees this.
      #
      # 🔴 NO `--` SEPARATOR, and that is not a style choice. pnpm forwards `--`
      # through LITERALLY rather than consuming it (measured on pnpm 10.28.1,
      # the version `packageManager` pins and `pnpm/action-setup` installs; also
      # reproduced on 9.0.0):
      #
      #   pnpm run x -- --shard=1/4   ->  ["--", "--shard=1/4"]
      #   pnpm run x    --shard=1/4   ->  ["--shard=1/4"]
      #
      # vitest then DISCARDS every argument after the bare `--` — it does not
      # treat them as filename filters, which an earlier revision of this comment
      # claimed. Measured both ways:
      #
      #   vitest list --filesOnly --project 'unit*' -- assert-shard-ran  -> 1416 files
      #   vitest list --filesOnly --project 'unit*'    assert-shard-ran  ->    1 file
      #
      # The distinction matters when you are debugging: as FILTERS the shard
      # would run almost nothing, but what actually happens is the INVERSE — no
      # `--shard`, no `--outputFile`, so every runner executes the WHOLE suite and
      # writes no report, while the step still exits 0. On the run that shipped
      # this bug the four `Unit tests` steps took 7m30s-9m54s each, which is the
      # tell. The assert step below is what caught it, on its first live run.
      #
      # The `packages` job (and the app suites in apps.yml) have always used this separator-less
      # form; copy them, not the shell habit.
      #
      # No worker cap: Vitest runs its default fork count. Shard 4 once exhausted the hosted
      # runner's 16 GB because the resource-intent PGlite tests never freed an instance; their
      # harness now frees each one after its test (#9535).
      - name: Unit tests
        # The [mem] line also goes into this step's log, which streams live: a runner killed for
        # memory never reaches the upload step below (observed 2026-11-18), but its log keeps
        # every line up to the kill.
        run: |
          nohup bash -c 'while true; do echo "[mem] $(date -u +%H:%M:%S) $(free -m | awk '"'"'/^Mem:/{print "used=" $3 " avail=" $7} /^Swap:/{print "swap=" $3}'"'"' | tr "\n" " ")"; sleep 5; done' &
          pnpm run test:unit:run --shard=${{ matrix.shard }}/6 --reporter=default --reporter=json --reporter=github-actions --outputFile=unit-report.json

      - name: Upload memory samples
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: unit-memory-${{ matrix.shard }}-a${{ github.run_attempt }}
          path: ${{ runner.temp }}/unit-memory.log
          if-no-files-found: ignore
          retention-days: 8

      # 🔴 POSITIVE CONTROL. A `--shard` expression that matches no files exits 0
      # and reports a green check — the same silent-zero class this repo has been
      # bitten by before (a suite that fails to IMPORT reports "no tests", not a
      # failure). A per-shard test count is the cheapest thing that can tell
      # "this shard passed" apart from "this shard ran nothing", and it must run
      # even when the suite above went red, or a red shard hides a zero shard.
      - name: Assert this shard actually ran tests
        # `!cancelled()` rather than `always()`: the guard must still run after a RED
        # suite (that is the case it exists for — a red shard must not hide a zero
        # shard), but a CANCELLED run has no report to read and would render a
        # confusing red assert step on top of the cancellation. Observed on shard 3
        # of the run that shipped the `--` bug.
        if: ${{ !cancelled() }}
        run: node scripts/ci/assert-shard-ran.mjs unit-report.json ${{ matrix.shard }} 6

      # For `unit-verify`, which reads which files failed. Kept briefly.
      - name: Upload unit report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: unit-report-${{ matrix.shard }}
          path: unit-report.json
          if-no-files-found: warn
          retention-days: 3
          # A re-run of a failed shard uploads again under the same name.
          overwrite: true

      # PER-TEST TIMINGS, read a few times a day by an external ci-speed job that ranks slow
      # and flaky tests across runs. The SAME report this job's suite step wrote (no extra test run), under its
      # own `test-times-` name so no download in this workflow can match it — `unit-verify`
      # globs `unit-report-*` and once counted every .json it found. `ignore` when absent: a
      # missing report is already failed, by name, by this suite's own ledger step.
      - name: Upload test timings
        if: ${{ !cancelled() }}
        # Telemetry only: a failed upload must never turn a green suite red.
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: test-times-unit-${{ matrix.shard }}-a${{ github.run_attempt }}
          path: unit-report.json
          if-no-files-found: ignore
          retention-days: 8
          # One artifact per attempt (`-a<run_attempt>`, never overwritten): a failed attempt
          # and its passing re-run on the same commit is exactly the flake the reader counts.

      # The registry adapter's bundle, and its check that every external it loads loads under
      # this Node (`scripts/build-registry-adapter.mjs`), which no other job builds. It takes
      # seconds, so one shard pays it.
      - name: Registry adapter bundle loads its externals
        if: ${{ !cancelled() && matrix.shard == 1 }}
        run: pnpm run build:registry-adapter

      # See the restore step for why this is `main`-only. Three further details:
      #
      #   `!cancelled()` rather than the default — a RED suite still produced a
      #     valid set of pre-bundles, and refusing to save them would mean a
      #     single red commit on `main` leaves every subsequent run cold.
      #   `cache-hit != 'true'` — an exact-key hit means this content is already
      #     stored under this key, so re-uploading ~300 MB would buy nothing. A
      #     PREFIX hit leaves this false, which is right: that content belongs to
      #     a different lockfile and does want re-saving under the new key.
      #   `continue-on-error` — a cache save is best-effort infrastructure. Two
      #     shards can race the same key, and the loser reports "another job may
      #     be creating this cache". That must not red a commit on `main`, where
      #     a red on this job has to mean the code.
      - name: Save Vite pre-bundle cache
        if: ${{ !cancelled() && contains(fromJSON('["push", "workflow_dispatch", "schedule"]'), github.event_name) && github.ref == 'refs/heads/main' && steps.vite-cache.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: node_modules/.vite
          key: vite-unit-${{ runner.os }}-${{ runner.arch }}-${{ matrix.shard }}-${{ hashFiles('pnpm-lock.yaml') }}

  # ── THE PER-PR UNIT TIER: RELATED TESTS + THE SMOKE SET ─────────────────────────────────────
  #
  # What a pull request gets instead of the unit suite (which runs in the main batch, see the
  # `unit` job): the unit tests related to the files the PR changes (vitest's own import-graph
  # selection, the one `vitest related` runs), plus the SMOKE SET: every unit test whose name is a
  # repo-scan name (`no-*`, `*.ledger`, `*.seam`, `*parity*`, `*.schema-drift`, any case) or that
  # is listed in scripts/ci/smoke-scanners.txt (tests that read repo source as text or walk a
  # source tree; its header says what qualifies), since such a test sees a change no import graph
  # does. A listed path that is gone or not a unit test fails the job naming it, and so does an
  # empty smoke set.
  #
  # THE FALLBACK. When the PR changes something the import graph cannot follow or that alters how
  # every test runs (vitest/vite config, the unit setup files and every module they import, read
  # from the config at run time, test/, fixtures, any tsconfig, package manifests and
  # the lockfile, the Prisma schema, the generated db-schema package, the test-cache scripts, CI
  # workflows, a removed source file, any non-source file a test may read at runtime), or the
  # related selection is over the cap (RELATED_UNIT_CAP, 250 files), this runs the smoke set alone
  # and says "Deferred to batch" in the step summary. scripts/ci/related-tests.mjs owns that rule;
  # its tests are scripts/__tests__/related-tests.test.ts.
  #
  # A FAST SIGNAL, NOT THE VERDICT: it never replaces the batch, which runs every unit file on
  # `main` after the merge. Not on a PR carrying `full-ci` (the `unit` job runs the whole suite
  # there), not on a draft. The selection diffs HEAD against its first parent: on a PR that is the merge
  # commit against the base. A dispatch with `only: related` runs it on a branch for the branch
  # head's last commit alone (`HEAD^1..HEAD`), to see what the PR tier would run for one change.
  #
  # Hosted, with the `unit` job's services and env: a related or smoke file may be one of the
  # Postgres- or Redis-backed suites, several of which fail rather than skip without their URL.
  # ── SPLIT 2 WAYS: TWO SHARDS THAT EACH PLAN, ONE LEDGER ──
  #
  # Each `related-tests` shard computes the same plan itself (the selection, from the same commit
  # with the same code) and runs its half, so no shard waits on a plan job; `related-ledger` keeps
  # the job's original check name, checks the shards agreed and is its verdict.
  #
  # ── THE INSTALLED TREE IS CACHED, KEYED ON WHAT AN INSTALL READS ──
  #
  # The pnpm store cache (.github/actions/pnpm-store-restore) holds the STORE only, so every job still links ~2,300 packages
  # and runs the root postinstall (`db:generate`: the slim schema and five Prisma generators).
  # Measured on a shard: store restore ~14 s, then `pnpm install` 41.6 s (link ~13 s, workspace
  # prepare scripts ~5 s, postinstall ~23 s). These jobs restore the installed tree instead:
  # every `node_modules` plus the gitignored slim schema the postinstall writes, keyed on the
  # runner image, the lockfile, the workspace file, the workspace members' manifests WITHOUT their
  # `version` (scripts/ci/related-install-key.mjs: most commits to `main` are release bumps, and
  # hashing raw manifests made each one a new entry), `.nvmrc`, `patches/` and the postinstall's
  # inputs (the full schema and its generator scripts), so a key can only ever hold what an
  # install of those inputs produces. The cached paths follow pnpm-workspace.yaml's includes;
  # scripts/__tests__/related-install-key.test.ts fails when they drift apart. An exact hit skips the store restore and the install
  # and runs only the apps' `prepare` (it writes from the checkout); a miss installs as before.
  #
  # 🔴 SAVED ONLY ON `main`, by `related-cache` on the batch dispatch, the rule the `unit` job's
  # Vite cache states: an entry saved by a PR is scoped to that PR's ref, readable by nothing else,
  # and spends the repo's 10 GB cache budget. One entry per key; a PR with its own lockfile
  # misses and installs.
  related-tests:
    name: Related unit tests + smoke (PR) (${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    if: ${{ (github.event_name == 'pull_request' && !github.event.pull_request.draft && !contains(github.event.pull_request.labels.*.name, 'full-ci')) || (github.event_name == 'workflow_dispatch' && inputs.only == 'related') }}
    timeout-minutes: 30
    # `fail-fast: false`: a red shard must not cancel the other, or its files go unreported and
    # the ledger can only say "missing".
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 2s --health-retries 15
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 2s --health-retries 15
    env: *unit-env
    steps:
      # Depth 2: the plan diffs the PR's merge commit against its first parent (the base).
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          submodules: true
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      # The key's inputs that are not plain files: the workspace members' manifests with `version`
      # stripped (scripts/ci/related-install-key.mjs: a release bump changes no install), and the
      # runner image (`ImageOS`, e.g. ubuntu24, which the expression `env` context does not see),
      # so a new Ubuntu release never restores a tree built against another one's libraries.
      - &related-nm-key-step
        name: Cache key inputs
        id: key
        run: |
          node scripts/ci/related-install-key.mjs .related-install-manifests.txt
          echo "image=${ImageOS:?}" >> "$GITHUB_OUTPUT"

      - name: Restore the installed tree
        id: nm
        uses: actions/cache/restore@v6
        with:
          path: &related-nm-paths |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
            packages/civitai-db-schema/prisma/schema.prisma
          key: &related-nm-key related-nm-${{ runner.os }}-${{ steps.key.outputs.image }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', '.related-install-manifests.txt', '.nvmrc', '.npmrc', 'patches/**', 'packages/civitai-db-schema/prisma/schema.full.prisma', 'scripts/generate-slim-schema.js', 'scripts/prisma-*-generator.mjs') }}

      # The store cache only matters to an install, which an exact hit skips.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - uses: ./.github/actions/pnpm-store-restore
        if: steps.nm.outputs.cache-hit != 'true'

      - name: Install
        if: steps.nm.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile

      # What an install writes OUTSIDE the cached tree, from the checkout rather than the
      # lockfile: each app's `prepare` (`svelte-kit sync`, which writes `apps/*/.svelte-kit` from
      # that app's routes and config, so it cannot be cached on the install key). Measured: without
      # it the app-reading unit tests fail on a missing `.svelte-kit/tsconfig.json`. `--if-present`
      # so an app with no `prepare` is skipped, and a new app's is run.
      - name: App prepare scripts (cache hit)
        if: steps.nm.outputs.cache-hit == 'true'
        run: pnpm -r --filter './apps/*' --if-present run prepare

      - name: Plan, then run this shard
        env:
          SHARD: ${{ matrix.shard }}
          TOTAL: ${{ strategy.job-total }}
        run: node scripts/ci/related-tests.mjs shard HEAD^1 "$SHARD" "$TOTAL" "$RUNNER_TEMP/related-report"

      # For `related-ledger`: the report and the two lists. `!cancelled()` so a RED shard still
      # hands them over.
      - name: Upload the shard report and plan
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: related-report-${{ matrix.shard }}
          path: ${{ runner.temp }}/related-report
          if-no-files-found: warn
          retention-days: 3
          overwrite: true

  # The whole tier's verdict, under the check name the unsplit job had. Red when a shard did not
  # succeed; when the shards planned different files, or their lists overlap or leave a planned
  # file out (related-tests.mjs `ledger`); when a shard report is missing, holds a file another
  # shard also ran, or comes from a shard index outside the matrix
  # (merge-component-shard-reports.mjs); or when the union misses a file the plan listed.
  related-ledger:
    name: Related unit tests + smoke (PR)
    needs: related-tests
    runs-on: ubuntu-latest
    if: ${{ !cancelled() && ((github.event_name == 'pull_request' && !github.event.pull_request.draft && !contains(github.event.pull_request.labels.*.name, 'full-ci')) || (github.event_name == 'workflow_dispatch' && inputs.only == 'related')) }}
    timeout-minutes: 10
    steps:
      # scripts/ci only: no install.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Download the shard reports and plans
        uses: actions/download-artifact@v7
        with:
          pattern: related-report-*
          path: ${{ runner.temp }}/related-reports

      # All three checks always run, so every problem is named. 2: the `related-tests` matrix,
      # which this job cannot read; both scripts also fail on any shard outside 1..2.
      - name: The shards agreed, and every planned file ran exactly once
        run: |
          rc=0
          node scripts/ci/related-tests.mjs ledger "$RUNNER_TEMP/related-reports" 2 || rc=1
          node scripts/ci/merge-component-shard-reports.mjs "$RUNNER_TEMP/related-reports" 2 "$RUNNER_TEMP/related-merged.json" related-report || rc=1
          node scripts/ci/related-tests.mjs assert "$RUNNER_TEMP/related-reports/files.txt" "$RUNNER_TEMP/related-merged.json" || rc=1
          exit $rc

      - name: Every shard succeeded
        if: ${{ !cancelled() }}
        env:
          SHARDS: ${{ needs.related-tests.result }}
        run: |
          if [ "$SHARDS" != success ]; then
            echo "::error title=Related tests did not succeed::the shards concluded '$SHARDS'. Open the red shard for the cause."
            exit 1
          fi

  # Saves the related jobs' installed tree (see `related-tests`), on `main` only: the bot's batch
  # dispatch, about every two hours. A no-op when that key is already saved.
  related-cache:
    name: Related tests install cache (main batch)
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' && github.actor == 'github-actions[bot]' && inputs.only == 'unit' && github.ref == 'refs/heads/main' }}
    # Best-effort infrastructure: a failed install or save must never paint the batch run red,
    # where a red means a suite. An expression, not a literal `true`: this job runs only on that
    # dispatch, so it reads true wherever it runs, and the push-path guard in
    # main-branch-ci-coverage.test.ts (no unconditional report-only job) keeps its meaning.
    continue-on-error: ${{ github.event_name == 'workflow_dispatch' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - *related-nm-key-step

      - name: Is it saved already?
        id: nm
        uses: actions/cache/restore@v6
        with:
          path: *related-nm-paths
          key: *related-nm-key
          lookup-only: true

      - uses: actions/setup-node@v7
        if: steps.nm.outputs.cache-hit != 'true'
        with:
          node-version-file: .nvmrc

      - uses: ./.github/actions/pnpm-store-restore
        if: steps.nm.outputs.cache-hit != 'true'

      - name: Install
        if: steps.nm.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile

      # Saves only on `main` (this job's own gate, and the action's).
      - uses: ./.github/actions/pnpm-store-save
        if: steps.nm.outputs.cache-hit != 'true'

      # Best-effort infrastructure, like the Vite cache save: a failed save must not red `main`.
      - name: Save the installed tree
        if: steps.nm.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: *related-nm-paths
          key: *related-nm-key

  packages:
    name: Package unit tests
    runs-on: ${{ github.repository == 'civitai/civitai' && (vars.CIVITAI_DC_OFF != 'true' || (github.event_name == 'workflow_dispatch' && inputs.runner == 'dc')) && !endsWith(github.actor, '[bot]') && !endsWith(github.event.pull_request.user.login || '', '[bot]') && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && (github.event.pull_request.author_association == 'OWNER' || github.event.pull_request.author_association == 'MEMBER'))) && 'civitai-dc' || 'ubuntu-latest' }}
    # Skips draft PRs unless they carry the `full-ci` label (see the header). The app typecheck that rode here moved to apps.yml with
    # the app suites, so this job is the package suites plus the install-time asserts below.
    needs: passed
    if: ${{ !cancelled() && (!inputs.only || inputs.only == 'all' || inputs.only == 'packages') && (github.event_name != 'pull_request' || !github.event.pull_request.draft || contains(github.event.pull_request.labels.*.name, 'full-ci')) && needs.passed.outputs.packages != 'true' }}
    # The `packages/*` suites — 616 tests when this job was added, which until then NO CI job ran.
    # The `unit` job above runs `vitest run --project unit`, whose `include` is root-relative
    # (`src/**`, `scripts/**`), so nothing in this repo ever invoked a workspace package's
    # suite. That is not a small gap: the schema-drift detector shipped 81 tests into it,
    # and two of them had been RED on `main` since #3592 corrected the schema out from under
    # their assertions, with nothing to say so.
    #
    # NOT `continue-on-error`, and it runs on pull requests. Be precise about what that does
    # and does not buy: `main` has branch protection but NO required_status_checks, so a red
    # check here does not prevent a merge. What it buys is that a red renders RED on the PR —
    # a signal someone has to look at and dismiss, not one the UI hides. Making it an actual
    # interlock means adding "Package unit tests" to the required checks, which is a
    # repo-settings change, not a workflow one.
    #
    # Why this one runs on PRs when `unit` does not: `unit` is ~12,000+ tests whose cost is a
    # ~33s import/transform phase per file, six shards and most of this workflow's
    # job-minutes (see its comment). This is 616 tests with no browser, no database and no
    # Next module graph — ~15s locally.
    #
    # DB-backed tiers self-skip: `@civitai/db-queries` sources DATABASE_URL from the root
    # `.env`, which does not exist on a runner, so its DB-backed tests (the `*.explain.test.ts`
    # files) report as skipped. They are visible as skips in the summary rather than as a silent
    # absence.
    # Those EXPLAIN checks therefore have NEVER run in CI — they are laptop-only evidence.
    # The same is true of the two Kysely/Prisma parity suites in the app's `unit` project
    # (kysely-prisma-parity and image-generation-data.kysely-parity), which self-skip without
    # KYSELY_PARITY_DATABASE_URL.
    #
    # 20m is several times the runtime (package suites ~30s, install ~40s, 2026-10-29). If it
    # ever approaches that, re-read the step durations rather than raising it blind.
    timeout-minutes: 20
    steps:
      # No `submodules: true`: nothing this job runs reads event-engine-common. No file
      # under `packages/` imports it, the submodule is not a pnpm workspace member, and the
      # import closure of the tag-index decode worker the step below bundles does not reach
      # it. The `typecheck`, `unit` and `component` jobs do read it and keep the checkout.
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - uses: ./.github/actions/pnpm-store-restore

      - name: Install
        id: install
        run: pnpm install --frozen-lockfile

      - uses: ./.github/actions/pnpm-store-save

      # Not a package suite, and deliberately parked in this job anyway: it needs a completed
      # `pnpm install` and a job that FAILS the build, and this is the cheapest one that is
      # both. Adding a fourth job would buy a tidier name for the price of a fourth full
      # install; the step name is what GitHub shows on a failure, so blame stays readable.
      #
      # What it guards: `/api/og` returned 500 on every request for two days because Next
      # 16.3.0 leaves the libvips SVG loader blocked and `next/og` rasterizes through it. We
      # carry the upstream one-line fix as a pnpm patch. The behavioural regression test for
      # that outage lives in the `unit` job above — which does not run on pull requests, so it
      # cannot stop the same breakage reaching production a second time. This runs the structural
      # half of it, against the INSTALLED node_modules rather than the patch file, so a patch
      # that exists but did not apply is caught. ~50ms, no test runner.
      - name: Next SVG loader patch applied
        run: node scripts/ci/assert-next-svg-patch-applied.mjs

      # Parked here for the same reasons as the step above. Guards the @prisma/client patch that
      # memoises the per-model field map (see the script header); reads the INSTALLED runtime.
      - name: Prisma field-map patch applied
        run: node scripts/ci/assert-prisma-field-map-patch-applied.mjs

      # Parked here for the same two reasons as the step above: it needs a completed
      # `pnpm install` and a job that FAILS the build, and this is the cheapest one that is
      # both. `postinstall` has already run `db:generate`, so the re-run inside the script is
      # idempotent and costs ~1s.
      #
      # What it guards: `packages/civitai-db-schema/src/*` is GENERATED but TRACKED, so a
      # commit whose author's editor reformatted it lands a file that disagrees with its own
      # generator, and every developer then gets a spurious dirty tree after `pnpm install`.
      # `db:check-generated` has existed for exactly this and was wired to NOTHING — measured
      # 2026-08-21, it appeared in no workflow. `enums.ts` flipped between the wrapped and
      # unwrapped forms FOUR times in four days (470f0fd993 0, 4214ecb10b 30, 15c1408d3d 31,
      # a5ed2dc83e 0, d0327f55ef 31), and TWICE AFTER `15c1408d3d` made the generator emit
      # Prettier-formatted bytes specifically to end it. That fix is correct; it was a
      # convention with nothing enforcing it, which is why it did not hold.
      #
      # 🔴 The `test -f` is not decoration. `git diff --exit-code -- <path>` exits 0 when the
      # path exists on NEITHER side, so if these files are ever moved, renamed or untracked
      # this gate goes silently and permanently GREEN instead of failing. Verified: an
      # `--exit-code` diff against a nonexistent sibling path exits 0 here today.
      #
      # 🔴 Note for anyone re-testing this: a working-tree edit CANNOT exercise it. The script
      # regenerates before it diffs, so it overwrites your mutation and passes. The regression
      # being caught is a COMMITTED file that disagrees with the generator, so the mutant has
      # to be committed too. Measured both ways: uncommitted edit -> exit 0 (proves nothing),
      # same edit committed -> exit 1 with 62 changed alias lines (= 2 x 31 aliases).
      - name: Generated DB schema files match their generator
        run: |
          test -f packages/civitai-db-schema/src/enums.ts
          pnpm run db:check-generated

      # Same reasons as the step above: a TRACKED generated file must match its generator, and
      # the unit test that also checks this runs in `unit`, which does not run on PRs. The
      # tag-index decode worker runs from this bundle, so a stale one is the decoder that ships.
      # `--check` regenerates in memory and compares, so it writes nothing, and a missing file
      # counts as out of date (exit 1), not as a pass. Like every check here it shows red but does
      # not block a merge (`main` has no required_status_checks).
      - name: Generated tag-index decode worker matches its generator
        run: node scripts/build-tag-index-decode-worker.mjs --check

      - name: Package unit tests
        run: pnpm run test:packages:run --reporter=default --reporter=json --reporter=github-actions --outputFile=packages-report.json

      # A green vitest run is a claim, not evidence: `--project` matching nothing exits 0,
      # and so does a config whose globs stopped resolving. This asserts the LEDGER — every
      # workspace package with a vitest config and a test file on disk must appear in the
      # results — so the job fails when the executed set shrinks, which is the regression the
      # totals cannot see.
      - name: Assert every package suite actually ran
        if: always()
        run: node scripts/ci/assert-workspace-suites-ran.mjs packages-report.json packages

      # PER-TEST TIMINGS: see the `unit` job's `Upload test timings` step.
      - name: Upload test timings
        if: ${{ !cancelled() }}
        # Telemetry: never turns a PR red. On a push to main a failed upload fails the job,
        # so a broken uploader shows rather than reading green (main-branch-ci-coverage.test.ts).
        continue-on-error: ${{ github.event_name != 'push' }}
        uses: actions/upload-artifact@v7
        with:
          name: test-times-packages-a${{ github.run_attempt }}
          path: packages-report.json
          if-no-files-found: ignore
          retention-days: 8
          # One artifact per attempt (`-a<run_attempt>`, never overwritten): a failed attempt
          # and its passing re-run on the same commit is exactly the flake the reader counts.

  component:
    name: Component + geometry tests (${{ matrix.shard }}/3)
    # Pinned: Playwright 1.57 cannot install chromium deps on ubuntu-latest (26.04) yet.
    runs-on: ubuntu-24.04
    # ── NOT RUN ON PULL REQUESTS UNLESS ASKED, NOT RUN ON PUSH; VERIFIED IN BATCHES ON `main` ──
    #
    # The same gate as the `unit` job (`github.event_name != 'push'` and the label clause): skipped
    # on a push to `main` and on a pull request without the `full-ci` label (draft or not). It runs
    # on a dispatch, including the bot's `only: unit` batch dispatch (the first clause's last
    # alternative), after which `component-verify` posts the verdict as a `Component tests (main
    # batch)` commit status, on the first bad commit when red (scripts/ci/unit-batched.mjs). A
    # person's `only: unit` dispatch runs the unit shards alone, as before. The per-PR tier has no
    # browser suite; a PR gets the `related-tests` job instead (header, "THE PER-PR TIER").
    #
    # On a full-ci dispatch whose PR run passed the component suite (`passed`), only shard 1
    # runs, with geometry alone, exactly as `only: geometry` does. On `only: component` that
    # leaves nothing to run, so the job skips.
    needs: passed
    if: ${{ !cancelled() && (!inputs.only || inputs.only == 'all' || inputs.only == 'component' || inputs.only == 'geometry' || (inputs.only == 'unit' && github.actor == 'github-actions[bot]')) && github.event_name != 'push' && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')) && (inputs.only != 'component' || needs.passed.outputs.component != 'true') }}
    # ── `component` SHARDED ACROSS 3 RUNNERS; GEOMETRY ON SHARD 1 ──
    #
    # Only the component tests step shards; setup (checkout, install, Chromium) is paid again by
    # EVERY shard, and geometry rides on shard 1. 3, not 4: a fourth shard saves under a minute
    # of wall clock while adding another setup and one more slot of the plan's org-wide
    # concurrent-job limit (see the `unit` job's "WHY 4 AND NOT MORE" for that trade). Shards 2
    # and 3 carry `component` only.
    #
    # `--shard` is not cost-aware: it splits by FILE COUNT, so READ THE THREE DURATIONS after
    # any change to this matrix or to the suite's heaviest files.
    #
    # Every test file is still accounted for: each shard runs the zero check
    # on its own report, and the `component-ledger` job below merges the three reports, fails
    # on a missing shard, and runs the full ledger (zero check,
    # on-disk file ledger, floor) on the union — the same gate the unsharded run had.
    #
    # `fail-fast: false`: a red shard must not cancel its siblings, or their files go
    # unreported and the ledger can only say "missing".
    strategy:
      fail-fast: false
      matrix:
        # `only: geometry` runs geometry alone, which lives on shard 1, so it needs only that;
        # so does a dispatch whose PR run passed the component suite (`passed`).
        # The `--shard=<n>/3` denominator stays 3 whatever the matrix holds.
        shard: ${{ (inputs.only == 'geometry' || needs.passed.outputs.component == 'true') && fromJSON('[1]') || fromJSON('[1, 2, 3]') }}
    # The two browser-mode suites, in one job so ONE checkout, install and Chromium install
    # serves both: `component` (blocking) and `geometry` (report-only on PRs). Each was its own job until
    # the plan's org-wide concurrent-job limit became the bottleneck: this workflow saturates
    # it, and every job a run starts queues someone else's. Every suite step carries its own
    # selector (`only: component` runs component, `only: geometry` runs geometry),
    # and every suite after the first is `!cancelled()`, so one red suite never hides the others.
    #
    # 🔴 THE ONLY JOB IN THIS WORKFLOW THAT INSTALLS A BROWSER, AND THAT IS ALIGNED WITH THE
    # `unit` JOB'S COMMENT RATHER THAN AN OVERRIDE OF IT. That comment gives exactly one reason
    # for keeping browser tests out:
    #
    #   "Node env, no browser — component tests (`*.browser.test.tsx`) are not
    #    here on purpose: they need Chromium, which this job does not install.
    #    That is the whole reason."
    #
    # It is a statement about what THAT job provides, not a ban on providing it. The same
    # comment retracts the only other objection on the record ("Don't cite a cold-cache flake as
    # a reason to keep this job Chromium-free") and points at vitest.config.mts's dedupe +
    # optimizeDeps pre-bundling as the canonical fix for it.
    #
    # Blocking for `component` itself wherever it runs (a labelled PR, a dispatch, the batch).
    # (`main` has no required checks; this cannot block a merge, only show red on it.) There is no
    # job-level `continue-on-error`: report-only is per step.
    #
    # Per shard. 25, not 35/3: setup does not shard. If a shard nears the limit, raise the
    # shard count rather than this.
    timeout-minutes: 25
    # Per-suite selectors, evaluated once so each step's `if` reads a name rather than
    # repeating the `only` expression. They render as the strings 'true' / 'false'.
    env:
      SUITE_COMPONENT: ${{ needs.passed.outputs.component != 'true' && (!inputs.only || inputs.only == 'all' || inputs.only == 'component' || (inputs.only == 'unit' && github.actor == 'github-actions[bot]')) }}
      SUITE_GEOMETRY: ${{ !inputs.only || inputs.only == 'all' || inputs.only == 'geometry' || (inputs.only == 'unit' && github.actor == 'github-actions[bot]') }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - uses: ./.github/actions/pnpm-store-restore

      - name: Install
        run: pnpm install --frozen-lockfile

      - uses: ./.github/actions/pnpm-store-save

      # 🔴 THE WORKSPACE-LOCAL PLAYWRIGHT, NOT A PINNED VERSION WRITTEN HERE.
      # `pnpm exec` resolves this repo's own `playwright` (^1.57.0), which knows
      # the exact Chromium revision it wants and fetches THAT. A version named in
      # this file would be a second pin to keep in step, and desynchronising the
      # two is the documented failure: CLAUDE.md records a bump attempt where 59
      # preview specs died with "Executable doesn't exist at
      # .../chromium_headless_shell-<rev>/..." and not one spec ran.
      #
      # `--with-deps` installs the shared libraries Chromium needs on a bare
      # ubuntu-latest image; `chromium` alone, because the browser config in
      # vitest.config.mts declares `instances: [{ browser: 'chromium' }]` and
      # firefox/webkit would be several hundred MB of download for nothing.
      #
      # NOTE FOR ANYONE DEBUGGING THIS FROM A NIXOS LAPTOP: a local
      # revision mismatch (a nixpkgs `playwright-driver.browsers` bundle carrying
      # chromium-1228 against this repo's 1200) is a property of THAT HOST, not of
      # this repo. The escape hatch is `PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH`,
      # honoured by vitest.config.mts. Do NOT move the repo's playwright pin to
      # match a laptop — see docs/dev/worktrees.md, "Browser/component tests on NixOS".
      #
      # ── BROWSER CACHE: RESTORE ALWAYS, SAVE ONLY ON `main` ──────
      #
      # `~/.cache/ms-playwright` is cached so a run does not download Chromium
      # again. The key is the version of the INSTALLED `playwright` package, read
      # from node_modules: that is exactly the package `pnpm exec playwright`
      # runs, and its version fixes the Chromium revision it wants. Not the
      # lockfile hash, which changes on every dependency bump and would miss for
      # reasons unrelated to the browser.
      #
      # Save is `main`-only, for the reason the `unit` job's Vite cache gives:
      # an entry saved on a PR or a branch dispatch is scoped to that ref, readable by
      # nothing else, and spends the repo's 10 GB cache budget. One entry per
      # Playwright version, refreshed when the version moves. This job no longer runs
      # on a push, so on `main` the saver is the batch dispatch. A PR or a branch
      # dispatch restores `main`'s entry, and MISSES until a batch run with that
      # Playwright version has saved one.
      #
      # The cache holds browser files only, not the system libraries. On a hit,
      # `install-deps` puts those back, and `install chromium` then finds the
      # cached revision complete and downloads nothing (it fetches whatever is
      # missing, so a partial entry still ends with a usable browser). On a miss
      # the command is the one this step always ran. Either way the step id stays
      # `chromium`, and `steps.chromium.outcome == 'success'` still means
      # "Chromium and its system libraries are installed" to the steps that gate on it.
      - name: Resolve Playwright version
        id: playwright
        # An assignment, not `echo "version=$(...)"`: a failing command substitution inside
        # an echo argument does not fail the step, and an empty version would key every run
        # to the same wrong entry.
        run: |
          set -euo pipefail
          version=$(node -p "require('playwright/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Restore Playwright browsers
        id: playwright-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}

      # ── SYSTEM-PACKAGE CACHE: THE .debs `install-deps` DOWNLOADS ─────────
      #
      # The browser cache above leaves the system libraries to apt, and apt is
      # the slow part when the runner's Ubuntu mirror is: from 2026-11-18 ~00:00Z
      # this step went from 10-35 s per shard to 140-630 s on most runs
      # (`Fetched 32.1 MB in 7min 53s (67.8 kB/s)`, mostly fonts and mesa), and
      # with three shards one of them nearly always drew a slow download, so it
      # sat on the Lint critical path. So the .deb files are cached too, and
      # copied into apt's own archive dir before the install: apt reuses a .deb
      # it finds there with the file name and size the index lists (it does not
      # re-hash it), and downloads only what is missing or newer. The package
      # set and versions stay exactly what `install-deps` asks apt for; only
      # where the bytes come from changes. Trust boundary: the same as the
      # browser cache above, a `main`-scoped Actions cache entry.
      #
      # Keyed by ISO week (with a prefix restore-key) so the entry is
      # re-saved once a week as Ubuntu's -updates move on, instead of freezing
      # on the first save and downloading every newer package forever. Saved
      # on `main` only (the batch dispatch), like the browser cache, for the same reason.
      # `ImageOS` is the runner's machine env (ubuntu24), which the `env` expression context
      # does not see, so it is read here.
      - name: Resolve system-package cache key
        id: apt-key
        run: echo "prefix=playwright-apt-${ImageOS:?}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}-" >> "$GITHUB_OUTPUT" && echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      - name: Restore Playwright system packages
        id: apt-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/playwright-apt-debs
          key: ${{ steps.apt-key.outputs.prefix }}${{ steps.apt-key.outputs.week }}
          restore-keys: |
            ${{ steps.apt-key.outputs.prefix }}

      - name: Install Chromium for Playwright
        id: chromium
        env:
          CACHE_HIT: ${{ steps.playwright-cache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          # Keep what apt downloads, so the step below can collect it for the cache.
          echo 'Binary::apt-get::APT::Keep-Downloaded-Packages "true"; APT::Keep-Downloaded-Packages "true";' \
            | sudo tee /etc/apt/apt.conf.d/99-keep-playwright-debs >/dev/null
          cached=0
          if compgen -G "$HOME/playwright-apt-debs/*.deb" >/dev/null; then
            sudo cp "$HOME"/playwright-apt-debs/*.deb /var/cache/apt/archives/
            cached=$(find "$HOME/playwright-apt-debs" -name '*.deb' | wc -l)
          fi
          echo "system-package cache: $cached .deb file(s) restored"
          if [ "$CACHE_HIT" = true ]; then
            echo "browser cache hit: installing system dependencies only"
            pnpm exec playwright install-deps chromium
            pnpm exec playwright install chromium
          else
            pnpm exec playwright install --with-deps chromium
          fi
          # Every .deb apt now holds: the restored ones plus whatever it fetched. The cache
          # save below stores this directory; the count is the positive control that apt
          # kept its downloads (0 here would mean the cache can never fill).
          # `autoclean` first drops .debs the index no longer lists (versions -updates has
          # superseded), so the weekly re-save does not carry every old version forward.
          # Best-effort: Chromium is installed by now, and a failure collecting the cache
          # must not fail this step (`steps.chromium.outcome` gates the suites).
          if ! {
            sudo apt-get autoclean -qq &&
              mkdir -p "$HOME/playwright-apt-debs" &&
              find "$HOME/playwright-apt-debs" -name '*.deb' -delete &&
              find /var/cache/apt/archives -maxdepth 1 -name '*.deb' -exec cp -t "$HOME/playwright-apt-debs" {} +
          }; then
            echo "::warning title=Playwright system-package cache::collecting the .debs failed; the next run downloads them again"
          fi
          echo "system-package cache: $(find "$HOME/playwright-apt-debs" -name '*.deb' 2>/dev/null | wc -l) .deb file(s) after install"

      - name: Save Playwright system packages
        if: ${{ contains(fromJSON('["push", "workflow_dispatch", "schedule"]'), github.event_name) && github.ref == 'refs/heads/main' && steps.apt-cache.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: ~/playwright-apt-debs
          key: ${{ steps.apt-key.outputs.prefix }}${{ steps.apt-key.outputs.week }}

      # Right after the install, so a red suite later still leaves the entry saved.
      # `continue-on-error`: best-effort infrastructure, like the Vite cache save.
      - name: Save Playwright browsers
        if: ${{ contains(fromJSON('["push", "workflow_dispatch", "schedule"]'), github.event_name) && github.ref == 'refs/heads/main' && steps.playwright-cache.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}

      # vitest directly rather than `pnpm run test:component`: that wrapper deletes its JSON
      # report once its own gate has read it, and the `component-ledger` job needs this
      # shard's report. A `--shard` run is narrowed, so the gate here is `--narrowed` — the
      # zero check only (a shard that ran nothing fails HERE, by name). The floor and the
      # on-disk file ledger need every shard's files, so they run on the merge in
      # `component-ledger`. The gate only ever adds a failure; it never turns vitest's red
      # into green.
      #
      # 🔴 NO `--` SEPARATOR before `--shard` — see the `unit` job's `Unit tests` step:
      # vitest discards everything after a bare `--`, and the run would be the whole suite.
      - name: Component tests
        if: env.SUITE_COMPONENT == 'true'
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          rc=0
          pnpm exec vitest run --project component --shard="$SHARD/3" \
            --reporter=default --reporter=json --reporter=github-actions \
            --outputFile.json="$RUNNER_TEMP/component-report.json" || rc=$?
          node scripts/ci/assert-component-suite-ran.mjs "$RUNNER_TEMP/component-report.json" --narrowed || exit 1
          exit $rc

      # For `component-ledger`. `!cancelled()` so a RED shard still hands over its report —
      # the ledger must account for its files either way. A shard that wrote no report uploads
      # nothing (`warn`, not `error`: the shard is already red, and the ledger then names it as
      # the missing one). Kept briefly: it is read by the next job in the same run.
      - name: Upload component report
        if: ${{ !cancelled() && env.SUITE_COMPONENT == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: component-report-${{ matrix.shard }}
          path: ${{ runner.temp }}/component-report.json
          if-no-files-found: warn
          retention-days: 3

      # PER-TEST TIMINGS: see the `unit` job's `Upload test timings` step.
      - name: Upload test timings
        if: ${{ !cancelled() && env.SUITE_COMPONENT == 'true' }}
        # Telemetry: never turns a PR or a branch dispatch red. This job no longer runs on a push;
        # on `main` it runs as the bot's `only: unit` batch, and there a failed upload fails the job,
        # so a broken uploader shows rather than reading green (the rule main-branch-ci-coverage.test.ts
        # holds the push path to).
        continue-on-error: ${{ !(github.event_name == 'workflow_dispatch' && github.actor == 'github-actions[bot]' && inputs.only == 'unit' && github.ref == 'refs/heads/main') }}
        uses: actions/upload-artifact@v7
        with:
          name: test-times-component-${{ matrix.shard }}-a${{ github.run_attempt }}
          path: ${{ runner.temp }}/component-report.json
          if-no-files-found: ignore
          retention-days: 8
          # One artifact per attempt (`-a<run_attempt>`, never overwritten): a failed attempt
          # and its passing re-run on the same commit is exactly the flake the reader counts.

      # ── GEOMETRY: REPORT-ONLY ON PULL REQUESTS, REAL VERDICT ON `main` ──────────────────
      #
      # The browser-mode `geometry` project — real Chromium, the real app cascade, an explicit
      # phone viewport. See `test/geometry-setup.tsx` for what it loads and why it is a separate
      # project from `component`.
      #
      # `continue-on-error` is `${{ github.event_name == 'pull_request' }}`, and NOT a
      # literal `true`. Both halves matter:
      #
      #   PR side: blocking on a brand-new tier from day one would red unrelated PRs and the
      #   step would be switched off within a week. `main` has NO required_status_checks, so
      #   nothing here blocks a merge either way.
      #
      #   PUSH side: on a push the merge has already happened, so there is no unrelated work to
      #   red. What `continue-on-error: true` WOULD buy there is a run reporting `success` while
      #   the step underneath failed — a green that has to be disbelieved, which is worse than no
      #   run at all.
      #
      # 🔴 NOT A LITERAL `true`: `scripts/__tests__/main-branch-ci-coverage.test.ts` rejects an
      # unconditionally report-only job or step on the push path, because a conditional can
      # differ between a PR and a push while a literal cannot.
      #
      # 🔴 ON A PR A RED GEOMETRY STEP READS `success` EVERYWHERE THE API LOOKS. A step-level
      # `continue-on-error` reports `conclusion: success` for the step in the jobs endpoint and
      # leaves the job green — unlike the job-level one this tier had as its own job, which at
      # least rendered the check red-but-ignored. The `outcome` is visible only inside the run,
      # so `Report-only results` below turns it into a titled annotation. To count clean runs
      # for the flip below, read that annotation (or its absence) from the check run, never the
      # step's conclusion.
      #
      # FLIP TO BLOCKING once a couple of weeks of runs show a clean pass rate, and remove
      # `continue-on-error` from both geometry steps, the annotation step and this paragraph
      # together. What would make that safe, concretely: no run red for a reason other than a
      # real geometry regression — in particular no Chromium launch failures and no timeouts on
      # a 2-core runner. This tier has no import/transform phase to blame, unlike `unit`, so a
      # red is either the code or the browser — both worth someone's attention.
      #
      # Gated on the Chromium install rather than on `component`: it must run after a red
      # component suite, and must not run, and fail a second time, when setup never finished.
      - name: Geometry tests
        id: geometry
        if: ${{ !cancelled() && steps.chromium.outcome == 'success' && env.SUITE_GEOMETRY == 'true' && matrix.shard == 1 }}
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        run: pnpm exec vitest run --project geometry --reporter=default --reporter=json --reporter=github-actions --outputFile=geometry-report.json

      # 🔴 A GREEN VITEST RUN IS A CLAIM, NOT EVIDENCE — the same hazard the
      # `packages` job's ledger exists for, one project over. `--project` matching
      # NOTHING exits 0, and so does a config whose globs stopped resolving: this
      # tier's glob (`src/**/*.geometry.test.tsx`) is deliberately disjoint from
      # every other project's, which is exactly the kind of narrow pattern that
      # can quietly stop matching. A job that silently runs zero tests is worse
      # than no job, because it reports success.
      #
      # Both numbers are FLOORS, not equalities, so adding a geometry test never
      # breaks this. Which floor to raise when you add to the tier is stated at the floors
      # themselves, below.
      #
      # 🔴 THE FILE COUNT COMES FROM `testResults.length`, NOT FROM
      # `numTotalTestSuites`. Measured against a real report when the tier was 2
      # files, `numTotalTestSuites` read 4, because that field counts `describe`s
      # rather than files. A floor written against it would have been off by a
      # factor that changes whenever someone adds a `describe`.
      #
      # `if: always()` so this runs when the tests FAIL too — an aborted runner
      # writes no report at all, which is precisely the case this must catch, and
      # it is indistinguishable from a healthy run if you only read the step's
      # own status. Report-only on PRs exactly like the tests above, since it is half
      # of their verdict. Gated on the Chromium install like the tests: when setup
      # failed, that step is already the red, and a missing report here would only
      # restate it.
      #
      # All three arms were exercised before this was committed: a real report
      # exits 0; a report with `testResults: []` / `numTotalTests: 0` exits 1; a
      # missing report exits 1 with its own message.
      - name: Assert the geometry tier actually collected something
        id: geometry-ledger
        if: always() && steps.chromium.outcome == 'success' && env.SUITE_GEOMETRY == 'true' && matrix.shard == 1
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        run: |
          node - <<'JS'
          // Minimum ledger for the `geometry` tier. Both numbers are FLOORS (see the `<`
          // comparison below). ⚠️ NO CURRENT-COUNT FIGURE IS QUOTED HERE: three consecutive
          // commits restated one and each went stale in the commit that changed the tier,
          // including one that added a test and left the number it had just invalidated.
          // Derive it — `--reporter=json`, `testResults.length` and `numTotalTests`. What is
          // durable: MIN_TESTS carries real headroom by design, MIN_FILES is MEANT to sit at
          // exactly the collected count, so adding a file does not red but losing one does.
          //
          // 🔴 "MEANT TO" IS DOING REAL WORK IN THAT SENTENCE — THE FILE FLOOR HAS NOW DRIFTED
          // TWICE AND IS THE ONE THING IN THIS BLOCK NOBODY MAINTAINS. It sat at 6 against 7
          // on one base branch, and at 8 against 11 collected on the next, so by then THREE
          // files could have stopped being collected with no red; the test floor sat at 10
          // against 101, so ninety could have. An earlier draft claimed FILES "ratchets at
          // exactly current" — that contract is NOT implemented, and a floor that has gone
          // stale on every second change is evidence the instruction below is not enough. If
          // you want a drop of one to be caught reliably, the honest fix is an equality
          // against a count derived from the glob, not a hand-maintained floor. Until someone
          // writes that: raise MIN_FILES when you add a file — it has no headroom, which is
          // the whole point of it — and leave MIN_TESTS alone, which is what "a fraction of
          // current" below means. (An earlier pairing of these comments told you to raise
          // both, which contradicted that.)
          const MIN_FILES = 14;
          // It was 10 — which had ZERO headroom when it was written (the tier was 10 tests
          // then, the same configuration this comment praises the FILE floor for), and became
          // unfailable as the tier grew past it. The GATE was not that weak — it is
          // `files < MIN_FILES || tests < MIN_TESTS`, so the FILE term still caught a dropped
          // file — the hole was in this clause. Deliberately a
          // fraction of current rather than a ratchet, so merging cases in a refactor does
          // not force a floor bump — but a floor that cannot fail is not conservative.
          const MIN_TESTS = 80;
          const REPORT = 'geometry-report.json';

          const fs = require('fs');
          if (!fs.existsSync(REPORT)) {
            console.error(
              `geometry ledger: ${REPORT} was never written. The runner did not finish — a ` +
                'browser that failed to launch, or a config error. That is NOT "the suite is ' +
                'fine"; fail loudly.'
            );
            process.exit(1);
          }
          const r = JSON.parse(fs.readFileSync(REPORT, 'utf8'));
          const files = Array.isArray(r.testResults) ? r.testResults.length : 0;
          const tests = Number(r.numTotalTests ?? 0);
          console.error(`geometry ledger: ${files} file(s), ${tests} test(s) collected`);
          if (files < MIN_FILES || tests < MIN_TESTS) {
            console.error(
              `geometry ledger FAILED: expected at least ${MIN_FILES} file(s) and ${MIN_TESTS} ` +
                `test(s), got ${files} and ${tests}. A vitest run whose --project matches ` +
                'nothing exits 0, so a green verdict here would otherwise be a claim about the ' +
                'selector, not about the code.'
            );
            process.exit(1);
          }
          JS

      # For `component-verify`, which reads which files failed: geometry is half of the batch's
      # `Component tests (main batch)` verdict. Its own name, so `component-ledger`'s
      # `component-report-*` download never counts it. Kept briefly.
      - name: Upload geometry report
        if: ${{ !cancelled() && steps.geometry.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: geometry-report
          path: geometry-report.json
          if-no-files-found: warn
          retention-days: 3
          overwrite: true

      # PER-TEST TIMINGS: see the `unit` job's `Upload test timings` step.
      - name: Upload test timings
        if: ${{ !cancelled() && steps.geometry.outcome != 'skipped' }}
        # Telemetry: never turns a PR or a branch dispatch red. This job no longer runs on a push;
        # on `main` it runs as the bot's `only: unit` batch, and there a failed upload fails the job,
        # so a broken uploader shows rather than reading green (the rule main-branch-ci-coverage.test.ts
        # holds the push path to).
        continue-on-error: ${{ !(github.event_name == 'workflow_dispatch' && github.actor == 'github-actions[bot]' && inputs.only == 'unit' && github.ref == 'refs/heads/main') }}
        uses: actions/upload-artifact@v7
        with:
          name: test-times-geometry-a${{ github.run_attempt }}
          path: geometry-report.json
          if-no-files-found: ignore
          retention-days: 8
          # One artifact per attempt (`-a<run_attempt>`, never overwritten): a failed attempt
          # and its passing re-run on the same commit is exactly the flake the reader counts.

      # The only place a report-only red stays visible on a PR: see the geometry paragraph above.
      # Reads each report-only step's `outcome` (what it did) rather than its `conclusion` (what
      # `continue-on-error` turned it into) and writes a titled annotation plus a summary line.
      # It never fails the job.
      - name: Report-only results
        if: ${{ !cancelled() && github.event_name == 'pull_request' && matrix.shard == 1 }}
        env:
          GEOMETRY: ${{ steps.geometry.outcome }}
          GEOMETRY_LEDGER: ${{ steps.geometry-ledger.outcome }}
        run: |
          for pair in "Geometry tests=$GEOMETRY" "Geometry ledger=$GEOMETRY_LEDGER"; do
            name=${pair%%=*}; outcome=${pair#*=}
            echo "$name: ${outcome:-not run}" >> "$GITHUB_STEP_SUMMARY"
            if [ "$outcome" = failure ]; then
              echo "::error title=$name failed (report-only on pull requests)::$name failed. It does not fail this job on a PR, and its step reads success in the API. Open the step log for the cause."
            fi
          done

  # ── THE WHOLE-SUITE VERDICT FOR THE SHARDED `component` JOB ─────────────────────────────
  #
  # Named `Component + geometry tests`, the unsharded job's check name, so anything that reads
  # that check by name keeps working. Red when any shard job did not succeed (geometry stays
  # report-only on PRs via its own `continue-on-error`) or when the merged reports fail the
  # full ledger. On an `only: geometry` dispatch this job is skipped — there are no component
  # reports to grade — so geometry's verdict is only on the `(1/3)` shard job. The same holds on
  # a full-ci dispatch whose PR run passed the component suite (`passed`).
  component-ledger:
    name: Component + geometry tests
    needs: [passed, component]
    runs-on: ubuntu-latest
    if: ${{ !cancelled() && (!inputs.only || inputs.only == 'all' || inputs.only == 'component' || (inputs.only == 'unit' && github.actor == 'github-actions[bot]')) && github.event_name != 'push' && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')) && needs.passed.outputs.component != 'true' }}
    timeout-minutes: 10
    steps:
      # The ledger walks `src/` for `*.browser.test.tsx` and imports scripts/ci only, so no
      # submodules and no install.
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Download component reports
        uses: actions/download-artifact@v7
        with:
          pattern: component-report-*
          path: ${{ runner.temp }}/component-reports

      # Both checks always run, so a missing shard and a missing file are both named; the
      # step fails if either did. The ledger reads the merged report written even on failure.
      - name: Assert every component test file ran
        run: |
          rc=0
          node scripts/ci/merge-component-shard-reports.mjs "$RUNNER_TEMP/component-reports" 3 "$RUNNER_TEMP/component-merged.json" || rc=1
          node scripts/ci/assert-component-suite-ran.mjs "$RUNNER_TEMP/component-merged.json" || rc=1
          exit $rc

      - name: Every shard succeeded
        if: ${{ !cancelled() }}
        env:
          SHARDS: ${{ needs.component.result }}
        run: |
          if [ "$SHARDS" != success ]; then
            echo "::error title=Component shard did not succeed::the component shard jobs concluded '$SHARDS'. Open the red 'Component + geometry tests (n/3)' job for the cause."
            exit 1
          fi

  # ── THE BATCHED COMPONENT + GEOMETRY VERDICT, AS A COMMIT STATUS ────────────────────────────
  #
  # `unit-verify`'s rules for the browser suites (scripts/ci/unit-batched.mjs `verify ... component`),
  # only on the batch dispatch on `main`: lint.yml `only: unit` as github-actions[bot], the same run
  # as `unit-verify`. A full-ci dispatch is also the bot, on a PR branch, so the ref is checked.
  # Green: a success `Component tests (main batch)` status on HEAD. Red: the failed component and
  # geometry files are re-run at HEAD (a pass = flaky: success naming them), else
  # `git bisect run --first-parent` from the last commit whose `Component tests (main batch)`
  # status this job posted green, and a failure status on the first bad commit (and on HEAD), or
  # on HEAD alone when the bisect cannot isolate one. 4 reports: the three component shards and
  # geometry. A crash posts `error` on HEAD. Status contract: the lint.yml header.
  component-verify:
    name: Component verified (main batch)
    needs: [component, component-ledger]
    # Chromium's system libraries: the same image as the `component` job.
    runs-on: ubuntu-24.04
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && github.actor == 'github-actions[bot]' && inputs.only == 'unit' && github.ref == 'refs/heads/main' }}
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
      statuses: write
    env:
      # Red when a shard is red, or when every shard passed and the ledger is not green (a file
      # missing from the merged reports is a red no single report shows).
      SUITE_RESULT: ${{ needs.component.result != 'success' && needs.component.result || needs.component-ledger.result }}
    steps:
      - id: checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: ${{ env.SUITE_RESULT == 'failure' && '0' || '1' }}
          submodules: ${{ env.SUITE_RESULT == 'failure' }}

      - id: pnpm
        uses: pnpm/action-setup@v6
        if: env.SUITE_RESULT == 'failure'

      - id: node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Install
        id: install
        if: env.SUITE_RESULT == 'failure'
        run: pnpm install --frozen-lockfile

      # System libraries once; the bisect step fetches the Chromium revision each commit wants.
      - name: Install Chromium for Playwright
        id: chromium
        if: env.SUITE_RESULT == 'failure'
        run: pnpm exec playwright install --with-deps chromium

      - name: Download component reports
        id: download
        if: env.SUITE_RESULT == 'failure'
        uses: actions/download-artifact@v7
        with:
          pattern: component-report-*
          path: ${{ runner.temp }}/reports

      - name: Download geometry report
        id: download-geometry
        if: env.SUITE_RESULT == 'failure'
        uses: actions/download-artifact@v7
        with:
          name: geometry-report
          path: ${{ runner.temp }}/reports/geometry-report

      - name: Post the verdict (bisect on red)
        id: verdict
        timeout-minutes: 50
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/unit-batched.mjs verify "$SUITE_RESULT" "$RUNNER_TEMP/reports" 4 component

      - name: Post error on HEAD if this job crashed
        if: failure() || cancelled()
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOMES: >-
            checkout=${{ steps.checkout.outcome }}
            setup-pnpm=${{ steps.pnpm.outcome }}
            setup-node=${{ steps.node.outcome }}
            install=${{ steps.install.outcome }}
            chromium=${{ steps.chromium.outcome }}
            download-reports=${{ steps.download.outcome }}
            download-geometry=${{ steps.download-geometry.outcome }}
            post-verdict=${{ steps.verdict.outcome }}
        run: |
          step=unknown
          for pair in $OUTCOMES; do
            if [ "${pair#*=}" = failure ]; then step=${pair%%=*}; break; fi
          done
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state=error -f "context=Component tests (main batch)" \
            -f "description=Batch verification crashed at step: $step. The next batch run re-verifies." \
            -f "target_url=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          echo "::error title=Component batch verification crashed::step $step failed; posted error on ${GITHUB_SHA:0:10}"

  # ── THE BATCHED UNIT VERDICT, AS A COMMIT STATUS ─────────────────────────────────────────────
  #
  # Only on the batch dispatch (unit-batched.yml dispatches this workflow as github-actions[bot]
  # with `only: unit`); a person's `only: unit` dispatch and full-ci.yml's `only: all` dispatch
  # never reach it. Green: a success `Unit tests (main batch)` status on HEAD. Red: re-runs the
  # failed files at HEAD (a pass there = flaky: a success on HEAD whose description names the
  # flaky files, never a bare one, plus a warning annotation), then `git bisect run
  # --first-parent` from the last green batch-verified commit, and posts a FAILING status on the
  # first bad commit naming the failed files, or on HEAD when the bisect cannot isolate one
  # (scripts/ci/unit-batched.mjs). That keeps a unit red rendering on the commit that caused it.
  # The gate's record is the commit status itself: it skips a run only when HEAD already carries
  # a POSTED `success` or `failure` in this context. A bisected red therefore also posts on HEAD.
  # If any step here fails, the last step posts `error` on HEAD naming it, so a crashed
  # verification is visible and the next batch run re-verifies.
  unit-verify:
    name: Unit verified (main batch)
    needs: unit
    runs-on: ubuntu-latest
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && github.actor == 'github-actions[bot]' && inputs.only == 'unit' }}
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
      statuses: write
    services: *unit-services
    env: *unit-env
    steps:
      - id: checkout
        uses: actions/checkout@v7
        with:
          # Strings, not numbers: `cond && 0 || 1` is always 1, because 0 is falsy.
          fetch-depth: ${{ needs.unit.result == 'failure' && '0' || '1' }}
          submodules: ${{ needs.unit.result == 'failure' }}

      - id: pnpm
        uses: pnpm/action-setup@v6
        if: needs.unit.result == 'failure'

      - id: node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Install
        id: install
        if: needs.unit.result == 'failure'
        run: pnpm install --frozen-lockfile

      - name: Download unit reports
        id: download
        if: needs.unit.result == 'failure'
        uses: actions/download-artifact@v7
        with:
          pattern: unit-report-*
          path: ${{ runner.temp }}/reports

      - name: Post the verdict (bisect on red)
        id: verdict
        # Under the job's 45: a step timeout FAILS the step, so the crash step below still runs.
        timeout-minutes: 38
        env:
          GH_TOKEN: ${{ github.token }}
          UNIT_RESULT: ${{ needs.unit.result }}
        # 6: the `unit` matrix on an `only: unit` dispatch. Fewer reports than this means a shard
        # never finished, so the red is not treated as a flake or bisected.
        run: node scripts/ci/unit-batched.mjs verify "$UNIT_RESULT" "$RUNNER_TEMP/reports" 6

      # A crashed verification must not look like no news: `error` on HEAD, naming the step, so
      # the gate (which counts only a posted success or failure) re-verifies HEAD next time.
      - name: Post error on HEAD if this job crashed
        # cancelled() too: a job-level timeout cancels the job, and failure() is then false.
        if: failure() || cancelled()
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOMES: >-
            checkout=${{ steps.checkout.outcome }}
            setup-pnpm=${{ steps.pnpm.outcome }}
            setup-node=${{ steps.node.outcome }}
            install=${{ steps.install.outcome }}
            download-reports=${{ steps.download.outcome }}
            post-verdict=${{ steps.verdict.outcome }}
        run: |
          step=unknown
          for pair in $OUTCOMES; do
            if [ "${pair#*=}" = failure ]; then step=${pair%%=*}; break; fi
          done
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state=error -f "context=Unit tests (main batch)" \
            -f "description=Batch verification crashed at step: $step. The next batch run re-verifies." \
            -f "target_url=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          echo "::error title=Unit batch verification crashed::step $step failed; posted error on ${GITHUB_SHA:0:10}"

  # ── THE `full-ci` LABEL COMES OFF ONCE THE FULL UNIT SUITE HAS PASSED ───────────────────────
  #
  # The label stays on a PR until one Lint run has passed all six unit shards for it (on some
  # commit of the PR, not necessarily its head); this job then removes it, so later pushes run
  # without the shards (re-add it to ask again). Which runs:
  #   - a pull_request run whose payload carries the label, from a branch in this repo (a fork's
  #     token cannot edit labels);
  #   - a dispatch with the `pr` input, which only full-ci.yml passes. The batch verification
  #     on `main` (`only: unit`, no `pr`) and a hand dispatch without `pr` remove nothing.
  # And only after a FULL unit run: every shard (no `only: unit-<n>`) and `success` (a matrix
  # job is `success` only when every shard is). A cancelled, failed or skipped unit run keeps
  # the label, so the next push runs the shards again: PR runs share a cancel-in-progress
  # group, and removing the label before the shards finished could leave no full run at all.
  # A failed removal warns and never fails the job; a 404 means the label is already gone.
  full-ci-done:
    name: Remove the full-ci label (unit suite passed)
    needs: unit
    runs-on: ubuntu-latest
    if: ${{ needs.unit.result == 'success' && (github.event_name == 'pull_request' || inputs.only == 'all' || inputs.only == 'unit') && ((github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'full-ci') && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'workflow_dispatch' && inputs.pr != '')) }}
    permissions:
      pull-requests: write
    timeout-minutes: 5
    steps:
      # Values reach the shell through env, never pasted into the script. On a dispatch `pr` is
      # free text, so it must be a number and name an open PR whose head is this branch in this
      # repo, or nothing is removed.
      - name: Remove the full-ci label
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number || inputs.pr }}
          REPO: ${{ github.repository }}
        run: |
          say() { echo "$1" >> "$GITHUB_STEP_SUMMARY"; }
          if [ "$EVENT" = workflow_dispatch ]; then
            if ! [[ "$PR" =~ ^[0-9]+$ ]]; then
              echo "::warning title=full-ci label not removed::the pr input is not a PR number (see the job summary)"
              say "**full-ci label not removed**: the \`pr\` input (\`${PR//[$'\r\n']/ }\`) is not a PR number."
              exit 0
            fi
            head=$(gh api "repos/$REPO/pulls/$PR" --jq '[.state, .head.repo.full_name, .head.ref] | join(" ")' || true)
            if [ "$head" != "open $REPO $GITHUB_REF_NAME" ]; then
              echo "::warning title=full-ci label not removed::the pr input does not name an open PR from this branch (see the job summary)"
              say "**full-ci label not removed**: PR #$PR is not an open PR whose head is \`$GITHUB_REF_NAME\` (got: ${head//[$'\r\n']/ })."
              exit 0
            fi
          fi
          if out=$(gh api -X DELETE "repos/$REPO/issues/$PR/labels/full-ci" 2>&1); then
            say "The full unit suite passed: removed the \`full-ci\` label from #$PR. Later pushes run the normal PR suites."
          elif grep -q 'HTTP 404' <<< "$out"; then
            say "The full unit suite passed; the \`full-ci\` label was already off #$PR."
          else
            echo "::warning title=full-ci label not removed::removing the label failed (see the job summary)"
            say "**Could not remove the \`full-ci\` label** from #$PR (${out//[$'\r\n']/ }); remove it by hand, or later pushes keep running the unit shards."
          fi
          say "To run the full suite again, re-add it: \`gh pr edit $PR --add-label full-ci\`"

  # ── THE MAIN BATCH'S OTHER SUITES, AS ONE COMMIT STATUS ──────────────────────────────────────
  #
  # Only on the batch dispatch on `main` (unit-batched.yml dispatches this workflow as
  # github-actions[bot] with `only: unit`); a person's dispatch, full-ci.yml's `only: all` dispatch
  # and any other branch never reach it. It needs nothing from `unit`, so it runs beside it.
  #
  # The suites that do not run on pull requests or pushes any more (Go fuzz / govulncheck /
  # go.mod tidy / benchmarks, moderator boot, ports manifest, both image builds, Windows dev-env;
  # the list is BATCH_WORKFLOWS in scripts/ci/unit-batched.mjs): it dispatches each one whose
  # paths changed since the last green batch on `main` with `batch: true`, waits for their runs at
  # this commit, and posts `Batch suites (main batch)` on it (scripts/ci/batch-suites.mjs):
  # success, failure naming the red suites, or error when a run was not found or did not finish.
  # A red opens a CI-watch item naming the commit range; nothing bisects it automatically.
  # A BATCH_WORKFLOWS entry with an `ownContext` (apps.yml) is dispatched and waited for, but left out
  # of that verdict: it posts its own status, which this job then re-posts with this run as its
  # target_url (the status contract in the header).
  # If a step here fails, the last step posts `error` naming it, so a crash is not read as green.
  batch-suites:
    name: Batch suites verified (main batch)
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' && github.actor == 'github-actions[bot]' && inputs.only == 'unit' && github.ref == 'refs/heads/main' }}
    # The slowest suite (Windows) takes minutes; the rest is queueing behind other jobs.
    timeout-minutes: 90
    permissions:
      # Dispatching a workflow needs actions: write; reading the runs, actions: read.
      actions: write
      contents: read
      statuses: write
    steps:
      # The script, its imports, and the workflow files whose paths it reads. No credentials kept.
      - id: checkout
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            scripts/ci/batch-suites.mjs
            scripts/ci/full-ci-paths.mjs
            scripts/ci/unit-batched.mjs
            .github/workflows/
            .nvmrc
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - id: node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Dispatch the batch suites, wait, post the verdict
        id: verdict
        # Under the job's 90: a step timeout FAILS the step, so the crash step below still runs.
        timeout-minutes: 85
        env:
          GH_TOKEN: ${{ github.token }}
          BATCH_WAIT_MINUTES: '75'
        run: node scripts/ci/batch-suites.mjs run

      - name: Post error on HEAD if this job crashed
        # cancelled() too: a job-level timeout cancels the job, and failure() is then false.
        if: failure() || cancelled()
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOMES: >-
            checkout=${{ steps.checkout.outcome }}
            setup-node=${{ steps.node.outcome }}
            post-verdict=${{ steps.verdict.outcome }}
        run: |
          step=unknown
          for pair in $OUTCOMES; do
            if [ "${pair#*=}" = failure ]; then step=${pair%%=*}; break; fi
          done
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state=error -f "context=Batch suites (main batch)" \
            -f "description=Batch suites verification crashed at step: $step. No verdict at this commit." \
            -f "target_url=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          echo "::error title=Batch suites verification crashed::step $step failed; posted error on ${GITHUB_SHA:0:10}"
