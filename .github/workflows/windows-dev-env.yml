name: Windows dev-env smoke

# Canary for the DEFAULT (non-Nix) contributor setup on native Windows. Runs on a
# push to `main` that touches the install path, and on dispatch; not on PRs.
#
# WHY: every other job in this repo runs on ubuntu-latest, so nothing validates
# Windows — while Windows support is real and actively maintained:
# `.claude/skills/dev-server/scripts/defender-exclusions.ps1`, `win32` branches in
# `scripts/test-unit-run.mjs`, `scripts/test-perf/bench.mjs`,
# `.claude/skills/dev-server/console.mjs` and `.../scripts/worktree.mjs`, plus
# `it.skipIf(process.platform === 'win32')` guards in `scripts/__tests__/`.
# A supported platform verified by nothing is how a contributor's first hour gets
# spent on a break nobody else can reproduce.
#
# THE SPECIFIC EXPOSURE this is aimed at: `pnpm install` runs two lifecycle hooks —
# `preinstall` (`npx only-allow pnpm`) and `postinstall` (`pnpm run db:generate`,
# i.e. `node scripts/generate-slim-schema.js && prisma generate --no-hints`). The
# Makefile carried `# TODO fix postinstall on git bash` against exactly that path.
# That target was ALSO dead for everyone — `npm i` exits 1 under `only-allow` — so
# the hook path went a long time without being exercised on Windows by anybody.
# Un-breaking the target means the next Windows contributor is the first to walk
# it in a long while. This job walks it first.
#
# BOTH SHELLS ON PURPOSE: `pwsh` is the Windows default, `bash` is Git Bash — and
# the TODO above was Git-Bash-specific. A pwsh-only job would not reproduce it, and
# would report green over the one case we have written evidence about.
#
# ── NOT RUN ON PULL REQUESTS: PUSH TO `main` AND DISPATCH ONLY ───────────────
#
# It used to run on every PR that touched the install path, report-only
# (`continue-on-error` on `pull_request`), so a PR run never blocked anything.
# It still cost real capacity: each run holds two Windows job slots against the
# org's concurrent-job limit, which queues everyone else's jobs. Measured over
# the 24h to 2026-10-30: 145 PR runs, ~930 Windows job-minutes. A push to `main` that touches the install path
# still gets a real verdict (no `continue-on-error`: a red step turns the run
# red on the commit that caused it).
#
# WANT A VERDICT ON A BRANCH BEFORE MERGING? Dispatch it:
#   gh workflow run windows-dev-env.yml -R civitai/civitai --ref <branch>
#
# DELIBERATELY NOT starting the compose stack: those are Linux containers, and
# Docker on Windows runners is slow and flaky — it would buy noise, not signal.
# This covers everything up to `pnpm dev`; the services half is Linux-identical
# and already exercised by the ubuntu jobs.
#
# COST: `windows-latest` is a standard GitHub-hosted runner, which is free for
# public repositories. This adds no Actions minutes.
#
# ── THE pnpm STORE CACHE: ONE ENTRY, ON `main` ───────────────────────────────
#
# `setup-node` with `cache: pnpm` writes an Actions cache entry keyed
# `node-cache-Windows-x64-pnpm-<lockfile-hash>`. Actions caches are SCOPED TO A
# REF: a run can READ an entry saved on the default branch, and it saves into
# its own ref's scope.
#
# When this workflow was `pull_request`-only there was no entry on
# `refs/heads/main` to restore from, so EVERY PR missed and saved its own
# ~518 MB copy in its own scope. Measured 2026-08-25: 20 such copies, 9.65 GB —
# 95.3% of the repo's 10 GB cache budget — so LRU eviction was dropping the
# useful entries. The push leg fixed that by giving `main` the one entry. With
# no PR runs left, the push runs keep that entry fresh and a dispatch on a
# branch restores from it.
#
# The two matrix shells share one cache key (same OS, arch and lockfile), so on
# `main` they race to save it and one logs "another job may be creating this
# cache". That is the intended outcome — one entry is the point — not a defect.
#
# Nothing in this workflow reads `github.base_ref` or `github.event.pull_request`
# (both are empty/null on a push), so no step needs gating.
# `scripts/__tests__/main-branch-ci-coverage.test.ts` asserts that as a repo-wide
# relationship over every push-reachable job.

# ── PATH FILTER: ONLY CHANGES TO WHAT THE STEPS BELOW EXECUTE ───────────────
#
# Free runner minutes are not free concurrency: each run holds two Windows job
# slots against the plan's concurrent-job limit for its whole length. So this
# runs only when a file it actually executes or reads changes. The list was
# derived from the steps, not guessed:
#
#   checkout (submodules: true)  .gitmodules, the event-engine-common gitlink
#   pnpm/action-setup, setup-node  package.json (packageManager), .nvmrc
#   pnpm install --frozen-lockfile  package.json, pnpm-lock.yaml,
#       pnpm-workspace.yaml, .npmrc, patches/** (patchedDependencies), every
#       workspace package.json. It also runs lifecycle scripts:
#     root preinstall   `npx only-allow pnpm`
#     root prepare      `husky` (.husky/**)
#     root postinstall  `pnpm run db:generate` = scripts/generate-slim-schema.js
#         over packages/civitai-db-schema/prisma/schema.full.prisma, then
#         `prisma generate`, whose generators include
#         scripts/prisma-enum-generator.mjs and write into
#         packages/civitai-db-schema/src
#     apps/* prepare    `svelte-kit sync` in the SvelteKit apps, which reads
#         each app's config and route tree, hence all of apps/**
#   db:generate standalone  the same postinstall chain again
#
# Not listed on purpose: src/** and the Windows-branching dev scripts named in
# the header (test-unit-run.mjs, dev-server skill scripts). No step here runs
# them, so a change to them alone would only re-run an unchanged install.
# If you add a step, add what it reads here. The list also keeps the cache
# entry above fresh, because the cache key is the lockfile hash and the
# lockfile is in the list.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows-dev-env.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.npmrc'
      - '.nvmrc'
      - 'patches/**'
      - '.husky/**'
      - '.gitmodules'
      - 'event-engine-common'
      - 'scripts/generate-slim-schema.js'
      - 'scripts/prisma-enum-generator.mjs'
      - 'packages/*/package.json'
      - 'packages/civitai-db-schema/**'
      - 'apps/**'
  # With the path filter above, most `main` pushes skip this workflow, so a
  # release can't count on a push run for its pin. Dispatch it on the pin's
  # branch instead; the run groups by that branch's ref, apart from `main`.
  workflow_dispatch:

permissions:
  contents: read

# One group per ref: a newer commit on `main` cancels the run for an older one,
# and a new dispatch on a branch cancels that branch's in-flight dispatch. The
# newest `main` run checks a tree containing every older commit,
# so `main` still gets a verdict; intermediate commits show as `cancelled`.
# Until 2026-10 a push grouped by `github.sha` so every `main` commit kept its
# own run, which queued behind PR runs under the plan's concurrent-job limit.
# Same expression and reasoning as `lint.yml`.
concurrency:
  group: windows-dev-env-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Windows dev-env (${{ matrix.shell }})
    runs-on: windows-latest
    # No `continue-on-error`. It used to be `${{ github.event_name == 'pull_request' }}`
    # (report-only on PRs); with no PR trigger that is always false. A literal `true`
    # would make a push run read `success` while a step underneath failed, a green
    # that has to be disbelieved, and main-branch-ci-coverage.test.ts rejects it.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shell: [pwsh, bash]
    defaults:
      run:
        shell: ${{ matrix.shell }}

    steps:
      # `submodules: true` is CI's equivalent of the documented
      # `git submodule update --init event-engine-common`. Without it the install
      # fails in a way that looks like a code defect rather than a missing checkout
      # step — the exact confusion that cost a session earlier.
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Report rather than assume. `engines.node` is ADVISORY — pnpm prints
      # `WARN Unsupported engine` and exits 0 on a wrong major — so a mismatch here
      # would otherwise surface later as unrelated-looking failures.
      - name: Toolchain actually in use
        run: |
          node --version
          pnpm --version

      # THE STEP UNDER TEST. Both lifecycle hooks run here.
      - name: pnpm install (runs preinstall + postinstall)
        run: pnpm install --frozen-lockfile

      # POSITIVE CONTROL — the half that makes the green mean something.
      #
      # `pnpm install` exiting 0 is NOT proof the postinstall hook did its job: a
      # hook that silently no-ops also exits 0, and the missing client then surfaces
      # much later as a confusing runtime error. So assert the artifact.
      #
      # This particular artifact is a genuine control because
      # `packages/civitai-db-schema/prisma/schema.prisma` is GITIGNORED — it cannot
      # arrive from the checkout, so its presence proves the hook executed here.
      #
      # Runs under `node` rather than the matrix shell on purpose: this checks an
      # artifact, not shell behaviour, and it keeps the assertion free of pwsh-vs-bash
      # quoting differences.
      - name: Assert postinstall actually generated the slim schema
        shell: node {0}
        run: |
          const fs = require('fs');
          const f = 'packages/civitai-db-schema/prisma/schema.prisma';
          if (!fs.existsSync(f)) {
            console.log(`::error title=postinstall did not run::${f} is absent after \`pnpm install\`. It is gitignored, so it can only come from the postinstall hook (\`pnpm run db:generate\`). The install reported success, so the hook failed silently or was skipped.`);
            process.exit(1);
          }
          const lines = fs.readFileSync(f, 'utf8').split('\n').length;
          console.log(`${f}: ${lines} lines`);
          // A truncated or empty generate also exits 0. 50 is far below any real
          // schema and far above an accidental stub, so it separates the two
          // without pinning a number that ordinary schema churn would trip.
          if (lines < 50) {
            console.log(`::error title=slim schema looks truncated::${f} exists but has only ${lines} lines.`);
            process.exit(1);
          }

      # Standalone re-run: the hook working once inside `pnpm install` does not mean
      # a contributor can run it by hand, which the docs tell them to do.
      - name: db:generate standalone
        run: pnpm run db:generate
