name: Full CI on label

# Adding the `full-ci` label to a PR starts the full test suite on it, right away.
#
# lint.yml and apps.yml read the label themselves on every PR run (opened, synchronize,
# reopened, ready_for_review): with it on, the four `Unit tests` shards run and the draft
# ESLint-only gate is lifted, so every push after the label is added runs the full suite in the
# PR run. What they cannot do without help is react to the label being ADDED, which is a
# `labeled` event. This file does that, by dispatching them on the PR branch, along with
# moderator-boot.yml, which has the same draft gate.
#
# ── WHY A DISPATCHER, AND NOT `labeled` IN lint.yml / apps.yml ────────────────────────────────
#
# That was the first design, and it was measured live before being dropped. `labeled` fires for
# EVERY label, and GitHub has no trigger filter on the label name, so any other label starts a
# run whose jobs all skip. Those skipped jobs still create check-runs, with the SAME NAMES as the
# real ones, on the PR's head commit. `gh pr checks` keeps the newest check-run per name, so
# after someone added an unrelated label it showed `ESLint + Prettier (changed files)`,
# `Package unit tests`, `Component + geometry tests` and `App unit tests + typecheck` as
# `skipping` over a real run whose jobs had all passed, and exited 0. A real failure would have
# been covered the same way. (Giving the skipped jobs another name through an expression does not
# work: GitHub does not evaluate `name:` for a skipped job and shows the raw expression text.)
#
# Here, any other label starts only this workflow, whose one job skips under a name nothing else
# uses (`Start full CI on label`), so it overlays nothing.
#
# ── WHAT THE DISPATCHED RUNS TEST ─────────────────────────────────────────────────────────────
#
# A dispatch runs on the BRANCH HEAD, not on the PR's merge commit with its base, so this first
# full run tests the branch as pushed.
#
# 🔴 ITS RESULTS ARE NOT IN THE PR'S CHECKS LIST. Measured: the dispatched runs' check-runs sit on
# the head commit (the commit's check-runs API, the Actions tab), but `gh pr checks` and the PR's
# status rollup list only pull_request-event runs, so they still show the draft run's skipped
# `Unit tests` there. This job's summary links the two runs; open `Start full CI on label` to
# reach them. Every LATER push runs the full suite in the PR run, which the checks list does show. Later PR runs (on push) test the merge commit as usual.
# The dispatched Lint run is `only: all`: every suite but ESLint, which is PR-only and already
# ran on the PR. Its concurrency group is the dispatch one, so it does not cancel the PR's own
# run in flight. The dispatched apps.yml run is not path-filtered (`paths:` applies to
# pull_request events only), so it runs the app suites even on a PR that cannot affect them. The
# same goes for the dispatched moderator-boot.yml run.
#
# Not for fork PRs: their branch is not in this repo, so there is nothing here to dispatch on,
# and their token cannot dispatch anyway. The `if` skips them.
#
# ── NO DISPATCH WHEN THE PR'S OWN RUN ALREADY HAS THE SHARDS ─────────────────────────────────
#
# A PR opened WITH the label (`gh pr create --label full-ci`) gets `opened` and `labeled` at
# once. The `opened` Lint run already reads the label and starts the four `Unit tests` shards,
# so dispatching here too ran the whole suite twice on the same commit. Measured over one day
# (2026-11-12): 102 of the 122 dispatches this job made (84%) were on a head commit whose
# pull_request Lint run had started the shards, a median 28 s earlier: ~9,100 job-minutes
# (~150 job-hours) of duplicate suites in a day, on a plan whose concurrent-job limit is
# saturated.
#
# So before dispatching, this job looks for a pull_request Lint run on the PR's head commit with
# a `Unit tests (<n>)` job that was not cancelled. The `(<n>)` suffix is the test: GitHub expands
# the matrix only for a job whose `if` passed, and a skipped `unit` job is listed as plain
# `Unit tests` (checked over 700+ jobs: every skipped one has no suffix, every run one has one).
# If it finds one, the PR run is the full run, in the checks list, and nothing is dispatched;
# the summary links it. Otherwise (label added to an existing PR, the PR run not created yet
# after ~90 s, a docs-only PR the Lint `paths:` filter skips) it dispatches as before.
# On a skip, apps.yml and moderator-boot.yml are not dispatched either: their PR runs follow
# their `paths:` filters, exactly as on every later push with the label on.

on:
  pull_request:
    branches: [main, release]
    types: [labeled]

permissions:
  contents: read

jobs:
  dispatch:
    name: Start full CI on label
    runs-on: ubuntu-latest
    if: github.event.label.name == 'full-ci' && github.event.pull_request.head.repo.full_name == github.repository
    # `actions: write` is what workflow_dispatch needs. A dispatch is the one event a
    # GITHUB_TOKEN may start another workflow with.
    permissions:
      actions: write
      contents: read
    timeout-minutes: 5
    steps:
      # The branch name reaches the shell through env, never interpolated into the script: a
      # branch name is attacker-chosen text, and `${{ }}` in `run:` is pasted in before the
      # shell parses it.
      - name: Dispatch Lint (only=all), App suites and Moderator boot smoke on the PR branch
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Does a pull_request Lint run on this head commit already run the unit shards? See the
          # header. Polled because the `opened` run can be created a few seconds after this job
          # starts; an API error counts as "not found", which falls back to dispatching.
          covered=""
          for attempt in 1 2 3 4 5 6 7; do
            for id in $(gh api "repos/$REPO/actions/workflows/lint.yml/runs?event=pull_request&head_sha=$HEAD_SHA&per_page=20" \
                --jq '.workflow_runs[].id' || true); do
              n=$(gh api "repos/$REPO/actions/runs/$id/jobs?per_page=100" \
                --jq '[.jobs[] | select((.name | test("^Unit tests \\([0-9]+\\)$")) and .conclusion != "cancelled")] | length' \
                || echo 0)
              if [ "${n:-0}" -gt 0 ]; then covered=$id; break 2; fi
            done
            if [ "$attempt" -lt 7 ]; then sleep 15; fi
          done
          if [ -n "$covered" ]; then
            url="https://github.com/$REPO/actions/runs/$covered"
            echo "The PR's own Lint run on $HEAD_SHA already runs the unit shards: $url. Nothing dispatched."
            {
              echo "### Full CI already running in the PR's own checks"
              echo "The pull_request Lint run on \`$HEAD_SHA\` runs every suite, unit shards included: $url"
              echo "App suites and Moderator boot smoke follow their \`paths:\` filters, as on every push with the label on."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh workflow run lint.yml -R "$REPO" --ref "$HEAD_REF" -f only=all
          gh workflow run apps.yml -R "$REPO" --ref "$HEAD_REF"
          # moderator-boot.yml arrived in #7673: a branch cut before it has no such workflow, and the
          # dispatch answers 422. That must not fail the job after lint and apps were dispatched.
          gh workflow run moderator-boot.yml -R "$REPO" --ref "$HEAD_REF" \
            || echo "moderator-boot.yml not on this branch; rebase to get it"
          # Link the runs from this job's summary: it is the only place on the PR that reaches
          # them (see the header). A dispatch's run appears a few seconds after the call returns.
          sleep 10
          echo "### Full CI dispatched on \`$HEAD_REF\`" >> "$GITHUB_STEP_SUMMARY"
          for wf in lint.yml apps.yml moderator-boot.yml; do
            url=$(gh run list -R "$REPO" --workflow "$wf" --branch "$HEAD_REF" --event workflow_dispatch \
              --limit 1 --json url -q '.[0].url' || true)
            echo "$wf: ${url:-not found yet, see the Actions tab}"
            echo "- $wf: ${url:-not found yet, see the Actions tab}" >> "$GITHUB_STEP_SUMMARY"
          done
