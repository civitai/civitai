name: Full CI on label

# Adding the `full-ci` label to a PR starts the full test suite on it, right away.
#
# lint.yml and apps.yml read the label themselves on every PR run (opened, synchronize,
# reopened, ready_for_review): with it on, the six `Unit tests` shards run and the draft
# ESLint-only gate is lifted. What they cannot do without help is react to the label being
# ADDED, which is a `labeled` event. This file does that, by dispatching them on the PR branch,
# along with moderator-boot.yml, feed-go.yml, beacon-go.yml, app-index-go.yml, app-data-go.yml,
# content-policy-go.yml, registry-adapter-image.yml and storage-hook-runner-image.yml, which have
# the same draft gate: Lint always, the others only where their PR run would start (see "ONLY
# WHAT THE PR'S OWN RUN WOULD RUN").
#
# ── THE LABEL STAYS ON UNTIL THE FULL UNIT SUITE HAS PASSED ONCE ON THE PR ───────────────────
#
# lint.yml's `full-ci-done` job removes the label after a Lint run whose six unit shards all
# passed, on some commit of the PR, not necessarily its head: the PR's own run (it carries the
# label), or the dispatch below (it passes `pr`). So
# the label buys one PASSING full unit run; after that, pushes go back to the normal PR run (no
# unit shards, ESLint only on a draft). To ask again, re-add it. A cancelled, failed or skipped
# unit run leaves the label on, so the next push runs the shards again. (This job does not
# remove it itself: a run it found running can still be cancelled by the next push, since PR
# runs share a cancel-in-progress group, and then no full run would ever finish.)
#
# ── WHY A DISPATCHER, AND NOT `labeled` IN lint.yml / apps.yml ────────────────────────────────
#
# That was the first design, and it was measured live before being dropped. `labeled` fires for
# EVERY label, and GitHub has no trigger filter on the label name, so any other label starts a
# run whose jobs all skip. Those skipped jobs still create check-runs, with the SAME NAMES as the
# real ones, on the PR's head commit. `gh pr checks` keeps the newest check-run per name, so
# after someone added an unrelated label it showed `ESLint + Prettier (changed files)`,
# `Package unit tests`, `Component + geometry tests` and `App unit tests + typecheck` as
# `skipping` over a real run whose jobs had all passed, and exited 0. A real failure would have
# been covered the same way. (Giving the skipped jobs another name through an expression does not
# work: GitHub does not evaluate `name:` for a skipped job and shows the raw expression text.)
#
# Here, any other label starts only this workflow, whose one job skips under a name nothing else
# uses (`Start full CI on label`), so it overlays nothing.
#
# ── WHAT THE DISPATCHED RUNS TEST ─────────────────────────────────────────────────────────────
#
# A dispatch runs on the BRANCH HEAD, not on the PR's merge commit with its base, so this first
# full run tests the branch as pushed, except the suites it skips because the PR run on that
# commit passed them (see below): their verdict is the PR run's, on the merge commit.
#
# 🔴 ITS RESULTS ARE NOT IN THE PR'S CHECKS LIST. Measured: the dispatched runs' check-runs sit on
# the head commit (the commit's check-runs API, the Actions tab), but `gh pr checks` and the PR's
# status rollup list only pull_request-event runs, so they still show the draft run's skipped
# `Unit tests` there. This job's summary links the two runs; open `Start full CI on label` to
# reach them. Later PR runs (on push) test the merge commit as usual, with the unit shards
# until a full unit run has passed (see the label section above).
# The dispatched Lint run is `only: all`: every suite but ESLint, which is PR-only and already
# ran on the PR. Its concurrency group is the dispatch one, so it does not cancel the PR's own
# run in flight. The other workflows are dispatched only where their own PR run would start
# (next section).
#
# ── ONLY WHAT THE PR'S OWN RUN WOULD RUN ─────────────────────────────────────────────────────
#
# A dispatched run is not path-filtered (`paths:` applies to pull_request events only), so
# dispatching apps.yml, moderator-boot.yml and the rest on every labelled PR ran their suites on
# PRs that cannot affect them. For each of them the label changes only the draft gate, so this
# job dispatches one only when its pull_request run on this PR would start AND be held by that
# gate (scripts/ci/github-paths-filter.mjs, tested by scripts/__tests__/github-paths-filter.test.ts):
#   - a PR that is not a draft: none of them. Its own run of each on this commit is not
#     draft-gated, so it runs, or ran, the same jobs (on the merge commit rather than the branch
#     head, and apps.yml with its PR-only moderator scoping), or its paths filter skipped it.
#   - a draft PR: each one some changed file passes the `on.pull_request` `paths` (or
#     `paths-ignore`) filter of, read from the workflow file in the PR's merge commit, which is
#     the filter its PR runs use. GitHub's glob and `!` ordering rules; the changed files come
#     from the PR files API, with the old path of a rename too.
# Any error (the files API, an unreadable filter, a list at the API's 3,000-file cap) dispatches
# it, and the summary gives the reason for every workflow, dispatched or not. Lint is always
# dispatched: `full-ci-done` needs its unit shards.
#
# Not for fork PRs: their branch is not in this repo, so there is nothing here to dispatch on,
# and their token cannot dispatch anyway. The `if` skips them.
#
# ── NO DISPATCH WHEN THE PR'S OWN RUN ALREADY HAS THE SHARDS ─────────────────────────────────
#
# A PR opened WITH the label (`gh pr create --label full-ci`) gets `opened` and `labeled` at
# once. The `opened` Lint run already reads the label and starts the six `Unit tests` shards,
# so dispatching here too ran the whole suite twice on the same commit, which was most of what
# this job dispatched (measurement: docs/testing/reading-ci-results.md, "CI cost measurements").
#
# So before dispatching, this job looks for a pull_request Lint run on the PR's head commit with
# a `Unit tests (<n>)` job that was not cancelled (scripts/ci/full-ci-unit-shards.mjs, which
# scripts/__tests__/full-ci-label.test.ts runs against job lists). The `(<n>)` suffix is the
# test: GitHub expands the matrix only for a job whose `if` passed, and a skipped `unit` job is
# listed as plain `Unit tests`.
# If it finds one, the PR run is the full run, in the checks list, and nothing is dispatched;
# the summary links it. Otherwise (label added to an existing PR, the PR run not created yet
# after ~90 s, a docs-only PR the Lint `paths:` filter skips) it dispatches as before.
# On a skip, apps.yml and moderator-boot.yml are not dispatched either: their PR runs follow
# their `paths:` filters, exactly as on every later push.
#
# When it does dispatch Lint on a PR that is not a draft, the PR run on that commit has run (or
# is running) `Typecheck test files`, `Package unit tests` and the component shards. So the dispatch passes `skip_passed` and skips
# the suites that run passed (lint.yml, the `passed` job); the unit shards always run.

on:
  pull_request:
    branches: [main, release]
    types: [labeled]

permissions:
  contents: read

jobs:
  dispatch:
    name: Start full CI on label
    runs-on: ubuntu-latest
    if: github.event.label.name == 'full-ci' && github.event.pull_request.head.repo.full_name == github.repository
    # `actions: write` is what workflow_dispatch needs. A dispatch is the one event a
    # GITHUB_TOKEN may start another workflow with.
    # `pull-requests: read` lists the PR's changed files.
    permissions:
      actions: write
      contents: read
      pull-requests: read
    timeout-minutes: 5
    steps:
      # Only the two scripts the step below runs, and the workflow files whose paths filters it
      # reads. This is the PR's merge commit, so those are the filters its pull_request runs use.
      # No credentials are persisted: this job's token can dispatch workflows.
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            scripts/ci/full-ci-unit-shards.mjs
            scripts/ci/github-paths-filter.mjs
            .github/workflows
          sparse-checkout-cone-mode: false
          persist-credentials: false

      # The branch name reaches the shell through env, never interpolated into the script: a
      # branch name is attacker-chosen text, and `${{ }}` in `run:` is pasted in before the
      # shell parses it.
      - name: Dispatch Lint (only=all) and the suites the PR run would start, on the PR branch
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          DRAFT: ${{ github.event.pull_request.draft }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Does a pull_request Lint run on this head commit already run the unit shards? See the
          # header. Polled because the `opened` run can be created a few seconds after this job
          # starts; an API error counts as "not found", which falls back to dispatching. Polling
          # stops early once a run on this commit has decided its `unit` job and skipped it (the
          # plain `Unit tests` name): the label was added after that run, which is the case this
          # dispatch exists for, so waiting out the remaining polls would only delay it.
          covered=""
          for attempt in 1 2 3 4 5 6 7; do
            decided=false
            for id in $(gh api "repos/$REPO/actions/workflows/lint.yml/runs?event=pull_request&head_sha=$HEAD_SHA&per_page=20" \
                --jq '.workflow_runs[].id' || true); do
              counts=$(gh api "repos/$REPO/actions/runs/$id/jobs?per_page=100" \
                | node scripts/ci/full-ci-unit-shards.mjs || echo "0 0")
              read -r expanded skipped <<< "$counts"
              if [ "${expanded:-0}" -gt 0 ]; then covered=$id; break 2; fi
              if [ "${skipped:-0}" -gt 0 ]; then decided=true; fi
            done
            if [ "$decided" = true ]; then break; fi
            if [ "$attempt" -lt 7 ]; then sleep 15; fi
          done
          if [ -n "$covered" ]; then
            url="https://github.com/$REPO/actions/runs/$covered"
            echo "The PR's own Lint run on $HEAD_SHA already runs the unit shards: $url. Nothing dispatched."
            {
              echo "### Full CI already running in the PR's own checks"
              echo "The pull_request Lint run on \`$HEAD_SHA\` runs every suite, unit shards included: $url"
              echo "App suites and Moderator boot smoke follow their \`paths:\` filters, as on every push."
              echo "The \`full-ci\` label stays on until a full unit run passes on this PR (lint.yml, \`full-ci-done\`)."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # skip_passed: the dispatch skips the suites the PR run on this commit already passed
          # (lint.yml, the `passed` job). pr: lint.yml's `full-ci-done` job removes this PR's
          # label once the dispatch's unit shards pass. A branch cut before an input existed is
          # rejected with "HTTP 422: Unexpected inputs provided: [...]"; only then is it
          # dispatched again without, newest input first, and the summary says the dispatch
          # carries no `pr` (the label stays until a PR run's shards pass). Any other failure
          # fails this step, as a failed dispatch always did.
          nopr=""
          if ! err=$(gh workflow run lint.yml -R "$REPO" --ref "$HEAD_REF" -f only=all -f skip_passed=true -f pr="$PR" 2>&1 >/dev/null); then
            if ! grep -q 'Unexpected inputs provided' <<< "$err"; then
              echo "$err" >&2
              exit 1
            fi
            nopr=1
            gh workflow run lint.yml -R "$REPO" --ref "$HEAD_REF" -f only=all -f skip_passed=true \
              || gh workflow run lint.yml -R "$REPO" --ref "$HEAD_REF" -f only=all
          fi
          # The other workflows: each has the same draft gate as Lint, and the label lifts it. Each
          # is dispatched only when its own pull_request run would start on this PR (see the header,
          # "ONLY WHAT THE PR'S OWN RUN WOULD RUN"): never on a PR that is not a draft (its PR run
          # on this commit is not draft-gated, so it runs or ran them already), and otherwise only
          # when a changed file passes the workflow's own `on.pull_request` paths filter, read from
          # the workflow file by scripts/ci/github-paths-filter.mjs. Anything that goes wrong
          # reading the PR's files or a filter dispatches (fails open) and says why.
          others=(apps.yml moderator-boot.yml feed-go.yml beacon-go.yml app-index-go.yml app-data-go.yml
            content-policy-go.yml registry-adapter-image.yml storage-hook-runner-image.yml)
          changed="$RUNNER_TEMP/full-ci-changed-files.txt"
          # `previous_filename` too: a rename moves a file out of a path as well as into one. On a
          # failure the list is left empty, which the script treats as "dispatch everything".
          gh api --paginate "repos/$REPO/pulls/$PR/files?per_page=100" \
              --jq '.[] | .filename, (.previous_filename // empty)' > "$changed" \
            || { echo "Reading the PR's changed files failed; failing open." >&2; : > "$changed"
                 echo "Reading the PR's changed files failed, so every draft-gated workflow below was dispatched." >> "$GITHUB_STEP_SUMMARY"; }
          files=()
          for wf in "${others[@]}"; do files+=(".github/workflows/$wf"); done
          decisions=$(node scripts/ci/github-paths-filter.mjs --draft "$DRAFT" --changed "$changed" "${files[@]}" || true)
          declare -A verdict reason
          for wf in "${others[@]}"; do
            line=$(awk -F '\t' -v f=".github/workflows/$wf" '$1 == f' <<< "$decisions" | head -n 1)
            verdict[$wf]=run
            if [ "$(cut -f2 <<< "$line")" = skip ]; then verdict[$wf]=skip; fi
            r=$(cut -f3 <<< "$line")
            reason[$wf]="${r:-no decision from the filter check; failing open}"
          done
          for wf in "${others[@]}"; do
            if [ "${verdict[$wf]}" = skip ]; then
              echo "$wf: not dispatched: ${reason[$wf]}"
              continue
            fi
            echo "$wf: dispatching: ${reason[$wf]}"
            # apps.yml failing to dispatch fails the step, as it always did. A branch cut before
            # one of the others existed has no such workflow, and the dispatch answers 422: that
            # must not fail the job after the rest were dispatched.
            if [ "$wf" = apps.yml ]; then
              gh workflow run "$wf" -R "$REPO" --ref "$HEAD_REF"
            else
              gh workflow run "$wf" -R "$REPO" --ref "$HEAD_REF" \
                || echo "$wf not on this branch; rebase to get it"
            fi
          done
          # Link the runs from this job's summary: it is the only place on the PR that reaches
          # them (see the header). A dispatch's run appears a few seconds after the call returns.
          sleep 10
          echo "### Full CI dispatched on \`$HEAD_REF\`" >> "$GITHUB_STEP_SUMMARY"
          echo "The \`full-ci\` label stays on until a full unit run passes on this PR (lint.yml, \`full-ci-done\`)." >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$nopr" ]; then
            echo "This branch's lint.yml has no \`pr\` input, so the Lint dispatch carries none: the label stays on until a PR run's unit shards pass." >> "$GITHUB_STEP_SUMMARY"
          fi
          for wf in lint.yml "${others[@]}"; do
            if [ "$wf" != lint.yml ] && [ "${verdict[$wf]}" = skip ]; then
              echo "- $wf: not dispatched: ${reason[$wf]}" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi
            url=$(gh run list -R "$REPO" --workflow "$wf" --branch "$HEAD_REF" --event workflow_dispatch \
              --limit 1 --json url -q '.[0].url' || true)
            why=""
            if [ "$wf" != lint.yml ]; then why=" (${reason[$wf]})"; fi
            echo "$wf: ${url:-not found yet, see the Actions tab}"
            echo "- $wf: ${url:-not found yet, see the Actions tab}$why" >> "$GITHUB_STEP_SUMMARY"
          done
