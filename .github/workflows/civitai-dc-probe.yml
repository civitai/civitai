name: civitai-dc probe

# Temporary: proves the civitai-dc self-hosted runners accept jobs from this repo.
on:
  push:
    branches: [ci/civitai-dc-runners]
    paths: ['.github/workflows/civitai-dc-probe.yml']

permissions:
  contents: read

jobs:
  probe:
    if: github.repository == 'civitai/civitai'
    runs-on: civitai-dc
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        n: [1, 2, 3]
    steps:
      - name: Before checkout
        run: |
          echo "runner=$RUNNER_NAME os=$RUNNER_OS arch=$RUNNER_ARCH"
          echo "workspace=$GITHUB_WORKSPACE"; ls -la "$GITHUB_WORKSPACE" 2>&1 | head -20
          echo "marker:"; cat "$HOME/.civitai-dc-probe" 2>&1 || true
          echo "probe-$GITHUB_RUN_ID-${{ matrix.n }}" >> "$HOME/.civitai-dc-probe"
          ls "$RUNNER_TOOL_CACHE" 2>&1 | head
      - uses: actions/checkout@v4
      - name: Host
        run: |
          cat /etc/os-release | head -3; uname -a; whoami; id
          nproc; free -g; df -h "$GITHUB_WORKSPACE" | tail -1
          docker --version 2>&1; docker info --format '{{.ServerVersion}}' 2>&1 | tail -1
          for b in node npm pnpm corepack git curl jq python3 psql redis-server google-chrome chromium; do printf '%s: ' $b; (command -v $b && $b --version 2>&1 | head -1) || echo missing; done
          sudo -n true 2>&1 && echo sudo-ok || echo no-sudo
          ls ~/.cache/ms-playwright 2>&1 | head
          env | grep -iE '^(ImageOS|ImageVersion|AGENT_TOOLSDIRECTORY|RUNNER_)' | sort
