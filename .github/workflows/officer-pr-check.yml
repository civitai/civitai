name: officer-pr-check

# The second wall for pull requests opened by an officer agent's GitHub App: such a PR may
# change APPLICATION CODE ONLY (src/**, packages/**), never dependencies, lockfiles, schema,
# migrations, env files, containers, CI, hooks, scripts or agent instructions.
#
# Armed when the head branch starts with `officer/`, OR the PR author or the event's sender
# is a login listed in the BASE commit's .github/officer/bot-logins.txt, OR a commit between
# base and head has a listed login as its author or committer (the branch prefix is
# configurable on the agent side, so a name alone is not an identity). An armed PR whose
# base is not `main` fails. Every other PR is decided in seconds.
#
# What it checks when armed (.github/officer/officer_pr_check.py): every path the PR changes,
# adds, deletes or renames away from, against the merge ref's first parent (the base tip the
# PR lands on):
#   1. it is under src/ or packages/ (an allowlist);
#   2. it matches no glob of the BASE's .github/officer/forbidden-paths.txt, which is also the
#      list the agent's push gate (the first wall) reads, so the two walls cannot drift;
#   3. it is not a symlink or a submodule gitlink;
#   4. the PR adds or modifies at least one test file (`*.test.*` or `*.spec.*`): every
#      officer PR carries a regression test for what it fixes;
#   5. a path that is not a test file matches no glob of the BASE's
#      .github/officer/money-paths.txt (money, auth and gating code, case-insensitive): only
#      those files' tests may change;
#   6. it deletes no test file, and no modified test file has fewer `expect(` calls;
#   7. no line a test file gains skips, focuses, retries or re-times a test (`.skip`, `.only`,
#      `.todo`, `.fails`, `skipIf`, `runIf`, `retry:`, `testTimeout`, `timeout:`, ...).
# An empty diff fails. Tests under src/ and packages/ are application code here; a file under
# src/pages/ (a Next.js route) is never a test, whatever its name.
#
# The self-test (.github/officer/test_officer_pr_check.py, the PR's own copy) runs only on a
# PR that touches .github/officer/ or adds a top-level entry (`officer_pr_check.py
# selftest-needed`, the PR's copy): it shows the walls go red on what they exist to catch,
# and fails when a new top-level file or directory is not yet in forbidden-paths.txt (the
# push gate has no allowlist). Any other PR cannot change what it checks. Both PR-code steps
# run LAST, after arm and check, so PR code cannot influence either.
#
# 🔴 FAIL CLOSED: when armed, the checker, both lists and the logins all come from the BASE
# commit. If the base lacks one, the job fails; it never runs the PR's own copy. Before this
# file is on the base, arming falls back to the `officer/` prefix and the check fails closed.
#
# 🔴 What this does NOT protect: THIS FILE. GitHub runs a `pull_request` workflow from the
# PR's merge ref, so a PR that edits this workflow decides whether and how it runs. The walls
# for workflow tampering are the push gate (`.github` is on its list) and GitHub refusing a
# push under .github/workflows/ from an App token without the `workflows` permission, which
# the officer Apps are not granted.
#
# 🔴 This is a merge block only if branch protection on `main` requires this check, pinned
# to the GitHub Actions app (any App with checks:write could otherwise post a green
# `officer-pr-check`). Without that, a red here is a signal to the human reviewer, not a wall.
#
# `pull_request`, not `pull_request_target`: the PR's code runs with a read-only token and no
# secrets. Officer PRs are drafts, and `pull_request` runs on drafts.

on:
  pull_request:
    # `edited` fires on a base retarget, so a PR judged against another base is judged again.
    # No `branches:` filter: an officer PR against any other base must run here and fail.
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read

concurrency:
  group: officer-pr-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  officer-pr-check:
    name: officer-pr-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The merge ref with its full commit history (HEAD^1 is the base tip, HEAD^2 the PR
      # head) so arming can read every commit in base..head; `tree:0` fetches commits only,
      # and trees and blobs on demand.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: tree:0
          persist-credentials: false

      - name: Resolve base and head
        id: refs
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_COMMITS: ${{ github.event.pull_request.commits }}
        run: |
          set -euo pipefail
          [ "$(git rev-parse --is-shallow-repository)" = "false" ] \
            || { echo "::error::the checkout is shallow; arming cannot see every commit (fail closed)"; exit 2; }
          [ "$(git rev-list --parents -n1 HEAD | wc -w)" -eq 3 ] \
            || { echo "::error::HEAD is not a two-parent merge ref; cannot tell base from head (fail closed)"; exit 2; }
          [ "$(git rev-parse HEAD^2)" = "$HEAD_SHA" ] \
            || { echo "::error::the merge ref's second parent is not the PR head ${HEAD_SHA} (fail closed)"; exit 2; }
          echo "base=$(git rev-parse HEAD^1)" >>"$GITHUB_OUTPUT"
          echo "base $(git rev-parse --short HEAD^1), head $(git rev-parse --short HEAD^2), merge $(git rev-parse --short HEAD)"
          echo "commits in base..head: $(git rev-list --count HEAD^1..HEAD^2) (the PR reports ${PR_COMMITS})"

      # Decided from the BASE commit's checker and logins, so a PR cannot choose whether it is
      # checked. A base without the checker falls back to the `officer/` prefix alone.
      # An armed PR whose base is not main fails here.
      - name: Arm (officer/ head branch, or a listed officer bot as author, sender or committer)
        id: arm
        env:
          BASE: ${{ steps.refs.outputs.base }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF_NAME: ${{ github.base_ref }}
          HEAD_REF_NAME: ${{ github.head_ref }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          SENDER: ${{ github.event.sender.login }}
        run: |
          set -euo pipefail
          if git cat-file -e "${BASE}:.github/officer/officer_pr_check.py" 2>/dev/null; then
            git show "${BASE}:.github/officer/officer_pr_check.py" >"$RUNNER_TEMP/officer_pr_check.py"
            python3 "$RUNNER_TEMP/officer_pr_check.py" arm "$BASE" "$HEAD_SHA" "$BASE_REF_NAME" "$HEAD_REF_NAME" "$AUTHOR" "$SENDER" \
              | tee "$RUNNER_TEMP/arm.out"
          else
            case "$HEAD_REF_NAME" in officer/*) echo "armed=true" ;; *) echo "armed=false" ;; esac | tee "$RUNNER_TEMP/arm.out"
          fi
          grep -m1 '^armed=' "$RUNNER_TEMP/arm.out" >>"$GITHUB_OUTPUT"

      - name: Officer PR check (allowed roots, forbidden paths, symlinks, tests added, none deleted or weakened)
        if: steps.arm.outputs.armed == 'true'
        env:
          BASE: ${{ steps.refs.outputs.base }}
        run: |
          set -euo pipefail
          # The checker comes from the BASE commit and from nowhere else (fail closed).
          git cat-file -e "${BASE}:.github/officer/officer_pr_check.py" 2>/dev/null \
            || { echo "::error::.github/officer/officer_pr_check.py is not on the base; refusing to run the PR's copy"; exit 2; }
          git show "${BASE}:.github/officer/officer_pr_check.py" >"$RUNNER_TEMP/officer_pr_check.py"
          python3 "$RUNNER_TEMP/officer_pr_check.py" check "$BASE" HEAD

      # 🔴 PR-HEAD CODE RUNS ONLY FROM HERE ON. Everything above (checkout, refs, arm, check)
      # runs git and the BASE commit's checker only, so the PR's code cannot write
      # $GITHUB_ENV, $GITHUB_PATH or $RUNNER_TEMP before the verdict that matters is reached,
      # and a failed check skips these steps. The PR's own copy decides whether its own
      # self-test runs, which is all it gates.
      - name: Does the self-test apply (touches .github/officer/ or adds a top-level entry)
        id: selftest
        env:
          BASE: ${{ steps.refs.outputs.base }}
        run: |
          set -euo pipefail
          python3 .github/officer/officer_pr_check.py selftest-needed "$BASE" HEAD | tee "$RUNNER_TEMP/selftest-needed.out"
          grep -m1 '^selftest=' "$RUNNER_TEMP/selftest-needed.out" >>"$GITHUB_OUTPUT"

      - name: Self-test (forbidden-path grammar, fixtures, top-level coverage)
        if: steps.selftest.outputs.selftest == 'true'
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/selftest.out"
          python3 .github/officer/test_officer_pr_check.py >"$out" 2>&1 || { cat "$out"; exit 1; }
          cat "$out"
          # COUNT the result, never trust the exit code alone: a run of 0 tests is a failure.
          n="$(sed -n 's/^Ran \([0-9][0-9]*\) tests\? in .*/\1/p' "$out")"
          [ -n "$n" ] && [ "$n" -ge 60 ] && grep -qx 'OK' "$out" \
            || { echo "::error::self-test ran ${n:-0} tests (expected at least 60) or did not report OK"; exit 1; }
