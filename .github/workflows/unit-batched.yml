name: Unit tests (main batch)

# Batched verification of the unit and component + geometry suites on `main`. A push to `main`
# runs neither; this does, on the schedule below, and only when `main` moved: it dispatches lint.yml
# with `only: unit` on `main` unless `main`'s head is the commit the last batch run already
# verified. In that one run, lint.yml's `unit-verify` and `component-verify` jobs post the verdicts
# as `Unit tests (main batch)` and `Component tests (main batch)` commit statuses, bisecting a red
# to the first bad merge commit. See lint.yml's header ("THE UNIT SUITE IS THE EXCEPTION", and the
# `(main batch)` status contract) and scripts/ci/unit-batched.mjs.
#
# The same dispatched run also verifies the batch's other suites (lint.yml's `batch-suites` job,
# scripts/ci/batch-suites.mjs): it dispatches each one whose paths changed since the last green
# batch and posts a `Batch suites (main batch)` commit status.
#
# THE CADENCE IS THIS CRON LINE. :41 keeps it off the top of the hour.
# scripts/__tests__/main-branch-ci-coverage.test.ts bounds the interval (MAX_BATCH_HOURS);
# widening it fails that guard until the guard changes too.
on:
  schedule:
    - cron: '41 */2 * * *'
  # For a manual "verify main now"; it skips, like the scheduled run, when main has not moved.
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: unit-batch-gate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    name: Dispatch the unit suite if main moved
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            scripts/ci/unit-batched.mjs
            .nvmrc
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Gate and dispatch
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/unit-batched.mjs gate "$GITHUB_REF_NAME"
