name: feed-go

# apps/feed-go is a Go module (a port of `image.getImagesAsPostsInfinite`, and in
# shadow only of `image.getInfinite`, `model.getAll` and `GET /api/v1/images`; see apps/feed-go/DESIGN.md). It is not a pnpm workspace member (no package.json), so none of the
# Node suites see it: apps.yml's typecheck and suite ledgers enumerate apps by package.json.
# This workflow is its only gate: gofmt, vet, the unit tests with coverage floors, the integration
# tests and a build of the binary (job `test`); golangci-lint (`lint`); govulncheck (`vuln`); go.mod
# tidiness and module checksums (`mod`); a run of every fuzz target for a fixed number of
# executions (`fuzz`); and an allocs/op regression gate on the benchmarks against the merge-base
# (`bench`). The gate scripts live in apps/feed-go/ci.
#
# The integration tier (`-tags integration`, files under that build tag only) runs against a real
# Redis Cluster (3 masters), a real Postgres 16 and a real ClickHouse (the image-metrics populate)
# started in this job; the plain unit run never compiles those files, so it stays hermetic.
#
# Job `flipt-parity` gates a second, test-only Go module, packages/civitai-flipt/parity/go: the Go
# half of the Node <-> Go Flipt parity check (packages/civitai-flipt/parity/README.md), here because
# feed-go is the Go service that will adopt go.flipt.io/flipt-client. The Node half runs in lint.yml
# (`Package unit tests`). The workflow also triggers on packages/civitai-flipt/parity/** for it.
#
# A draft PR skips this job, as in apps.yml, unless it carries the `full-ci` label; full-ci.yml
# dispatches this workflow when the label is added. A push to `main` is unfiltered.
on:
  pull_request:
    branches: [main, release]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'apps/feed-go/**'
      - 'packages/civitai-flipt/parity/**'
      - '.github/workflows/feed-go.yml'
  push:
    branches: [main]
    paths:
      - 'apps/feed-go/**'
      - 'packages/civitai-flipt/parity/**'
      - '.github/workflows/feed-go.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: feed-go-${{ github.event_name == 'workflow_dispatch' && format('dispatch-{0}', github.ref) || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: feed-go vet + test + build
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft || contains(github.event.pull_request.labels.*.name, 'full-ci')
    timeout-minutes: 20
    services:
      postgres:
        # postgres:16 (16.16), pinned by its multi-arch index digest.
        image: postgres:16@sha256:63e83b5a3dc36a917dccb76fe1bd2ac51f1ec9c1deb47ff20d4f04233bf6eae9
        env:
          POSTGRES_USER: feedgo
          POSTGRES_PASSWORD: feedgo-integ
          POSTGRES_DB: feedgo_integ
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U feedgo -d feedgo_integ"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    defaults:
      run:
        working-directory: apps/feed-go
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: apps/feed-go/go.mod
          cache-dependency-path: apps/feed-go/go.sum

      - name: gofmt
        run: |
          set -euo pipefail
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::Not gofmt-formatted (run gofmt -w apps/feed-go):"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: |
          go vet ./...
          go vet -tags integration ./...

      # `-json` so the step below can count the tests that actually ran: a package that silently
      # compiled to zero tests would otherwise still exit 0. The cover profile feeds the floors below.
      - name: go test
        run: |
          status=0
          go test -race -count=1 -covermode=atomic -coverprofile=cover.out -json ./... > test.json || status=$?
          jq -j 'select(.Action=="output") | .Output' test.json
          exit $status

      - name: Assert the tests ran
        if: always()
        run: |
          set -euo pipefail
          passed=$(jq -r 'select(.Action=="pass" and .Test!=null) | .Test' test.json | wc -l)
          failed=$(jq -r 'select(.Action=="fail" and .Test!=null) | .Test' test.json | wc -l)
          pkgs=$(jq -r 'select(.Action=="pass" and .Test==null) | .Package' test.json | sort -u | wc -l)
          echo "passed tests: $passed, failed tests: $failed, passing packages: $pkgs"
          # Positive control: a count below these floors means tests stopped being discovered, not that
          # they passed. Raise the package floor when a package gains its first test.
          [ "$failed" -eq 0 ]
          [ "$pkgs" -ge 16 ]
          [ "$passed" -ge 430 ]

      # Statement coverage of the unit run (each package's own tests), per package and in total,
      # against the ratchet floors in ci/coverage-floors.txt. A second instrument prints its own total
      # (`go tool cover -func`) so the script's arithmetic can be cross-checked in the log.
      - name: Coverage floors
        run: |
          set -euo pipefail
          python3 ci/coverage_gate.py cover.out ci/coverage-floors.txt test.json
          go tool cover -func=cover.out | tail -n 1

      - name: Upload the coverage profile
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: feed-go-coverage
          path: apps/feed-go/cover.out
          if-no-files-found: warn

      # A cluster on the host network: a cluster node announces its own address to clients, and on the
      # services bridge network that is a container IP the runner's cluster client cannot always reach.
      - name: Start Redis Cluster
        env:
          # redis:7.4 (7.4.12), pinned by its multi-arch index digest.
          REDIS_IMAGE: redis:7.4@sha256:2e3eb11462c4e3759e6972678dd051d150ff54b1e60714b3c33b701260172a90
        run: |
          set -euo pipefail
          for port in 7000 7001 7002; do
            docker run -d --name "feedgo-redis-$port" --network host "$REDIS_IMAGE" \
              redis-server --port "$port" --cluster-enabled yes --cluster-config-file "nodes-$port.conf" \
              --cluster-node-timeout 5000 --appendonly no --save ''
          done
          for port in 7000 7001 7002; do
            for i in $(seq 1 60); do
              if docker exec feedgo-redis-7000 redis-cli -p "$port" ping 2>/dev/null | grep -qx PONG; then break; fi
              [ "$i" -lt 60 ] || { echo "::error::redis :$port never answered"; exit 1; }
              sleep 1
            done
          done
          docker exec feedgo-redis-7000 redis-cli --cluster create 127.0.0.1:7000 127.0.0.1:7001 127.0.0.1:7002 \
            --cluster-replicas 0 --cluster-yes
          for port in 7000 7001 7002; do
            for i in $(seq 1 60); do
              if docker exec feedgo-redis-7000 redis-cli -p "$port" cluster info | grep -q '^cluster_state:ok'; then break; fi
              [ "$i" -lt 60 ] || { echo "::error::redis :$port never reached cluster_state:ok"; exit 1; }
              sleep 1
            done
          done
          masters=$(docker exec feedgo-redis-7000 redis-cli -p 7000 cluster nodes | grep -c master)
          echo "cluster masters: $masters"
          [ "$masters" -eq 3 ]

      # The image-metrics populate's table (testdata/integration/clickhouse.sql), on the host network
      # like the cluster. A user with a password, as production has; the read client sends GETs.
      - name: Start ClickHouse
        env:
          # clickhouse/clickhouse-server:25.8 (the 25.8 LTS line), pinned by its multi-arch index digest.
          CLICKHOUSE_IMAGE: clickhouse/clickhouse-server:25.8@sha256:0152dd511befe6a2c2ef53e930726179669b08116da78500b37c51c96ff5ee77
        run: |
          set -euo pipefail
          docker run -d --name feedgo-clickhouse --network host --ulimit nofile=262144:262144 \
            -e CLICKHOUSE_USER=feedgo -e CLICKHOUSE_PASSWORD=feedgo-integ -e CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1 \
            "$CLICKHOUSE_IMAGE"
          for i in $(seq 1 90); do
            if [ "$(curl -s http://127.0.0.1:8123/ping || true)" = "Ok." ]; then break; fi
            [ "$i" -lt 90 ] || { echo "::error::clickhouse never answered /ping"; docker logs feedgo-clickhouse 2>&1 | tail -n 50; exit 1; }
            sleep 1
          done
          curl -sS --fail-with-body -u feedgo:feedgo-integ --data-binary @testdata/integration/clickhouse.sql http://127.0.0.1:8123/
          tables=$(curl -sS --fail-with-body -u feedgo:feedgo-integ --data-binary "SELECT count() FROM system.tables WHERE name = 'entityMetricDailyAgg_v2'" http://127.0.0.1:8123/)
          echo "clickhouse tables: $tables"
          [ "$tables" -eq 1 ]

      - name: Apply the integration schema
        run: |
          set -euo pipefail
          docker exec -i "${{ job.services.postgres.id }}" \
            psql -v ON_ERROR_STOP=1 -U feedgo -d feedgo_integ < testdata/integration/schema.sql

      # -run 'Integration' keeps the unit tests (already run above) out of this step.
      - name: go test (integration)
        env:
          FEED_GO_TEST_REDIS_CLUSTER: 127.0.0.1:7000,127.0.0.1:7001,127.0.0.1:7002
          FEED_GO_TEST_PG_URL: postgres://feedgo:feedgo-integ@127.0.0.1:5432/feedgo_integ?sslmode=disable
          FEED_GO_TEST_CLICKHOUSE_URL: http://127.0.0.1:8123
          FEED_GO_TEST_CLICKHOUSE_USER: feedgo
          FEED_GO_TEST_CLICKHOUSE_PASSWORD: feedgo-integ
        run: |
          status=0
          go test -race -count=1 -tags integration -run 'Integration' -json ./... > integration.json || status=$?
          jq -j 'select(.Action=="output") | .Output' integration.json
          exit $status

      - name: Assert the integration tests ran
        if: always()
        run: |
          set -euo pipefail
          top='select(.Action=="pass" and .Test!=null and (.Test|contains("/")|not))'
          failed=$(jq -r 'select(.Action=="fail" and .Test!=null) | .Test' integration.json | wc -l)
          hydrate=$(jq -r "$top | select(.Package|endswith(\"/internal/hydrate\")) | .Test" integration.json | wc -l)
          feed=$(jq -r "$top | select(.Package|endswith(\"/internal/feed\")) | .Test" integration.json | wc -l)
          models=$(jq -r "$top | select(.Package|endswith(\"/internal/modelfeed\")) | .Test" integration.json | wc -l)
          passed=$(jq -r "$top | .Test" integration.json | wc -l)
          echo "passed integration tests: $passed (hydrate $hydrate, feed $feed, modelfeed $models), failed: $failed"
          # Positive control: below these floors (the TestIntegration* functions per package) the tests
          # stopped being discovered — a wrong tag or -run filter runs zero tests and exits 0.
          [ "$failed" -eq 0 ]
          [ "$hydrate" -ge 33 ]
          [ "$feed" -ge 12 ]
          [ "$models" -ge 5 ]

      - name: go build
        run: CGO_ENABLED=0 go build -trimpath -o /tmp/feed-go ./cmd/feed-go

      - name: Redis Cluster logs
        if: failure()
        run: for port in 7000 7001 7002; do docker logs "feedgo-redis-$port" 2>&1 | tail -n 50; done

      - name: ClickHouse logs
        if: failure()
        run: docker logs feedgo-clickhouse 2>&1 | tail -n 80

  # Node <-> Go Flipt parity (packages/civitai-flipt/parity/README.md). Offline: every client reads
  # parity/snapshot.json through an in-process fetcher or transport; the network is used only to
  # download the clients.
  #   1. the pinned Go client (parity/go/go.mod) must evaluate every case in parity/expected.json to
  #      exactly the result the pinned Node client recorded there;
  #   2. the newest Go client and the newest JS client must each differ from expected.json on exactly
  #      the cases parity/latest-divergences.json lists, with exactly those results, so they also
  #      agree with each other. Bump FLIPT_LATEST_* and regenerate that file from this job's
  #      artifact when a newer release ships;
  #   3. the pinned JS client, installed from npm, must agree with expected.json (the same check the
  #      Node test makes, from outside the pnpm workspace).
  flipt-parity:
    name: Flipt Node/Go parity
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft || contains(github.event.pull_request.labels.*.name, 'full-ci')
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/civitai-flipt/parity/go
    env:
      FLIPT_LATEST_GO: v1.6.0
      FLIPT_LATEST_JS: 0.7.0
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: packages/civitai-flipt/parity/go/go.mod
          cache-dependency-path: packages/civitai-flipt/parity/go/go.sum

      - name: gofmt + vet + go.mod tidy
        run: |
          set -euo pipefail
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::Not gofmt-formatted: $unformatted"
            exit 1
          fi
          go vet ./...
          if ! go mod tidy -diff; then
            echo "::error::parity/go go.mod/go.sum are not tidy (run go mod tidy there)"
            exit 1
          fi
          go mod verify

      - name: Pinned Go client agrees with Node
        run: |
          status=0
          go test -race -count=1 -json ./... > "$RUNNER_TEMP/pinned.json" || status=$?
          jq -j 'select(.Action=="output") | .Output' "$RUNNER_TEMP/pinned.json"
          exit $status

      # Positive control: both tests ran and passed (a package that compiled to zero tests exits 0).
      - name: Assert the pinned tests ran
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          passed=$(jq -r 'select(.Action=="pass" and .Test!=null) | .Test' "$RUNNER_TEMP/pinned.json" | sort | tr '\n' ' ')
          echo "passed: $passed"
          [ "$passed" = "TestParityDetectsASnapshotChange TestParityWithNode " ]

      - name: Newest Go client against the recorded divergences
        if: ${{ !cancelled() }}
        env:
          FLIPT_PARITY_EXPECT: latest
          FLIPT_PARITY_LATEST_JS: ${{ env.FLIPT_LATEST_JS }}
        run: |
          set -euo pipefail
          go get "go.flipt.io/flipt-client@$FLIPT_LATEST_GO"
          go mod tidy
          grep -F "go.flipt.io/flipt-client $FLIPT_LATEST_GO" go.mod
          status=0
          FLIPT_PARITY_WRITE_DIVERGENCES="$RUNNER_TEMP/latest-divergences.json" \
            go test -count=1 -run '^TestParityWithNode$' -json ./... > "$RUNNER_TEMP/latest.json" || status=$?
          jq -j 'select(.Action=="output") | .Output' "$RUNNER_TEMP/latest.json"
          passed=$(jq -r 'select(.Action=="pass" and .Test=="TestParityWithNode") | .Test' "$RUNNER_TEMP/latest.json" | wc -l)
          [ "$status" -eq 0 ] && [ "$passed" -eq 1 ]

      # The divergences the newest Go client computed: commit it as parity/latest-divergences.json
      # when the recorded list is stale (a newer FLIPT_LATEST_*).
      - name: Upload the computed divergences
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: flipt-parity-latest-divergences
          path: ${{ runner.temp }}/latest-divergences.json
          if-no-files-found: warn

      - uses: actions/setup-node@v7
        if: ${{ !cancelled() }}
        with:
          node-version-file: .nvmrc

      - name: Pinned and newest JS clients against the record
        if: ${{ !cancelled() }}
        working-directory: .
        run: |
          set -euo pipefail
          pinned=$(jq -r .clients.js packages/civitai-flipt/parity/expected.json)
          status=0
          for v in "$pinned" "$FLIPT_LATEST_JS"; do
            dir="$RUNNER_TEMP/flipt-client-js-$v"
            mkdir -p "$dir"
            npm install --prefix "$dir" --no-save --no-audit --no-fund --ignore-scripts "@flipt-io/flipt-client-js@$v"
            node packages/civitai-flipt/parity/js-client-check.mjs "$dir/node_modules/@flipt-io/flipt-client-js" || status=1
          done
          exit $status

  lint:
    name: feed-go golangci-lint
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft || contains(github.event.pull_request.labels.*.name, 'full-ci')
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: apps/feed-go/go.mod
          cache-dependency-path: apps/feed-go/go.sum

      # Configuration: apps/feed-go/.golangci.yml (v2 format; it also lints the integration tier). Any
      # finding fails the step.
      - name: golangci-lint
        # golangci/golangci-lint-action v9.3.0
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a
        with:
          version: v2.15.0
          working-directory: apps/feed-go

  vuln:
    name: feed-go govulncheck
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft || contains(github.event.pull_request.labels.*.name, 'full-ci')
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/feed-go
    steps:
      - uses: actions/checkout@v7

      # The newest 1.26 patch, not go.mod's minimum: the standard library govulncheck checks is the
      # toolchain's, and the image is built on the golang:1.26 line (apps/feed-go/Dockerfile), so a
      # stdlib advisory fixed in a later 1.26 patch is the Dockerfile digest's to bump, not this scan's.
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          check-latest: true
          cache-dependency-path: apps/feed-go/go.sum

      # Exits non-zero when a vulnerability is REACHABLE from this module's code (symbol-level);
      # advisories in modules or packages it never calls are listed but do not fail the step.
      - name: govulncheck
        run: |
          go version
          go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 -tags integration ./...

  mod:
    name: feed-go go.mod tidy + verify
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft || contains(github.event.pull_request.labels.*.name, 'full-ci')
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/feed-go
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: apps/feed-go/go.mod
          cache-dependency-path: apps/feed-go/go.sum

      # `go mod tidy -diff` changes nothing and exits non-zero (printing the diff) when go.mod/go.sum
      # are not tidy; `go mod verify` checks the downloaded modules against go.sum.
      - name: go mod tidy
        run: |
          if ! go mod tidy -diff; then
            echo "::error::go.mod/go.sum are not tidy (run go mod tidy in apps/feed-go)"
            exit 1
          fi
      - name: go mod verify
        run: go mod verify

  # Each fuzz target for a fixed number of executions, one at a time (`-fuzz` takes one target in one
  # package). A fixed count, not a time budget: -fuzztime in seconds can end in a "context deadline
  # exceeded" failure with no crasher, and makes coverage depend on runner speed. Their seed corpora (testdata/fuzz/<Target>
  # in each package, plus the f.Add seeds) also run in the plain `go test` of job `test`. A crasher is
  # written to the package's testdata/fuzz/<Target>/ and uploaded; commit it as a regression seed with
  # the fix.
  fuzz:
    name: feed-go fuzz
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft || contains(github.event.pull_request.labels.*.name, 'full-ci')
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/feed-go
    env:
      # Minimization of each new interesting input, as a count of executions (`Nx`). The default is
      # 60s per input, and a worker minimizing reports no executions until it returns (internal/fuzz
      # worker.minimize), so a long minimization would stall the run.
      FUZZ_MINIMIZE: 100x
      # <package dir>:<target>:<executions>. The first step fails when this list and the Fuzz functions
      # in the module differ in either direction, so a new target cannot go unfuzzed and a renamed
      # one cannot silently fuzz nothing (`-fuzz` matching no target exits 0). Counts are sized for
      # roughly 20 s per target on a shared runner; re-measure from the log of a green run before
      # changing one.
      FUZZ_TARGETS: >-
        internal/auth:FuzzTokenFromCookieHeader:170000
        internal/auth:FuzzVerify:95000
        internal/devalue:FuzzRoundTrip:200000
        internal/devalue:FuzzString:600000
        internal/feed:FuzzParse:180000
        internal/feed:FuzzParseInfinite:140000
        internal/hydrate:FuzzMetaEntry:150000
        internal/hydrate:FuzzUnpack:230000
        internal/modelfeed:FuzzParse:210000
        internal/shadow:FuzzCompare:420000
        internal/shadow:FuzzCompareJSON:620000
        internal/superjson:FuzzAppendString:570000
        internal/superjson:FuzzSerialize:260000
        internal/trpc:FuzzDecodeEnvelope:210000
        internal/v1models:FuzzParseList:160000
        internal/v1models:FuzzResolveFileName:70000
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: apps/feed-go/go.mod
          cache-dependency-path: apps/feed-go/go.sum

      - name: The fuzz targets are the listed set
        run: |
          set -euo pipefail
          go test -list '^Fuzz' -json ./... \
            | jq -r 'select(.Action=="output" and (.Output|startswith("Fuzz"))) | (.Package|sub(".*/apps/feed-go/";"")) + ":" + (.Output|rtrimstr("\n"))' \
            | sort > "$RUNNER_TEMP/fuzz-found.txt"
          printf '%s\n' $FUZZ_TARGETS | cut -d: -f1,2 | sort > "$RUNNER_TEMP/fuzz-listed.txt"
          echo "found $(wc -l < "$RUNNER_TEMP/fuzz-found.txt") fuzz targets, $(wc -l < "$RUNNER_TEMP/fuzz-listed.txt") listed"
          if ! diff -u "$RUNNER_TEMP/fuzz-listed.txt" "$RUNNER_TEMP/fuzz-found.txt"; then
            echo "::error::FUZZ_TARGETS in feed-go.yml and the module's Fuzz functions differ (- listed, + found)"
            exit 1
          fi
          [ -s "$RUNNER_TEMP/fuzz-found.txt" ]

      - name: Fuzz
        run: |
          set -o pipefail # the go test status must survive the tee
          status=0
          for t in $FUZZ_TARGETS; do
            IFS=: read -r pkg name count <<< "$t"
            echo "::group::$pkg:$name ($count executions)"
            corpus="$pkg/testdata/fuzz/$name"
            before=$(find "$corpus" -type f 2>/dev/null | sort || true)
            if ! go test -run '^$' -fuzz "^${name}\$" -fuzztime "${count}x" -fuzzminimizetime "$FUZZ_MINIMIZE" "./$pkg" 2>&1 | tee "$RUNNER_TEMP/fuzz-$name.log"; then
              status=1
            fi
            echo "::endgroup::"
            after=$(find "$corpus" -type f 2>/dev/null | sort || true)
            new=$(comm -13 <(printf '%s\n' "$before") <(printf '%s\n' "$after") | sed '/^$/d')
            if [ -n "$new" ]; then
              echo "::error::$pkg:$name found a crasher, uploaded as feed-go-fuzz-crashers: $new"
              status=1
            elif ! grep -q "^ok " "$RUNNER_TEMP/fuzz-$name.log"; then
              echo "::error::$pkg:$name failed without writing a crasher (see its log above)"
              status=1
            fi
          done
          exit $status

      - name: Upload crashers
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: feed-go-fuzz-crashers
          path: apps/feed-go/internal/*/testdata/fuzz/
          if-no-files-found: ignore

  # Benchmarks on the PR head and on its merge-base, `-benchmem -count=6`, compared with benchstat
  # (report only: ns/op on a shared runner is noise). The gate is allocs/op only (deterministic):
  # ci/allocs_gate.py fails a benchmark whose every head sample exceeds every base sample by > 5%
  # (complete separation of 6 vs 6, Mann-Whitney p = 0.002 < 0.05). A benchmark with no baseline
  # (new in the PR) is reported, not gated.
  bench:
    name: feed-go benchmarks (allocs/op gate)
    runs-on: ubuntu-latest
    # PRs only: the allocs/op compare needs a PR base, and a push to main has none.
    if: github.event_name == 'pull_request' && (!github.event.pull_request.draft || contains(github.event.pull_request.labels.*.name, 'full-ci'))
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/feed-go
    env:
      BENCH_ARGS: -run=^$ -bench=. -benchmem -count=6 -benchtime=200ms
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: apps/feed-go/go.mod
          cache-dependency-path: apps/feed-go/go.sum

      # The merge-base with the PR's target branch (the parent if HEAD is already the merge-base).
      - name: Check out the merge-base
        env:
          BASE_BRANCH: ${{ github.base_ref || 'main' }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$BASE_BRANCH"
          base=$(git merge-base "origin/$BASE_BRANCH" HEAD)
          if [ "$base" = "$(git rev-parse HEAD)" ]; then base=$(git rev-parse HEAD^1); fi
          echo "head $(git rev-parse HEAD), base $base"
          git worktree add --detach "$RUNNER_TEMP/base" "$base"

      - name: Benchmarks (base)
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/base/apps/feed-go"
          go test $BENCH_ARGS ./... | tee "$RUNNER_TEMP/base.txt"

      - name: Benchmarks (head)
        run: |
          set -euo pipefail
          go test $BENCH_ARGS ./... | tee "$RUNNER_TEMP/head.txt"

      - name: benchstat (report)
        run: |
          set -euo pipefail
          go run golang.org/x/perf/cmd/benchstat@v0.0.0-20261009192801-be2c69fb417e \
            base="$RUNNER_TEMP/base.txt" head="$RUNNER_TEMP/head.txt" | tee "$RUNNER_TEMP/benchstat.txt"
          { echo '### feed-go benchstat (base = merge-base)'; echo '```'; cat "$RUNNER_TEMP/benchstat.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: allocs/op gate
        run: |
          set -euo pipefail
          # Positive control: every benchmark produced its 6 samples (11 benchmarks: superjson Serialize,
          # SerializeBuffer, SerializeColdStart/page and SerializeColdStart/owned-small, hydrate Unpack,
          # TagIDs and HydratePage/pipelined, feed BuildImages, shadow Compare/golden, Compare/page50
          # and CompareJSON). A filter or build change that drops benchmarks would otherwise pass as "no
          # regression"; raise the count with each new benchmark.
          samples=$(grep -c ' allocs/op' "$RUNNER_TEMP/head.txt" || true)
          echo "head samples with allocs/op: $samples"
          [ "$samples" -ge 66 ]
          python3 ci/allocs_gate.py "$RUNNER_TEMP/base.txt" "$RUNNER_TEMP/head.txt"
