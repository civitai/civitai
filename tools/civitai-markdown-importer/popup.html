<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        width: 280px;
        margin: 0;
        padding: 14px;
        font: 13px/1.45 -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        color: #e8e8ea;
        background: #1a1b1e;
      }
      h1 {
        margin: 0 0 4px;
        font-size: 14px;
      }
      p {
        margin: 0 0 12px;
        color: #909296;
      }
      label {
        display: block;
        padding: 9px 12px;
        text-align: center;
        border: 1px dashed #5c5f66;
        border-radius: 6px;
        cursor: pointer;
      }
      label:hover {
        border-color: #4dabf7;
        color: #4dabf7;
      }
      input {
        display: none;
      }
      #status {
        margin: 12px 0 0;
        min-height: 1em;
      }
      #status.ok {
        color: #51cf66;
      }
      #status.err {
        color: #ffa94d;
      }
    </style>
  </head>
  <body>
    <h1>Import Markdown</h1>
    <p>Open a Civitai article Create or Edit page first.</p>
    <label for="file">Choose a .md file</label>
    <input id="file" type="file" accept=".md,.markdown,.mdown,.mkd,text/markdown" />
    <p id="status"></p>
    <script src="popup.js"></script>
  </body>
</html>
