<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Knights of New Order</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=EB+Garamond:wght@400;500&display=swap"
    />
    <!-- Shown when the app itself cannot render (the root layout failed), so it carries its own styles. -->
    <style>
      :root {
        color-scheme: dark;
        --gold: #c9a24a;
        --parchment: #e8dcc0;
        --muted: #a89c80;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 2rem 1.5rem 5rem;
        text-align: center;
        color: var(--parchment);
        background: radial-gradient(ellipse 60% 55% at 50% 42%, #33250f 0%, #14110d 70%);
        font: 18px/1.6 'EB Garamond', Georgia, serif;
      }
      .kicker {
        margin: 0 0 1.25rem;
        font: 700 1rem/1 'Cinzel', Georgia, serif;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }
      h1 {
        margin: 0;
        max-width: 36rem;
        font: 700 clamp(1.6rem, 5vw, 2.5rem) / 1.15 'Cinzel', Georgia, serif;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }
      .rule {
        display: flex;
        align-items: center;
        gap: 1rem;
        width: min(22rem, 80%);
        margin: 1.5rem 0;
        color: var(--gold);
      }
      .rule::before,
      .rule::after {
        content: '';
        flex: 1;
        height: 1px;
        background: #6f5b2f;
      }
      .rule i {
        width: 8px;
        height: 8px;
        border: 1px solid currentColor;
        transform: rotate(45deg);
      }
      p {
        margin: 0;
        max-width: 32rem;
        color: var(--muted);
        font-size: 1.25rem;
        line-height: 1.5;
      }
      a {
        display: inline-flex;
        align-items: center;
        min-height: 2.75rem;
        margin-top: 1.75rem;
        padding: 0.65rem 1.7rem;
        border-radius: 4px;
        background: var(--gold);
        color: #14110d;
        text-decoration: none;
        font: 700 0.95rem/1.2 'Cinzel', Georgia, serif;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }
      a:focus-visible {
        outline: 2px solid var(--gold);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <p class="kicker">The Order stumbled · %sveltekit.status%</p>
    <h1>Something broke on our side</h1>
    <div class="rule" aria-hidden="true"><i></i></div>
    <p>It is not something you did. Try again in a moment.</p>
    <a href="/">Return to the hall</a>
  </body>
</html>
