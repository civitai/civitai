[project]
name = "search-service"
version = "0.0.1"
description = "Read-only Qdrant proxy with SymSpell correction and query embedding"
requires-python = ">=3.12,<3.13"
# Pinned exactly; requirements.txt mirrors these for the image.
dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.34.0",
  "httpx==0.28.1",
  "symspellpy==6.9.0",
]

[project.optional-dependencies]
dev = ["pytest==8.3.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
